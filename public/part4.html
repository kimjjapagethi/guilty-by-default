<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default</title>
<style>@font-face{font-family:'Orbit';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Orbit/Orbit-Regular.ttf') format('truetype')}@font-face{font-family:'PP Frama';font-weight:200;font-display:swap;src:url('fonts/PPFrama/PPFrama-Extralight.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:400 700;font-display:swap;src:url('fonts/PPFrama/PPFrama-Regular.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:800 900;font-display:swap;src:url('fonts/PPFrama/PPFrama-Black.otf') format('opentype')}@font-face { font-family: 'Source Code Variable'; font-weight: 200 900; font-style: normal; font-display: swap; src: url('fonts/source%20code%20variable/SourceCodeVariable-Roman.otf') format('opentype'); }@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url('fonts/PretendardVariable.woff2') format('woff2-variations')}</style>
<style>
:root{--fg:#EDE6DF;--dim:rgba(237,230,223,.55);--rasp:#AB073D;--hot:#ff5b86;--sky:#D5EDF1;--ink:#460E21;
  --font:'Orbit','PP Frama','Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;word-break:keep-all}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:#000;overflow:hidden}
#mod{position:absolute;left:50%;top:50%;width:760px;transform:translate(-50%,-46%);padding:56px 64px 48px;background:var(--ink);border:2px solid rgba(213,237,241,.45);box-shadow:0 30px 90px rgba(0,0,0,.7);opacity:0;transition:opacity .6s,transform .8s cubic-bezier(.2,.8,.2,1);text-align:center}
#mod.on{opacity:1;transform:translate(-50%,-50%)}
#mod small{display:block;font-size:20px;letter-spacing:.16em;color:#ff9db8}
#mod h2{margin:14px 0 0;font-size:52px;line-height:1.25;font-weight:700;color:#fff;text-wrap:balance}
#mod .hr{height:1px;background:rgba(213,237,241,.3);margin:36px 0 32px}
#mod .nfc{width:84px;height:84px;margin:0 auto 18px;display:block}
#mod p{font-size:30px;line-height:1.55;color:var(--sky);text-wrap:balance}
#mod button{margin-top:40px;font:inherit;font-size:28px;font-weight:700;color:#fff;background:var(--rasp);border:0;padding:18px 70px;cursor:pointer;transition:transform .2s}
#mod button:hover{transform:translateY(-3px)}
#mod.nt small,#mod.nt h2,#mod.nt .hr{display:none}
</style>
<script>
(function(){
  if(parent===window){window.__go=function(f){f()};return}
  var d=document.documentElement;d.classList.add('hold');
  window.__go=function(f){addEventListener('message',function h(e){if(e.data&&e.data.gbd==='go'){removeEventListener('message',h);d.classList.remove('hold');f()}});try{parent.postMessage({gbd:'ready'},'*')}catch(_){}};
})();
</script>
<style>html.hold *{animation-play-state:paused!important}</style>
</head>
<body>
<div id="stage">
  <div id="mod" class="nt">
    <small>당신의 유형</small><h2 id="ty"></h2><div class="hr"></div>
    <svg class="nfc" viewBox="0 0 84 84" fill="none" stroke="#D5EDF1" stroke-width="3.5" stroke-linecap="round"><rect x="26" y="10" width="32" height="64" rx="6"/><path d="M38 66h8"/><path d="M12 30a26 26 0 0 0 0 24M4 24a36 36 0 0 0 0 36" opacity=".7"/><path d="M72 30a26 26 0 0 1 0 24M80 24a36 36 0 0 1 0 36" opacity=".7"/></svg>
    <p>화면 옆 NFC 태그에 휴대폰을 대면,<br>더 자세한 내용을 볼 수 있어요.</p>
    <button id="go" type="button">다음으로</button>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
const FAST=new URLSearchParams(location.search).get('fast')==='1';
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms*0.05,30):ms));
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
const post=m=>{try{parent.postMessage(m,'*')}catch(_){}};
let lp=0;function poke(){const n=Date.now();if(n-lp>800){lp=n;post({gbd:'poke'})}}
document.addEventListener('pointerdown',poke,true);document.addEventListener('mousemove',poke,true);
addEventListener('message',e=>{const d=e.data;if(d&&d.gbd==='type'&&d.name){$('#ty').textContent=d.name;$('#mod').classList.remove('nt')}});
let done=false;
function next(){if(done)return;done=true;post({gbd:'part4-next'})}
$('#go').addEventListener('click',next);
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='r'||e.key==='R'){if(parent!==window)post({gbd:'restart'});else location.reload();return}if(e.key==='Enter'||e.key===' '){e.preventDefault();next()}});
window.__go(async function(){
  await sleep(600);$('#mod').classList.add('on');
});
</script>
</body>
</html>
