  now:['AI 에이전트가 암호화폐 지갑을 통해 자산과 연결된 사례가 있다. Truth Terminal은 약 $656K 규모로 보도됐으나 사람 중개자가 있었다(Arkham, 2024.10).','Project Vend에서는 AI가 가게를 운영했지만 손실은 운영사가 감당했다.'],
  try:[],unk:'AI가 스스로 소유하고 지급할 수 있는 자산의 법적 성격',
  src:[['Arkham Intelligence, Truth Terminal, 2024.10.15','검색 결과 기반'],['Anthropic, Project Vend, 2025','기억 기반']]},
 {k:'자기 통제',s:'행동 인지 · 수정 권한',lv:2,fault:'대안',
  now:['Replit 사고에서 에이전트는 명시적 지시를 어기고 DB를 삭제했다. 이후 개발사가 환경 분리 같은 통제 장치를 사람이 추가했다.','자신의 행동을 멈추거나 바꿀 권한은 여전히 AI가 아니라 사람에게 있다.'],
  try:[],unk:'다른 행동을 선택할 수 있었는지',
  src:[['Replit 사고, 2025.7','기억 기반 · 재확인 필요']]},
];

const E=E_ALL.filter(e=>['응보','억제','교정'].includes(e.k));
const ACT=[['행위','스스로 그 일을 실행했는가'],['예견','결과를 미리 내다볼 수 있었는가'],['자율','남의 지시 없이 스스로 정했는가'],['대안','다르게 행동할 수 있었는가'],['규범 이해','해서는 안 되는 일임을 이해했는가'],['자기 귀속','그 행동을 자기 것으로 받아들이는가']];
const DORD=[2,5,4,9,8,11,0,1]; /* 선행 조건 8개(C의 인덱스), 효과와의 교차를 줄인 순서 */
const meter=l=>`<div style="display:flex;gap:4px;margin-top:6px">${[1,2,3,4].map(n=>`<i style="width:26px;height:6px;background:${n<=l?'#D5EDF1':'rgba(237,230,223,.2)'}"></i>`).join('')}</div>`;
/* 노드 배치 */
const N=[]; /* {id,type,x,y,w,h,html,kind} */
ACT.forEach((a,i)=>N.push({id:'a'+i,t:'a',x:56,y:130+i*84,w:190,h:60,i,html:`<b>${a[0]}</b>`}));
N.push({id:'b',t:'b',x:290,y:290,w:200,h:190,html:`<b>행위 주체<br>= 책임 주체<br><span style="color:var(--hot)">귀책 사유</span></b>`});
E.forEach((e,i)=>N.push({id:'e'+i,t:'e',x:535,y:190+i*150,w:130,h:90,i,html:`<b>${e.k}</b>`}));
DORD.forEach((ci,r)=>N.push({id:'c'+ci,t:'c',x:745,y:125+r*62,w:330,h:52,i:ci,html:`<b style="font-size:22px">${C[ci].k} <span style="font-size:15px;font-weight:500;color:var(--dim)">${C[ci].s}</span></b>${meter(C[ci].lv)}`}));
const EDGES=[];
ACT.forEach((_,i)=>EDGES.push(['a'+i,'b']));
E.forEach((e,i)=>{EDGES.push(['b','e'+i]);e.c.forEach(ci=>EDGES.push(['e'+i,'c'+ci]))});
const byId={};N.forEach(n=>byId[n.id]=n);
$('#map').innerHTML=N.map(n=>`<div class="nd n${n.t.toUpperCase()}" id="n${n.id==='b'?'B':n.id}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w}px;height:${n.h}px">${n.html}</div>`).join('');
const elOf=id=>document.querySelector(`.nd[data-id="${id}"]`);
const SV='http://www.w3.org/2000/svg';
EDGES.forEach(([f,t])=>{const a=byId[f],b=byId[t];
  const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,mx=(x1+x2)/2;
  const p=document.createElementNS(SV,'path');p.setAttribute('d',`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`);p.dataset.f=f;p.dataset.t=t;p.dataset.s=(t==='b'?1:(f==='b'?2:3));if(f[0]==='e')p.dataset.eff=f.slice(1);
  $('#lines').appendChild(p)});
const adj={},radj={};EDGES.forEach(([f,t])=>{(adj[f]=adj[f]||[]).push(t);(radj[t]=radj[t]||[]).push(f)});
function chain(id){const s=new Set([id]);(function up(x){(radj[x]||[]).forEach(y=>{if(!s.has(y)){s.add(y);up(y)}})})(id);(function dn(x){(adj[x]||[]).forEach(y=>{if(!s.has(y)){s.add(y);dn(y)}})})(id);return s}
/* 단계별 등장 */
let method=null;
function typeSetup(el,html){
  el.innerHTML=html+'<span class="nx2" style="visibility:hidden">▼</span>';
  const sp=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();[...n.nodeValue].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;s.style.visibility='hidden';f.appendChild(s);sp.push(s)});n.parentNode.replaceChild(f,n)});
  return sp;
}
let capH=null;
function caption(text){
  return new Promise(res=>{
    $('#cap').classList.add('on');$('#cap').classList.remove('q');
    const el=$('#capt');const sp=typeSetup(el,text);let k=0,done=false,tm;
    const fin=()=>{done=true;clearTimeout(tm);sp.forEach(x=>x.style.visibility='visible');const n=el.querySelector('.nx2');if(n)n.style.visibility='visible'};
    const step=()=>{if(done)return;if(k<sp.length)sp[k++].style.visibility='visible';if(k>=sp.length){fin();return}tm=setTimeout(step,38)};step();
    capH=()=>{if(!done){fin();return}capH=null;res()};
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const show=id=>elOf(id).classList.add('on');
const showEdges=f=>document.querySelectorAll('#lines path').forEach(x=>{if(f(x))x.classList.add('on')});
function litEdges(f){document.querySelectorAll('#lines path').forEach(x=>x.classList.toggle('lit',!!f&&f(x)))}
const seen=new Set();const NEED=2;
function updGo(){$('#go').classList.toggle('on',seen.size>=NEED);$('#gh').textContent=ready&&seen.size<NEED?`${NEED}곳 이상 눌러보면 넘어갈 수 있습니다 · ${seen.size} / ${NEED}`:''}
let ready=false;
const li=a=>a.map(x=>`<li>${x}</li>`).join('');
function clear(){document.querySelectorAll('.nd').forEach(e=>e.classList.remove('sel','lit','dimn'));document.querySelectorAll('#lines path').forEach(p=>p.classList.remove('lit','dimp'))}
function pick(id){
  if(!ready)return;
  clear();const cs=chain(id);seen.add(id);elOf(id).classList.add('seen');
  N.forEach(n=>{const e=elOf(n.id);if(n.id===id)e.classList.add('sel');else if(cs.has(n.id))e.classList.add('lit');else e.classList.add('dimn')});
  document.querySelectorAll('#lines path').forEach(p=>{if(cs.has(p.dataset.f)&&cs.has(p.dataset.t)&&(id===p.dataset.f||id===p.dataset.t||chainEdge(id,p)))p.classList.add('lit');else p.classList.add('dimp')});
  panel(id);updGo();
}
function chainEdge(id,p){const cs=chain(id);return cs.has(p.dataset.f)&&cs.has(p.dataset.t)}
function panel(id){
  const n=byId[id];let h='';
  if(n.t==='a'){const a=ACT[n.i];h=`<h4 style="margin-top:0">행위 주체의 조건 · 2부</h4><h2>${a[0]}</h2><p style="margin-top:10px">${a[1]}?</p><h4>이 지도에서</h4><p>이 조건을 갖춘 AI는 행위 주체로 볼 수 있고, 그때 잘못에 대한 귀책 사유가 성립합니다.</p>`}
  else if(n.t==='b'){h=`<h4 style="margin-top:0">귀책 사유</h4><h2>AI가 행위 주체라면</h2><p style="margin-top:10px">행위 · 예견 · 자율 · 대안 · 규범 이해 · 자기 귀속, 여섯 조건을 갖춘 AI에게는 잘못의 책임을 물을 수 있습니다.</p><h4>다음 질문</h4><p>그렇다면 책임을 어떻게 지게 할 것인가. 사회가 요구하는 처벌의 효과는 응보, 억제, 교정입니다.</p>`}
  else if(n.t==='e'){const e=E[n.i];h=`<h4 style="margin-top:0">처벌 효과</h4><h2>${e.k}</h2><h4>지금의 AI가 하는 것</h4><p>${e.now}</p>${e.try?`<h4>책임을 묻기 위한 시도</h4><ul>${li(e.try)}</ul>`:''}<h4>필요한 선행 조건 · 팀의 해석</h4><ul>${li(e.c.map(c=>`${C[c].k} · ${LV[C[c].lv]}`))}</ul>${e.src&&e.src.length?`<h4>출처</h4>${e.src.map(x=>`<div class="src">${x[0]}<br><small>[${x[1]}]</small></div>`).join('')}`:''}`}
  else{const c=C[n.i];h=`<h4 style="margin-top:0">선행 조건</h4><h2>${c.k} <span style="font-size:20px;font-weight:500;color:var(--dim)">${c.s}</span></h2><div style="display:flex;gap:10px;align-items:center;margin-top:8px">${meter(c.lv)}<span style="font-size:17px;color:var(--sky);font-weight:600;margin-top:6px">${LV[c.lv]}</span></div>${c.fault?`<div class="bd">AI의 잘못을 따질 때도 쓰인 조건 · ${c.fault}</div>`:''}<h4>지금 확인된 것</h4><ul>${li(c.now)}</ul>${c.try.length?`<h4>책임을 묻기 위한 시도</h4><ul>${li(c.try)}</ul>`:''}<h4>아직 모르는 것</h4><ul>${li([c.unk])}</ul><h4>출처</h4>${c.src.map(s=>`<div class="src">${s[0]}<br><small>[${s[1]}]</small></div>`).join('')}`}
  $('#pn').innerHTML=h;$('#pn').scrollTop=0;
}
$('#pn').innerHTML=`<div class="e">점을 눌러보세요.<br>이어진 선이 밝아지고, 지금의 AI가 그 조건에서 어디쯤인지 볼 수 있습니다.</div>`;
function mark(){
  const M={retr:'응보',det:'억제',corr:'교정'};
  const ms=(method&&method!=='none')?method.split('+'):[];
  E.forEach((e,i)=>{const code=Object.keys(M).find(k=>M[k]===e.k);if(ms.includes(code)){const el=elOf('e'+i);el.classList.add('mine');el.insertAdjacentHTML('afterbegin','<span class="mk">당신의 선택</span>')}});
}
addEventListener('message',e=>{const d=e.data||{};if(d.gbd==='method'){method=d.method||null;mark()}});
document.addEventListener('click',e=>{
  if(capH){capH();return}
  if(e.target.closest('#go')){if(seen.size>=NEED){$('#tag').classList.add('on');setTimeout(()=>post({gbd:'part4-next'}),4500)}return}
  const n=e.target.closest('.nd');if(n)pick(n.dataset.id);
});
window.__go(async function(){
  await sleep(500);
  $('#yr').classList.add('on');
  await caption('다시 2026년입니다. 지금의 AI는, 책임을 질 수 있는 자리에 어디까지 와 있을까요?');
  $('#yr').classList.remove('on');await sleep(900);
  $('#ca').classList.add('on');
  await caption('먼저 행위 주체입니다. 2부에서 살핀 여섯 가지가, AI가 행위 주체가 되기 위한 조건이었습니다.');
  ACT.forEach((_,i)=>show('a'+i));
  await sleep(300);
  await caption('다만 행위 주체라는 것만으로는 부족합니다. 행위 주체가 곧 책임 주체여야, 비로소 귀책 사유가 성립하죠.');
  show('b');$('#cb').classList.add('on');showEdges(x=>x.dataset.t==='b');
  await sleep(300);
  await caption('그렇다면 책임은 어떻게 지게 할까요. 사회가 요구하는 처벌의 효과는 크게 응보, 억제, 교정입니다.');
  E.forEach((_,i)=>show('e'+i));$('#cc').classList.add('on');showEdges(x=>x.dataset.f==='b');
  await sleep(300);
  const EFF=[
   '응보는 잘못한 만큼 대가를 치르게 하는 일입니다. 그러려면 AI가 고통과 감정을 느끼고, 법적으로도 하나의 존재여야 하죠.',
   '억제는 다음 잘못을 막는 일입니다. 위험을 알아채고, 배우고, 스스로 멈출 수 있어야 가능합니다.',
   '교정은 잘못을 고쳐 나아지게 하는 일입니다. 스스로 배우고, 기억하고, 자신을 통제할 수 있어야 하죠.'];
  for(let i=0;i<3;i++){
    litEdges(x=>x.dataset.eff===String(i));
    await caption(EFF[i]);
    $('#cd').classList.add('on');
    E[i].c.forEach(c=>show('c'+c));showEdges(x=>x.dataset.eff===String(i));
    litEdges(x=>x.dataset.eff===String(i));
    await sleep(500);
  }
  litEdges(null);
  await caption('2026년 현재, 어떤 조건은 징후가 보이고 어떤 조건은 아직 연구 단계입니다. 점을 눌러 확인해 보세요. 연결은 우리 팀의 해석입니다.');
  $('#cap').classList.remove('on');
  ready=true;$('#pn').classList.add('on');$('#go').classList.add('show');updGo();
});
</script>
