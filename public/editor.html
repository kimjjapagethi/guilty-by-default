.hint { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }

.ln.cursel { border-color: var(--burgundy); }
.ln .no { font-weight: 800; padding-top: 7px; text-align: center; cursor: pointer; }

.pvc .cap, .pvc .hit { position: absolute; }
.pvc .cap .tx { min-height: 0; }
.pvn { font-size: 12px; color: var(--muted); margin-top: 6px; }
.up { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.msg { font-size: 13px; color: var(--burgundy); }
</style></head>
<body>
