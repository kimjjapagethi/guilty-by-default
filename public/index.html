<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guilty by Default</title>
<link rel="stylesheet" href="ds.css">
<style>
@font-face { font-family: 'Source Code Variable'; font-weight: 200 900; font-style: normal; font-display: swap; src: url('fonts/source%20code%20variable/SourceCodeVariable-Roman.otf') format('opentype'); }
@font-face { font-family: 'Orbit'; font-weight: 400; font-style: normal; font-display: swap; src: url('fonts/Orbit/Orbit-Regular.ttf') format('truetype'); }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
#canvas { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; transform: translate(-50%, -50%); display: flex; flex-direction: column;
  padding: 30px 90px 80px; box-sizing: border-box; background: var(--bg); color: var(--ink); }
#scroller { flex: 1; min-height: 0; overflow: hidden; }
#scroller::-webkit-scrollbar { display: none; }
html.zoomon #scroller { overflow: visible; } /* 책임 확대 장면: 캔버스 여백에 잘리지 않고 화면 전체를 쓴다 */
#stage { min-height: 100%; display: flex; flex-direction: column; text-align: center; position: relative; }
h1[tabindex="-1"]:focus { outline: none; }

/* ---- 대기 / 경고 / 안내 (기존 유지) ---- */
.attract { flex: 1; display: grid; grid-template-columns: 720px 1fr; grid-template-rows: 1fr auto; text-align: center; min-height: 0; column-gap: 40px; }
.attract-title { grid-area: 1 / 1; align-self: center; }
.attract-art { grid-area: 1 / 2 / 3 / 3; overflow: hidden; display: grid; place-items: center; align-content: center; min-height: 0; }
.attract-art svg.vec { width: 100%; height: 100%; max-height: 760px; transform: scale(1.1); display: block; }
.attract-art svg.vec path { fill: var(--attract-line); fill-rule: evenodd; }
.attract-art video { width: 100%; max-height: 760px; object-fit: contain; display: block; filter: brightness(1.03); }
.attract-art img { max-width: 100%; max-height: 760px; display: block; transition: opacity .45s; }
.attract.cover .attract-title, .attract.cover .attract-art { display: none; } .attract.cover .attract-foot { display: none; position: fixed; left: 0; right: 0; bottom: 84px; z-index: 2; } .attract.cover .attract-hint { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
#atthint { position: fixed; left: 0; right: 0; top: calc(100vh - 40px); transform: translateY(-50%); margin: 0; text-align: center; z-index: 5; color: #fff; font-size: 22px; font-weight: 600; letter-spacing: .02em; pointer-events: none; animation: blink 2.4s ease-in-out infinite; }
#coverlay { position: fixed; inset: 0; background: transparent; z-index: 0; } #coverlay .coverimg { position: absolute; left: 0; top: calc((100vh - 100vw / 2.55) / 2); width: 100vw; height: calc(100vw / 2.55); object-fit: cover; display: block; }
html.covbg, html.covbg body { background: #460E21 !important; transition: none; } html.covbg #canvas, html.covbg #scroller, html.covbg #stage { background: transparent !important; transition: none !important; }
.attract-art .bob { animation: bob 2.6s ease-in-out infinite; }
.attract-dev { font-size: var(--fs-cap); color: var(--muted); margin: 24px 0 0; }
.attract-foot { grid-area: 2 / 1; padding-bottom: 64px; }
.attract-hint { font-size: 24px; font-weight: 600; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.7); margin: 8px 0 0; animation: blink 2.4s ease-in-out infinite; }
@keyframes blink { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
.warn { flex: 1; display: grid; place-items: center; text-align: center; min-height: 0; }
.warn p { font-size: 50px; line-height: 1.4; color: var(--ink); margin: 0; }
.warn p.sub { margin-top: 14px; font-size: 40px; color: var(--muted); }
.logo { display: block; width: 260px; height: auto; margin: 0 auto 28px; } .logo.big { width: 680px; margin: 0 auto; } .logo.inv { width: 300px; margin-bottom: 40px; filter: brightness(0) invert(1); opacity: .9; }
.eyebrow { font-family: var(--font-display); font-weight: 500; font-size: 56px; letter-spacing: -.01em; color: var(--accent); margin: 0; }
.seq p { opacity: 0; animation: rise 1.1s ease forwards; margin: 0 auto 34px; max-width: 800px; }
.seq p.lead, .lead { font-size: 46px; font-weight: 700; line-height: 1.35; }
.rs { opacity: 0; animation: rise 1.1s ease forwards; }
.mid { margin: auto 0; }
.tri-note { margin-top: 36px; font-size: var(--fs-small); color: var(--muted); line-height: 1.5; }
.tri { background: var(--bg); position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; width: 640px; margin: 18px auto 0; border: 1.5px solid var(--muted); border-radius: 12px; overflow: hidden; }
.tri span { padding: 22px 0; font-size: 22px; font-weight: 600; color: var(--muted); } .tri span + span { border-left: 1.5px solid var(--muted); }
.guide-line { position: absolute; left: 50%; top: 0; bottom: 0; width: 0; border-left: 3px dashed color-mix(in srgb, var(--muted) 55%, transparent); -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 18%, transparent 31%, transparent 56%, #000 66%, #000 78%, transparent 88%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, #000 18%, transparent 31%, transparent 56%, #000 66%, #000 78%, transparent 88%, transparent 100%); pointer-events: none; }
.guide-tx { display: grid; place-items: center; text-align: center; flex: 1; gap: 20px; align-content: center; padding-bottom: 80px; }
.guide-tx p { margin: 0; } .guide-tx .big { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h1); line-height: 1.3; }
.guide-halves { display: grid; grid-template-columns: 1fr 1fr; position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none; }
.guide-halves div { display: grid; place-items: center; font-size: var(--fs-small); font-weight: 600; color: var(--muted); padding-top: 250px; }
/* How to Play 두 장면: 글자 전반을 줄인다 */
.howto .eyebrow { font-size: 34px; }
.howto .seq p.lead, .howto .lead { font-size: 30px; line-height: 1.45; }
.howto .seq p { margin-bottom: 22px; }
.howto .guide-tx .big { font-size: 40px; }
.howto .tri-note { font-size: 22px; margin-top: 24px; }
.howto .guide-halves div { font-size: 22px; }
.howto .guide-hint { font-size: 20px; }
.guide-hint { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font-size: var(--fs-small); color: var(--muted); pointer-events: none; animation: blink 2.4s ease-in-out infinite; }

/* ---- 홈 칩 ---- */
#home { position: fixed; left: 14px; top: 14px; transform: none; z-index: 30; font: inherit; font-size: 24px; color: #fff; mix-blend-mode: difference; background: transparent; border: 0; border-radius: 999px; padding: 8px; cursor: pointer; line-height: 0; display: flex; align-items: center; overflow: hidden; transition: background .35s, color .35s, padding .45s; }
#home svg { width: 36px; height: 36px; }
#home .lb { display: block; line-height: 1.4; white-space: nowrap; max-width: 0; opacity: 0; margin-left: 0; transition: max-width .7s cubic-bezier(.2,.8,.2,1), opacity .45s, margin .45s; }
#home.arm { mix-blend-mode: normal; color: var(--on-accent); background: var(--accent); padding: 8px 22px 8px 8px; }
#home.arm .lb { max-width: 560px; opacity: 1; margin-left: 12px; }

/* ---- 선택 영역 / 계속 ---- */
.scene { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; padding-bottom: 96px; }
.zspace { height: 40px; margin-top: auto; flex: none; }
.zones { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; z-index: 3; }
.zone { border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end; padding: 0 8px 28px; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.zone:first-child { justify-content: flex-start; }
.zone:last-child { justify-content: flex-end; text-align: right; }
.zone:active { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.zone .lab { font-size: var(--fs-body); font-weight: 700; line-height: 1.3; color: var(--ink); max-width: 92%; padding: 18px 26px; border: 3px solid var(--line); border-radius: 999px; background: var(--bg); }
.zones.late { visibility: hidden; animation: zin .1s linear 4.8s forwards; } @keyframes zin { to { visibility: visible; } }
.zones.late .lab { opacity: 0; animation: rise 1s ease 4.8s forwards; }
.tapnext { position: fixed; inset: 0; z-index: 3; border: 0; background: transparent; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding: 0 0 14px; font: inherit; font-size: var(--fs-small); color: var(--muted); }
.tapnext span { animation: blink 2.4s ease-in-out infinite; }
.tapnext:not(.hit) span { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); font-size: 22px; line-height: 1; white-space: nowrap; }
.partchip { align-self: center; font-size: var(--fs-cap); font-weight: 700; color: var(--accent); letter-spacing: .06em; margin: 0 0 var(--sp-2); }
.cnt { margin: 6px 0 0; font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---- 1부: 이 세계가 된 과정 ---- */
.yearbig { font-size: 104px; margin: 0; line-height: 1; transition: color .4s; }
.seats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px; margin: 22px 0 0; }
.seat { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.seat .fig { position: relative; width: 100%; height: 220px; border-radius: 28px; background: var(--soft); overflow: hidden; display: grid; place-items: center; border: 3px solid transparent; }
.seat.ai .fig { background: var(--surface); border-color: var(--accent); }
.seat.user .fig { border-color: var(--accent); }
.seat .role { font-size: var(--fs-small); font-weight: 700; }
.seat .rt { font-size: var(--fs-cap); color: var(--muted); margin-top: -8px; min-height: 1.4em; }
.seat .pp { height: 165px; width: auto; aspect-ratio: 20 / 36; fill: currentColor; color: var(--ink); display: block; }
.seat .rb { position: absolute; inset: 0; display: grid; place-items: center; }
.seat .rb svg { height: 180px; width: auto; }
.seat .pe { position: absolute; inset: 0; display: grid; place-items: center; background: var(--soft); }
.seat.sw .pe { animation: unzip 1.2s ease-in-out forwards; animation-delay: calc(.25s + var(--n, 0) * .35s); }
.seat.sw .zl { position: absolute; left: 50%; top: 0; width: 0; border-left: 3px dashed var(--ink); height: 0; animation: zteeth 1.2s ease-in-out forwards; animation-delay: calc(.25s + var(--n, 0) * .35s); }
.seat.sw .zp { position: absolute; left: 50%; top: 0; width: 18px; height: 26px; margin-left: -9px; border-radius: 5px; background: var(--accent); border: 3px solid var(--ink); animation: zpull 1.2s ease-in-out forwards; animation-delay: calc(.25s + var(--n, 0) * .35s); }
@keyframes unzip { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(100% 0 0 0); } }
@keyframes zteeth { to { height: 100%; } } @keyframes zpull { to { top: calc(100% - 26px); } }
.seats.sm .fig { height: 130px; border-radius: 20px; } .seats.sm .pp { height: 92px; } .seats.sm .rb svg { height: 100px; } .seats.sm .role { font-size: var(--fs-cap); } .seats.sm { margin-top: 0; gap: 10px; }
.wcap { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h2); line-height: 1.3; margin: 26px 0 0; text-wrap: balance; min-height: 2.6em; }
.wcap em { font-style: normal; color: var(--accent); }
#scroller.shake { animation: shk .55s linear; }
@keyframes shk { 0%, 100% { transform: none; } 12% { transform: translate(calc(var(--amp) * -1), calc(var(--amp) * .4)); } 28% { transform: translate(var(--amp), calc(var(--amp) * -.5)); } 44% { transform: translate(calc(var(--amp) * -.8), 0); } 60% { transform: translate(calc(var(--amp) * .6), calc(var(--amp) * .3)); } 78% { transform: translate(calc(var(--amp) * -.3), 0); } }

/* ---- 공통 카드 ---- */
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
.cols2 .colL, .cols2 .colR { min-width: 0; }
.hl { text-align: center; }
.react { margin-top: 28px; }
.pan2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left; }
.pan { background: var(--soft); border-radius: 28px; padding: 28px 30px; }
.pan h3 { margin: 0 0 14px; font-family: var(--font-display); font-size: var(--fs-body); }
.pan ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; font-size: var(--fs-small); line-height: 1.4; }
.pan li::before { content: "· "; color: var(--accent); font-weight: 800; }
.pan.on { background: var(--surface); } .pan.off { opacity: .85; } .pan.off li { color: var(--muted); }
.airobot { width: 250px; height: 320px; margin: 0 auto; } .airobot.bob { animation: bob 2.6s ease-in-out infinite; }
.logbox { text-align: left; background: var(--soft); border: 3px solid var(--line); border-radius: 28px; padding: 20px 32px; font-size: var(--fs-small); line-height: 1.5; font-variant-numeric: tabular-nums; }
.logbox .k { color: var(--muted); display: inline-block; min-width: 4.8em; }
.logbox .hot { color: var(--accent); font-weight: 800; }
.logbox .row { opacity: 0; animation: rise .8s ease forwards; }
.optrow { display: grid; gap: 14px; margin-top: 4px; }
.opt { display: grid; grid-template-columns: 70px 1fr auto; gap: 18px; align-items: center; text-align: left; background: var(--soft); border: 3px solid transparent; border-radius: 22px; padding: 18px 26px; font-size: var(--fs-small); }
.opt b { font-family: var(--font-display); font-size: var(--fs-h2); } .opt .pr { color: var(--muted); font-size: var(--fs-cap); }
.opt.pick { border-color: var(--accent); background: var(--surface); } .opt.pick .pr { color: var(--accent); font-weight: 800; }
.bigword { font-family: var(--font-display); font-weight: 800; font-size: 210px; line-height: 1; margin: 0; color: var(--accent); letter-spacing: -.02em; }
.defn { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h1); line-height: 1.3; margin: 24px 0 0; text-wrap: balance; }
.defn2 { font-size: var(--fs-body); color: var(--muted); margin: 26px 0 0; }

/* ---- 책임 따라가기 ---- */
.chain { display: flex; align-items: stretch; justify-content: center; gap: 0; margin: 0 auto; width: 100%; }
.node { flex: 1 1 0; min-width: 0; background: var(--soft); border-radius: 26px; padding: 26px 18px; text-align: center; opacity: 0; animation: rise .9s ease forwards; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.node b { font-family: var(--font-display); font-size: var(--fs-body); } .node span { font-size: var(--fs-small); color: var(--muted); line-height: 1.4; }
.arr { width: 44px; flex: none; align-self: center; border-top: 4px dashed var(--line); opacity: 0; animation: rise .6s ease forwards; }
.cuffwrap { flex: none; margin: 0 0 0 6px; opacity: 0; animation: rise 1s ease forwards; align-self: center; }
.cuff { width: 130px; height: 160px; transform-origin: 50% 0; animation: swing 2.6s ease-in-out infinite; }
@keyframes swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

/* ---- 감당 장면 ---- */
.chips { display: grid; gap: 14px; margin: 18px 0 0; }
.chipline { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; background: var(--soft); border-radius: 26px; padding: 22px 30px; opacity: 0; animation: rise .9s ease forwards; text-align: left; }
.chipline .say { font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h2); }
.chipline .tick { font-size: var(--fs-cap); font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 6px 22px; }
.chips.done .chipline { animation: none; opacity: 1; }
.chipline.scrap .say { text-decoration: line-through; text-decoration-thickness: 4px; text-decoration-color: var(--accent); }

/* ---- 목소리 ---- */
.voices { display: grid; gap: 16px; margin-top: 20px; text-align: left; }
.vc { background: var(--soft); border-radius: 26px; padding: 22px 30px; opacity: 0; animation: rise .9s ease forwards; }
.vc small { display: block; font-size: var(--fs-cap); font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.vc p { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-h2); line-height: 1.3; }
.picked { margin: 0; font-size: var(--fs-small); color: var(--muted); } .picked b { color: var(--accent); }

/* ---- 4부: 2×2 ---- */
.mx { display: grid; grid-template-columns: 150px 1fr 1fr; gap: 12px; margin: 0; align-items: stretch; }
.mx .h { font-size: var(--fs-cap); font-weight: 700; color: var(--muted); display: grid; place-items: center; text-align: center; line-height: 1.3; }
.mx .c { background: var(--soft); border-radius: 24px; min-height: 150px; padding: 18px; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 700; font-size: var(--fs-body); line-height: 1.3; }
.mx .c.me { background: var(--accent); color: var(--on-accent); }
.rtype { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1.2; color: var(--accent); margin: 0; text-wrap: balance; }
.rsub { font-size: var(--fs-body); margin: 20px auto 0; max-width: 840px; line-height: 1.5; }
.share { margin: 26px 0 0; font-size: var(--fs-small); color: var(--muted); }
.share b { color: var(--ink); }

/* ---- 끝: 입장 ---- */
.cardpair { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 28px; text-align: left; }
.lim { background: var(--soft); border: 3px solid transparent; border-radius: 28px; padding: 26px 28px; opacity: 0; animation: rise .9s ease forwards; }
.lim.me { border-color: var(--accent); }
.lim h3 { margin: 0 0 12px; font-family: var(--font-display); font-size: var(--fs-body); } .lim p { margin: 0 0 8px; font-size: var(--fs-small); line-height: 1.45; } .lim .me-tag { display: inline-block; font-size: var(--fs-cap); font-weight: 700; color: var(--on-accent); background: var(--accent); border-radius: 999px; padding: 2px 18px; margin-bottom: 10px; }
.bars2 { display: grid; gap: 18px; margin: 28px auto 0; width: min(100%, 1200px); text-align: left; }
.b2 { display: grid; grid-template-columns: 420px 1fr 90px; gap: 18px; align-items: center; font-size: var(--fs-small); }
.b2 .t { height: 26px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 14%, var(--bg)); overflow: hidden; } .b2 .t i { display: block; height: 100%; background: var(--bar, var(--accent)); border-radius: 14px; animation: fillbar 1.4s ease-out both; }
.b2.me .t i { background: var(--bar-me, var(--accent)); } .b2 .n { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
@keyframes fillbar { from { width: 0; } }
.credwrap { margin: auto 0; text-align: center; opacity: 0; animation: credio 6s ease forwards; } .credwrap p { margin: 14px 0 44px; color: var(--muted); font-size: 28px; } .credwrap .names div { font-size: 28px; line-height: 1.8; }
@keyframes credio { 0% { opacity: 0; } 18% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
.night-in { margin: auto 0; }
.night-in p { font-size: calc(46 * var(--u)); line-height: 1.5; margin: 0 0 34px; opacity: 0; animation: rise 1.2s ease forwards; }
.night-in p.big { font-family: var(--font-display); font-size: calc(62 * var(--u)); font-weight: 800; line-height: 1.35; }
.fine { font-size: 22px; line-height: 1.4; color: var(--muted); margin: 18px auto 0; max-width: 760px; }
.narr{font-size:40px;line-height:1.55;color:var(--burgundy-dark);text-align:center;margin:26px 60px 0;text-wrap:balance;font-weight:500}
.ward{display:table;margin:16px auto 0;padding:8px 24px;border-radius:99px;background:var(--burgundy);color:#fff;font-size:28px;font-weight:600}
[data-scene=turn2] .narr{color:#fff}
.opt[role=button]:active{transform:scale(.97)}
.tapnext:active, .tapnext:focus, .tapnext:hover { transform: none !important; outline: none; } .tapnext:active span { opacity: .55; } /* 변형을 주면 position:fixed 인 문구가 버튼 기준으로 튀어 오른쪽으로 쏠린다 */
.il2{margin:0;flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}.il2>.dd,.il2>svg{width:100%;height:auto;max-height:760px}.dd{overflow:visible;filter:url(#wob)}.il2~.say2,.il2~.rxs{flex:none}
.say2{display:table;margin:14px auto;background:#fff;border-radius:30px;padding:22px 38px;font-size:40px;font-weight:700;text-align:center;line-height:1.4;color:#460E21}
.rxs{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:8px}.rx2{background:#ECD5B3;border-radius:26px;padding:14px 28px;font-size:32px;color:#460E21}.rx2 i{font-style:normal;background:#460E21;color:#fff;border-radius:99px;padding:3px 16px;font-size:24px;margin-right:12px}
.rcs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:16px 40px}.rc{background:#ECD5B3;border-radius:99px;padding:12px 28px;font-size:32px;font-weight:700;color:#460E21}
.hand{transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.dd .k-bob{animation:k-bob 2.4s ease-in-out infinite alternate}@keyframes k-bob{to{transform:translateY(-3px)}}
.dd .k-jump{animation:k-jump .7s ease-in-out infinite alternate}@keyframes k-jump{to{transform:translateY(-9px)}}
.dd .k-hot{animation:k-bl 1s infinite}.dd .k-q{animation:k-bl 1.4s infinite}
