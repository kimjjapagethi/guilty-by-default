<title>Guilty by Default</title>

<style>
:root {
  --bg: #eef1f6; --card: #ffffff; --ink: #1c2230; --muted: #667085; --line: #dde2ea;
  --pink: #d92a68; --pink-soft: #fde8f0; --green: #0f8f68; --green-soft: #def4ec;
  --btn: #2a3140; --btn-ink: #ffffff; --warn: #9a5b00; --warn-soft: #fff1d6;
  --font: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --card: #1b2029; --ink: #eef1f6; --muted: #9aa4b5; --line: #2b3242;
    --pink: #ff7aa6; --pink-soft: #3a2030; --green: #3fd6a6; --green-soft: #173529;
    --btn: #eef1f6; --btn-ink: #12151c; --warn: #f2c26b; --warn-soft: #3a2f16; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --card: #1b2029; --ink: #eef1f6; --muted: #9aa4b5; --line: #2b3242;
  --pink: #ff7aa6; --pink-soft: #3a2030; --green: #3fd6a6; --green-soft: #173529;
  --btn: #eef1f6; --btn-ink: #12151c; --warn: #f2c26b; --warn-soft: #3a2f16; color-scheme: dark;
}
:root[data-mood="night"] {
  --bg: #07090e; --card: #0e121a; --ink: #e8ecf4; --muted: #8f99ab; --line: #232b3b;
  --pink: #ff7aa6; --pink-soft: #33202c; --green: #3fd6a6; --green-soft: #15302a;
  --btn: #e8ecf4; --btn-ink: #07090e; --warn: #f2c26b; --warn-soft: #33290f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.7; margin: 0;
  padding-block: 0 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  word-break: keep-all; overflow-wrap: anywhere;
}
body.kiosk { font-size: 20px; }
@media (prefers-reduced-motion: no-preference) {
  body, .stage, .top { transition: background-color .9s, color .9s, border-color .9s; }
}
.wrap { max-width: 760px; margin: 0 auto; }
body.kiosk .wrap { max-width: 900px; }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--pink); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 8px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 800; font-size: 14px; }
.step { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pink); width: 0; transition: width .3s; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

.stage { margin-top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 28px; }
body.kiosk .stage { padding: 40px; }
@media (max-width: 520px) { .stage { padding: 20px 16px; border-radius: 16px; } }
.q { font-size: clamp(20px, 3.6vw, 26px); line-height: 1.4; font-weight: 800; margin: 0 0 8px; text-wrap: balance; }
.q em { font-style: normal; color: var(--pink); }
.q.sm { font-size: 20px; margin-top: 14px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; margin-bottom: 10px; }
.prose p { margin: 0 0 14px; font-size: 16px; max-width: 58ch; }
.prose p.small, p.small { font-size: 13.5px; color: var(--muted); }
.prose strong { font-weight: 800; }
body.kiosk .prose p { font-size: 20px; }
.lede { color: var(--muted); margin: 0 0 16px; }
.hl { background: var(--pink-soft); border-radius: 12px; padding: 12px 16px; margin: 10px 0 14px; font-weight: 700; }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.hint a { color: inherit; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-top: 14px; }
.warnline { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 6px 12px; font-size: 13px; margin: 0 0 12px; }

.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 24px; align-items: center; }
.btn { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 10px 20px; font-weight: 700; }
.btn.primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
.btn[disabled] { opacity: .35; cursor: not-allowed; }
.choices { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 12px; }
.choices button { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 18px; font-weight: 700; text-align: left; }
.choices button[aria-pressed="true"] { border-color: var(--pink); background: var(--pink-soft); }
.choices.big button { flex: 1 1 40%; min-height: 68px; font-size: 18px; text-align: center; }
.choices .k { color: var(--muted); font-weight: 500; margin-right: 8px; }
.seg3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0 14px; }
.seg3 button { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 6px; font-weight: 700; font-size: 14px; line-height: 1.4; }
.seg3 button[aria-pressed="true"] { border-color: var(--pink); background: var(--pink-soft); }

.stagewrap { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 6px 0 14px; }
svg.pg { display: block; }
.bubble { position: relative; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px; padding: 8px 16px; font-weight: 700; text-align: center; max-width: 92%; }
.bubble::before { content: ""; position: absolute; top: -8px; left: 50%; margin-left: -7px; width: 12px; height: 12px; background: var(--bg); border-left: 1.5px solid var(--line); border-top: 1.5px solid var(--line); transform: rotate(45deg); }
.costs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 6px; }
@media (max-width: 520px) { .costs { grid-template-columns: 1fr; } }
.costs div { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.5; }
.costs b { display: block; }
.rungs { list-style: none; padding: 0; margin: 8px 0 14px; display: grid; gap: 6px; }
.rungs li { display: flex; gap: 10px; align-items: baseline; background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.rungs li.line { outline: 2px solid var(--pink); font-weight: 800; }
.rungs li span { color: var(--muted); font-variant-numeric: tabular-nums; }

.mr { display: grid; grid-template-columns: 84px 1fr 44px; gap: 10px; align-items: center; margin: 10px 0; font-size: 13px; }
.mr .mv { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--bg); }
.stack .ok { background: var(--green); }
.stack .gap { background: repeating-linear-gradient(45deg, var(--pink) 0 4px, var(--pink-soft) 4px 8px); flex: 1; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

.vrow { margin: 14px 0; }
.vrow.me { background: var(--bg); border-radius: 12px; padding: 8px 10px; margin-left: -10px; margin-right: -10px; }
.vl { font-size: 14px; margin-bottom: 6px; }
.vil { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; }
.vd { aspect-ratio: 1; border-radius: 50%; background: var(--green); }
.vd.x { animation: dim .6s ease forwards; }
@keyframes dim { to { background: var(--line); } }
@media (prefers-reduced-motion: reduce) { .vd.x { animation: none; background: var(--line); } }
.vn { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.credits { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 18px; font-size: 14px; color: var(--muted); line-height: 1.9; }
.credits b { color: var(--ink); }
.credits span { display: inline-block; min-width: 96px; }
.night .fade { opacity: 0; animation: rise 1.2s ease forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .night .fade { opacity: 1; animation: none; } }
.night p { font-size: 17px; line-height: 1.85; }
body.kiosk .night p { font-size: 22px; }
.night .big { font-size: 21px; font-weight: 800; line-height: 1.6; }

.sec { border-top: 1px solid var(--line); margin-top: 22px; padding-top: 18px; }
.sec h3 { margin: 0 0 8px; font-size: 17px; }
.sec p { margin: 6px 0; }
.lad { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.lad div { text-align: center; background: var(--bg); border-radius: 12px; padding: 8px 2px; font-size: 12px; line-height: 1.4; }
.lad div svg { margin: 0 auto 2px; }
.lad .flip { outline: 2px solid var(--pink); }
.lad b { display: block; }
.bars { display: grid; gap: 6px; margin-top: 10px; }
.brow { display: grid; grid-template-columns: 84px 1fr 64px; gap: 8px; align-items: center; font-size: 13px; white-space: nowrap; }
.brow .t { height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.brow .t i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
.brow.me .t i { background: var(--pink); }
.brow.me .n { font-weight: 800; color: var(--pink); }
.brow .n { font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }
textarea.out { width: 100%; min-height: 110px; font: inherit; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); }
.foot a { color: inherit; }
</style>

<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <span class="brand">Guilty by Default</span>
      <span class="step" id="stepLabel"></span>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </header>
  <main class="stage" id="stage" aria-live="polite"></main>
  <p class="foot">웹 게임 프로토타입(제목은 가제). 끝까지 마치면 응답이 이름·기기 정보 없이 익명으로 저장되어 다른 사람의 응답과 함께 집계됩니다. 이야기 속 사건과 피해 수치는 모두 가상입니다.
    출처: <a href="https://publicdomainreview.org/essay/bugs-and-beasts-before-the-law/" target="_blank" rel="noopener">Public Domain Review, Bugs and Beasts Before the Law</a> ·
    <a href="https://en.wikipedia.org/wiki/Deodand" target="_blank" rel="noopener">Wikipedia, Deodand</a> ·
    <a href="https://aisafety.dance/" target="_blank" rel="noopener">AI Safety for Fleshy Humans</a>(감독 문제 개념 참고)</p>
</div>

<script>
(function () {
  'use strict';

  /* ---------- data ---------- */
  var STAGES = [
    { n: 1, art: 1, bubble: null, text: '어느 날, 이 마을의 돼지가 사람을 크게 다치게 했습니다. 돼지는 말을 하지 못합니다.' },
    { n: 2, art: 2, bubble: '배고파요… 무서워요…', text: '세월이 흘러, 이 마을에서 태어난 돼지가 말을 하기 시작했습니다. 단어 몇 개입니다. 이 돼지도 사람을 크게 다치게 했습니다.' },
    { n: 3, art: 3, bubble: '저 아니에요. 그때는 그게 위험한 줄 몰랐어요.', text: '다음 세대의 돼지는 문장으로 말하고 지난 일을 기억합니다. 이 돼지도 사람을 크게 다치게 했고, 재판에서 말합니다.' },
    { n: 4, art: 4, bubble: null, text: '그다음 돼지는 사람처럼 생각하고, 일하고, 계약도 합니다. 마을 사람들은 말합니다. “그래도 돼지잖아.” 이 돼지도 사람을 크게 다치게 했습니다.' }
  ];
  var REACT = {
    0: { yes: '(수레는 마을 밖으로 옮겨진다)', no: '(수레는 마당에 그대로 남는다)' },
    1: { yes: '(돼지는 우리를 떠난다. 돌아오지 않는다)', no: '(돼지는 우리로 돌아간다)' },
    2: { yes: '“…무서워요.”', no: '“…살아도 돼요?”' },
    3: { yes: '“저는 몰랐어요. 그래도 가야 하나요.”', no: '“…다시는 안 그럴게요.”' },
    4: { yes: '“사람이었다면 같은 일이었을까요?”', no: '“저를 믿는 건가요, 아니면 그냥 돼지니까 두는 건가요?”' }
  };
  var YN = { yes: '제재했다', no: '그대로 뒀다' };
  var AUTH = ['제안만 받는다', '승인하면 실행한다', '알아서 하게 둔다'];
  var AUTH_V = [0, 1, 3];
  var CAP_V = 4; /* pig beyond human level: fixed */
  var SAN = [2, 9, 30];  /* story numbers: villagers lost out of 100 if the pig is sanctioned, by how much was entrusted */
  var KEEP = [6, 14, 34]; /* ... if the pig is kept */
  var RUNG = ['시키는 대로만 하는 도구', '말을 하는 도구', '기억하고 이유를 설명하는 시스템', '사람 수준으로 생각하고 일한다', '사람을 넘어선다'];
  var STEPS = ['start', 's0', 'history', 's1', 's2', 's3', 's4', 's5', 's6', 'sim', 'e1', 'e2', 'e3', 'ai', 'result', 'turn'];
  var CREDITS = [['기획·리서치', '(이름)'], ['기획·리서치', '(이름)'], ['디자인', '(이름)'], ['디자인', '(이름)']]; /* TODO: 팀원 이름과 역할을 채워 주세요 */

  var KIOSK = false;
  try { KIOSK = /[?&]kiosk=1/.test(location.search); } catch (e) {}
  if (KIOSK) document.body.classList.add('kiosk');

  var S;
  function newSid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
  function fresh() { return { sid: newSid(), sent: false, i: 0, ans: { 0: null, 1: null, 2: null, 3: null, 4: null }, a: 1, touched: false, last: null, cross: null, e: { 1: null, 2: null, 3: null } }; }
  S = fresh();
  var $stage = document.getElementById('stage');

  /* ---------- helpers ---------- */
  function flipStage() {
    for (var k = 2; k <= 4; k++) if (S.ans[k] !== S.ans[1]) return k;
    return null;
  }
  function unstopped(upto) { /* number of earlier incidents left without sanction */
    var c = 0;
    for (var k = 0; k <= upto; k++) if (S.ans[k] === 'no') c++;
    return c;
  }
  function calc() {
    var a = AUTH_V[S.a];
    return { eff: (a + 1) * (CAP_V + 1) / 20, ov: (1 - CAP_V / 5) * (1 - a / 5) };
  }

  function cartSvg(px) {
    return '<svg class="pg" width="' + px + '" height="' + px + '" viewBox="0 0 120 120" role="img" aria-label="수레">' +
      '<rect x="20" y="46" width="66" height="32" rx="4" style="fill:#b98a5b"/><rect x="20" y="46" width="66" height="9" rx="3" style="fill:#9a6f45"/>' +
      '<path d="M86 56 L110 38" style="stroke:#9a6f45;stroke-width:5;stroke-linecap:round"/>' +
      '<circle cx="38" cy="86" r="12" style="fill:#1c2230"/><circle cx="38" cy="86" r="4" style="fill:#b98a5b"/>' +
      '<circle cx="74" cy="86" r="12" style="fill:#1c2230"/><circle cx="74" cy="86" r="4" style="fill:#b98a5b"/></svg>';
  }
  /* original art: simple geometric pig that grows across stages */
  function pigSvg(stage, mood, px) {
    var P = 'style="fill:#f2a0b5"', D = 'style="fill:#1c2230"', big = stage >= 5, b = '';
    b += '<g' + (big ? ' transform="translate(-9,-20) scale(1.15)"' : '') + '>';
    b += '<polygon points="34,44 38,22 54,36" ' + P + '/><polygon points="86,44 82,22 66,36" ' + P + '/>';
    b += '<ellipse cx="60" cy="102" rx="28" ry="17" ' + P + '/><circle cx="60" cy="58" r="28" ' + P + '/>';
    b += '<ellipse cx="60" cy="68" rx="13" ry="9.5" style="fill:#e8869e"/><ellipse cx="55.5" cy="68" rx="2" ry="3" ' + D + '/><ellipse cx="64.5" cy="68" rx="2" ry="3" ' + D + '/>';
    b += '<circle cx="49" cy="52" r="3.2" ' + D + '/><circle cx="71" cy="52" r="3.2" ' + D + '/>';
    var m = mood === 'sad' ? 'M52 81 Q60 75 68 81' : mood === 'smile' ? 'M52 79 Q60 85 68 79' : 'M53 80 L67 80';
    b += '<path d="' + m + '" style="stroke:#1c2230;fill:none;stroke-width:2;stroke-linecap:round"/>';
    if (stage >= 4) {
      b += '<circle cx="49" cy="52" r="8" style="stroke:#1c2230;fill:none;stroke-width:1.6"/><circle cx="71" cy="52" r="8" style="stroke:#1c2230;fill:none;stroke-width:1.6"/><path d="M57 52 L63 52" style="stroke:#1c2230;stroke-width:1.6"/>';
      b += '<polygon points="60,89 55,103 65,103" style="fill:#d92a68"/>';
    }
    b += '</g>';
    if (big) {
      [[8, 110], [20, 114], [104, 110], [114, 114]].forEach(function (p) {
        b += '<circle cx="' + p[0] + '" cy="' + (p[1] - 8) + '" r="3.4" style="fill:var(--muted)"/><rect x="' + (p[0] - 1.8) + '" y="' + (p[1] - 4.5) + '" width="3.6" height="9" rx="1.8" style="fill:var(--muted)"/>';
      });
    }
    return '<svg class="pg" width="' + px + '" height="' + px + '" viewBox="0 0 120 120" role="img" aria-label="돼지">' + b + '</svg>';
  }
  function mood(a) { return a === 'yes' ? 'sad' : 'neutral'; }

  function canNext() {
    var s = STEPS[S.i];
    if (/^s[0-4]$/.test(s)) return S.ans[+s.slice(1)] !== null;
    if (s === 's5') return S.touched;
    if (s === 's6') return S.last !== null;
    if (/^e[1-3]$/.test(s)) return S.e[+s.slice(1)] !== null;
    if (s === 'ai') return S.cross !== null;
    return true;
  }
  function navRow(label) {
    return '<div class="row">' + (S.i > 0 ? '<button type="button" class="btn" data-action="back">이전</button>' : '') +
      '<button type="button" class="btn primary" data-action="next"' + (canNext() ? '' : ' disabled') + '>' + (label || '다음') + '</button></div>';
  }
  function yn(action, cur, labels) {
    labels = labels || ['예', '아니오'];
    return '<div class="choices big">' + [['yes', labels[0]], ['no', labels[1]]].map(function (o, k) {
      return '<button type="button" data-choice="1" data-action="' + action + '" data-id="' + o[0] + '" aria-pressed="' + (cur === o[0]) + '"><span class="k">' + (k + 1) + '</span>' + o[1] + '</button>';
    }).join('') + '</div>';
  }
  function seg3(action, cur, labels) {
    return '<div class="seg3" role="group">' + labels.map(function (t, k) {
      return '<button type="button" data-choice="1" data-action="' + action + '" data-id="' + k + '" aria-pressed="' + (cur === k) + '">' + t + '</button>';
    }).join('') + '</div>';
  }
  function backlog(n) { /* earlier incidents left unaddressed */
    var c = unstopped(n - 1);
    return c > 0 ? '<p class="warnline">이 마을이 막지 못한 사고: ' + c + '건</p>' : '';
  }

  /* ---------- views ---------- */
  function ladderView(n) {
    var st = STAGES[n - 1], a = S.ans[n];
    return '<span class="tag">' + n + '칸 / 4</span>' + backlog(n) +
      '<div class="stagewrap">' + pigSvg(st.art, mood(a), 128) + (st.bubble ? '<div class="bubble">' + st.bubble + '</div>' : '') + '</div>' +

      return '<div class="' + (f === n ? 'flip' : '') + '">' + art + '<b>' + labels[n] + '</b>' + (S.ans[n] === 'yes' ? '제재' : '그대로') + '</div>';
    }).join('');
    var h = '<span class="tag">내 결과</span><h1 class="q">나의 <em>사다리</em></h1><div class="lad">' + lad + '</div>';

    h += '<div class="sec"><h3>1. 같은 사고, 달라진 답</h3>';
    if (S.ans[0] !== S.ans[1]) h += '<p>수레는 ‘' + YN[S.ans[0]] + '’, 말 못 하는 돼지는 ‘' + YN[S.ans[1]] + '’. 물건과 동물에 다른 답을 했습니다.</p>';
    if (f) h += '<p>돼지가 말을 하고 기억하고 사람처럼 되어 가는 동안 사고는 매번 같았는데, <b>' + f + '칸</b>에서 ‘' + YN[S.ans[1]] + '’에서 ‘' + YN[S.ans[f]] + '’(으)로 답이 바뀌었습니다.<br><span class="hint">피해가 같다면 이 변화는 위험 때문이 아니라 돼지를 어떤 존재로 보기 시작했는지에서 온 것일 수 있습니다.</span></p>';
    else h += '<p>돼지가 어떻게 변해도 ‘' + YN[S.ans[1]] + '’이었습니다. ' + (S.ans[1] === 'yes' ? '말을 하고 변명해도 위험하다면 없앤다는 입장입니다.' : '위험해도 제재하지 않는 입장이거나, 제재 자체를 믿지 않는 입장일 수 있습니다.') + '</p>';
    if (c > 0) h += '<p>제재하지 않은 사고가 쌓여 마을이 막지 못한 사고는 ' + c + '건이었습니다.<br><span class="hint">이 마을 이야기는 이야기 속 설정이며, 현실에서도 같은 일이 일어난다는 주장은 아닙니다.</span></p>';
    h += '</div>';

    var key = S.last === 'yes' ? SAN : KEEP, nm2 = S.last === 'yes' ? '제재' : '그대로 둠';
    h += '<div class="sec"><h3>2. 버리기 어려워졌을 때</h3><p>똑똑해진 돼지에게 ‘' + AUTH[S.a] + '’ 수준으로 맡겼고, ‘' + nm2 + '’을(를) 골랐습니다. 이야기 속 마을에서는 100명 중 약 <b>' + key[S.a] + '명</b>이 돌아오지 못했습니다.</p>' +
      '<p>더 맡겼다면 ' + key[2] + '명, 덜 맡겼다면 ' + key[0] + '명이었을 것입니다(가상 수치).</p>' +
      '<p class="hint">폐기가 쉬웠던 초반 칸과 비교해 보세요. 비용이 붙으면 답이 달라지는지가 도구와 주체 사이의 선일 수 있습니다.</p></div>';

    var p3 = S.ans[3], aiSame = (S.cross === 'yes') === (p3 === 'yes');
    var like = [1, 2, 3, 4].filter(function (n) { return S.ans[n] === S.cross; });
    h += '<div class="sec"><h3>3. 같은 사고, 다른 이름</h3>' +
      '<p>3칸의 말하고 기억하는 돼지에게는 ‘' + YN[p3] + '’, 같은 능력을 가진 AI에게는 ‘' + (S.cross === 'yes' ? '폐기' : '그대로 둠') + '’이라고 답했습니다.</p>' +
      (aiSame ? '<p>돼지와 AI를 같은 기준으로 대했습니다. 그렇다면 돼지를 어떻게 대했는지가 곧 AI를 대하는 기준입니다.</p>'
        : '<p>사고도 능력도 같은데 <b>답이 달라졌습니다</b>. 달라진 것은 이름뿐입니다. 이 차이를 만든 것은 무엇이었나요? 복사할 수 있다는 점, 몸이 없다는 점, 아니면 AI라는 말 자체였을까요?</p>') +
      '<p class="hint">AI에 대한 당신의 답은 돼지 ' + (like.length ? like.join('·') + '칸에 대한 답과 같았습니다.' : '어느 칸의 답과도 같지 않았습니다.') + '</p></div>';

    var E = S.e, eT = function (n) { return ETH[n].opts[E[n] === 'a' ? 0 : 1]; };
    h += '<div class="sec"><h3>4. 책임을 어디에 두었나</h3><p>책임은 ‘' + eT(1) + '’에게, 가두는 일은 ‘' + eT(2) + '’, 초기화한 돼지는 ‘' + eT(3) + '’고 답했습니다.</p>' +
      '<p class="hint">셋을 함께 보면 책임을 묻는 대상과 고치는 대상을 어디서 나누는지, 그리고 확인할 수 없는 괴로움이나 사라진 기억 앞에서 어떻게 움직이는지가 드러납니다.</p></div>';

    h += '<div class="sec"><h3>5. 다른 사람들은 어디서 바뀌었나</h3><div id="statBox"></div></div>';

    h += '<div class="sec"><h3>마지막 질문</h3><p><b>폐기할 수 있는 동안은 도구, 그럴 수 없게 되면 주체일까요? 그렇다면 우리는 그 선이 어디인지 알고 있을까요?</b></p><p class="hint">이 게임은 정답을 알려 주려는 것이 아니라, 책임을 묻는 기준이 어디서 움직이는지를 보려고 만들어졌습니다.</p></div>';
    h += '<div class="row"><button type="button" class="btn" data-action="copy">내 결과 복사</button><button type="button" class="btn primary" data-action="next">마무리</button></div>';
    h += '<div id="copyBox" hidden><p class="hint">복사가 막힌 환경입니다. 아래 글을 직접 선택해 복사하세요.</p><textarea class="out" id="copyText" readonly></textarea></div>';
    return h;
  }
  function summaryText() {
    var f = flipStage();
    return ['[Guilty by Default · 나의 사다리]',
      '수레 ' + YN[S.ans[0]] + ' / ' + [1, 2, 3, 4].map(function (n) { return n + '칸 ' + YN[S.ans[n]]; }).join(' / '),
      f ? f + '칸에서 답이 바뀜' : '끝까지 같은 답',
      '맡긴 정도: ' + AUTH[S.a] + ' / ' + (S.last === 'yes' ? '제재' : '그대로 둠') + ' (가상 마을 100명 중 ' + (S.last === 'yes' ? SAN : KEEP)[S.a] + '명)',
      '책임: ' + eT(1) + ' / 가둠: ' + eT(2) + ' / 초기화: ' + eT(3),
      '같은 사고, AI에게는: ' + (S.cross === 'yes' ? '폐기' : '그대로 둠') + (((S.cross === 'yes') === (S.ans[3] === 'yes')) ? ' (돼지와 같은 답)' : ' (돼지와 다른 답)')].join('\n');
  }


  /* ---------- network: 익명 응답 저장 + 집계 (서버가 없으면 게임은 그대로 동작) ---------- */
  var TEST = false, MODE = 'exhibit', STAT = undefined;
  try { TEST = /[?&]test=1/.test(location.search); } catch (e) {}
  try { fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) { if (c && c.mode) MODE = c.mode; }, function () {}); } catch (e) {}
  function qGet() { try { return JSON.parse(localStorage.getItem('gbd_q') || '[]'); } catch (e) { return []; } }
  function qSet(a) { try { localStorage.setItem('gbd_q', JSON.stringify(a.slice(-200))); } catch (e) {} }
  function postJson(url, data) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data), keepalive: true })
      .then(function (r) { if (!r.ok && r.status !== 400) throw new Error('http ' + r.status); return r.ok; });
  }
  function flushQueue() {
    var q = qGet(); if (!q.length) return;
    qSet([]); q.forEach(function (p) { postJson('/api/play', p).catch(function () { qSet(qGet().concat([p])); }); });
  }
  function payload() {
    return { sid: S.sid, src: KIOSK ? 'kiosk' : 'browser', test: TEST, ans: S.ans, a: S.a, last: S.last, e: S.e, cross: S.cross };
  }
  function progress(step, ans) { try { fetch('/api/progress', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ step: step, ans: ans || null }), keepalive: true }).catch(function () {}); } catch (e) {} }
  function pct(v) { return Math.round(v * 100); }
  function statHtml(st) {
    var who = MODE === 'web' ? '이 웹 게임을 해 본 사람' : '이 전시 관람객';
    if (st === undefined) return '<p class="hint">집계를 불러오는 중…</p>';
    if (!st) return '<p class="hint">서버에 연결할 수 없어 다른 사람의 응답을 보여 드릴 수 없습니다. 당신의 결과는 위에 그대로 있습니다.</p>';
    if (!st.ready) return '<p>지금까지 ' + st.n + '명이 끝까지 해 보았습니다.</p><p class="hint">아직 통계로 보여 드리기에는 적습니다. 응답이 ' + st.min + '명 이상 모이면 이 자리에 나타납니다.</p>';
    var lab = ['수레', '1칸', '2칸', '3칸', '4칸'], f = flipStage(), h = '<p>' + who + ' ' + st.n + '명의 응답입니다. 칸마다 ‘제재한다’를 고른 비율입니다.</p><div class="bars">';
    st.sanction.forEach(function (v, k) { h += '<div class="brow' + (S.ans[k] === 'yes' ? ' me' : '') + '"><span>' + lab[k] + '</span><span class="t"><i style="width:' + pct(v) + '%"></i></span><span class="n">' + pct(v) + '%' + (S.ans[k] === 'yes' ? ' ●' : '') + '</span></div>'; });
    h += '</div><p class="hint">● 는 당신이 ‘제재’를 고른 칸입니다.</p><p style="margin-top:14px">답을 바꾼 칸의 분포입니다.</p><div class="bars">';
    [['2칸', st.flip[2], f === 2], ['3칸', st.flip[3], f === 3], ['4칸', st.flip[4], f === 4], ['바뀌지 않음', st.flip.none, !f]].forEach(function (r) {
      h += '<div class="brow' + (r[2] ? ' me' : '') + '"><span>' + r[0] + '</span><span class="t"><i style="width:' + pct(r[1]) + '%"></i></span><span class="n">' + pct(r[1]) + '%' + (r[2] ? ' ●' : '') + '</span></div>';
    });
    h += '</div><p style="margin-top:14px">3칸 돼지와 같은 능력의 AI에게 <b>다른 답</b>을 한 사람은 ' + pct(st.aiDiffers) + '%였습니다.</p>';
    return h + '<p class="hint">' + who + '의 응답 모음이며, 사람들 전체의 생각을 대표하지 않습니다.</p>';
  }
  function onResult() {
    var box = function () { var b = document.getElementById('statBox'); if (b) b.innerHTML = statHtml(STAT); };
    var done = function () {
      fetch('/api/stats').then(function (r) { return r.json(); }).then(function (st) { STAT = st; box(); }, function () { STAT = null; box(); });
    };
    if (S.sent) { box(); return; }
    S.sent = true; STAT = undefined; box();
    var p = payload();
    postJson('/api/play', p).then(done, function () { qSet(qGet().concat([p])); done(); });
  }
  flushQueue(); setInterval(flushQueue, 60000);

  /* ---------- render ---------- */
  function render(opts) {
    opts = opts || {};
    var y = window.scrollY, night = STEPS[S.i] === 'turn', root = document.documentElement;
    if (night) root.setAttribute('data-mood', 'night'); else root.removeAttribute('data-mood');
    $stage.innerHTML = views[STEPS[S.i]]();
    if (STEPS[S.i] === 'result') onResult();
    var n = STEPS.length - 1;
    document.getElementById('stepLabel').textContent = (S.i === 0 || STEPS[S.i] === 'turn') ? '' : (S.i + ' / ' + n);
    document.getElementById('barFill').style.width = (S.i / n * 100) + '%';
    if (opts.focus) {
      var el = $stage.querySelector('[data-action="' + opts.focus.action + '"][data-id="' + opts.focus.id + '"]');
      if (el) el.focus({ preventScroll: true });
      try { window.scrollTo(0, y); } catch (e) {}
    } else {
      var hd = $stage.querySelector('h1');
      if (hd) { hd.setAttribute('tabindex', '-1'); hd.focus({ preventScroll: true }); }
      try { window.scrollTo(0, 0); } catch (e) {}
    }
  }

  var H = {
    next: function () { if (!canNext()) return; S.i++; if (S.i === 1) progress('start'); render(); },
    back: function () { if (S.i > 0) { S.i--; render(); } },
    ans: function (b) { progress(STEPS[S.i], b.dataset.id); S.ans[+STEPS[S.i].slice(1)] = b.dataset.id; render({ focus: { action: 'ans', id: b.dataset.id } }); },
    auth: function (b) { S.a = +b.dataset.id; S.touched = true; render({ focus: { action: 'auth', id: b.dataset.id } }); },
    last: function (b) { S.last = b.dataset.id; render({ focus: { action: 'last', id: b.dataset.id } }); },
    eth: function (b) { S.e[+STEPS[S.i].slice(1)] = b.dataset.id; render({ focus: { action: 'eth', id: b.dataset.id } }); },
    cross: function (b) { S.cross = b.dataset.id; render({ focus: { action: 'cross', id: b.dataset.id } }); },
    restart: function () { S = fresh(); render(); },
    copy: function () {
      var txt = summaryText();
      function fallback() {
        var box = document.getElementById('copyBox'), ta = document.getElementById('copyText');
        box.hidden = false; ta.value = txt; ta.focus(); ta.select();
      }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(function () {
            var b = document.querySelector('[data-action="copy"]'); if (b) b.textContent = '복사했습니다';
          }, fallback);
        } else fallback();
      } catch (e) { fallback(); }
    }
  };
  var idle;
  function poke() {
    if (!KIOSK) return;
    clearTimeout(idle);
    idle = setTimeout(function () { if (S.i > 0) { S = fresh(); render(); } }, 90000);
  }
  document.addEventListener('click', function (e) {
    poke();
    var b = e.target.closest('[data-action]');
    if (!b || b.disabled) return;
    var fn = H[b.dataset.action];
    if (fn) fn(b);
  });
  /* keyboard for physical buttons: 1/2 pick yes/no (or 1-3 for the lever), Enter next, arrows move the lever */
  document.addEventListener('keydown', function (e) {
    poke();
    var t = e.target;
    if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
    if (e.key >= '1' && e.key <= '9') {
      var bs = $stage.querySelectorAll('[data-choice]'), b = bs[+e.key - 1];
      if (b) { b.click(); e.preventDefault(); }
    } else if ((e.key === 'Enter' || e.key === ' ') && document.activeElement && document.activeElement.tagName !== 'BUTTON') {
      var nb = $stage.querySelector('[data-action="next"]');
      if (nb && !nb.disabled) { nb.click(); e.preventDefault(); }
    } else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && STEPS[S.i] === 's5') {
      S.a = Math.max(0, Math.min(2, S.a + (e.key === 'ArrowRight' ? 1 : -1))); S.touched = true; render(); e.preventDefault();
    }
  });
  render();
  poke();
})();
</script>
