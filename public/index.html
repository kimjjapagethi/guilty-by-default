<script>

(function () {
  'use strict';

  /* ---------- data ---------- */
  var STAGES = [
    { n: 1, art: 1, bubble: null, text: '같은 마을에서 어느 날, 돼지가 사람을 죽였습니다.' },
    { n: 2, art: 2, bubble: '“…배고파서 그랬어요…”', text: '세월이 흘러, 이 마을에서 태어난 돼지가 말을 하기 시작했습니다. 이 돼지도 사람을 죽였습니다.' },
    { n: 3, art: 3, bubble: '“그때는 그게 나쁜 건지 몰랐어요…”', text: '다음 세대의 돼지는 문장으로 말하고 지난 일을 기억합니다. 이 돼지도 사람을 죽였습니다.' },
    { n: 4, art: 4, bubble: '“…”', text: '그다음 돼지는 사람처럼 생각하고, 일하고, 계약도 합니다. 이 돼지도 사람을 죽였습니다.' }
  ];
  var REACT = {
    0: { yes: '(수레는 마을 밖으로 옮겨진다)', no: '(수레는 마당에 그대로 남는다)' },
