<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default</title>
<style>@font-face{font-family:'Orbit';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Orbit/Orbit-Regular.ttf') format('truetype')}@font-face{font-family:'PP Frama';font-weight:200;font-display:swap;src:url('fonts/PPFrama/PPFrama-Extralight.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:400 700;font-display:swap;src:url('fonts/PPFrama/PPFrama-Regular.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:800 900;font-display:swap;src:url('fonts/PPFrama/PPFrama-Black.otf') format('opentype')}@font-face { font-family: 'Source Code Variable'; font-weight: 200 900; font-style: normal; font-display: swap; src: url('fonts/source%20code%20variable/SourceCodeVariable-Roman.otf') format('opentype'); }@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url('fonts/PretendardVariable.woff2') format('woff2-variations')}/* 자막 / 질문 / 끝 */
#cap{position:absolute;left:0;right:0;bottom:0;padding:90px 260px 116px;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.92) 55%,rgba(0,0,0,0));display:none;z-index:20;cursor:pointer}
#cap.on{display:block}
#cap::before{content:'';position:absolute;inset:-1400px;z-index:-1}
#cap.q,#cap.q::before{pointer-events:none}
#cap .nx{display:none!important}
#cap .nx2{display:inline-block;margin-left:14px;font-size:24px;line-height:1;color:#D5EDF1;animation:bl 1.1s infinite alternate}
#cap .nm{display:inline-block;font-size:24px;font-weight:400;color:rgba(255,255,255,.7);margin-bottom:12px;letter-spacing:.1em}
#cap p{font-family:'Orbit','PP Frama','Pretendard Variable', Pretendard, sans-serif;font-size:36px;line-height:1.3;font-weight:400;color:#D5EDF1;text-shadow:0 2px 16px rgba(0,0,0,.55);text-wrap:pretty}
#cap .nx{position:absolute;right:190px;bottom:62px;font-size:20px;color:var(--hot);opacity:0}#cap .nx.on{opacity:1;animation:bl 1.1s infinite alternate}
</style>
<style>
:root{--fg:#EDE6DF;--dim:rgba(237,230,223,.5);--line:rgba(237,230,223,.26);--rasp:#AB073D;--hot:#ff5b86;--sky:#9fc4cb;--ink:#460E21;
  --font:'Orbit','PP Frama','Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;word-break:keep-all;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:#000;overflow:hidden}
@keyframes bl{from{opacity:.4}to{opacity:1}}

/* AI 단말 (왼쪽) */
#ai{position:absolute;left:70px;top:205px;width:260px;height:360px;z-index:1;opacity:0;transform:translateX(-120px);transition:opacity 1s,transform 1.2s cubic-bezier(.16,.8,.2,1)}
#ai.in{opacity:1;transform:none}
#ai .art{position:absolute;inset:0;transition:opacity .9s,filter .9s}
#ai .art svg{width:100%;height:100%;display:block;overflow:visible;filter:grayscale(1) invert(1) contrast(1.1) opacity(.9)}
#ai .art img,#ai .art video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}
#ai.dark .art{opacity:.04}
#ai.shake .art{animation:sh .5s}
@keyframes sh{20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
#jail path{vector-effect:non-scaling-stroke}
#jail{position:absolute;left:10px;top:165px;width:380px;height:430px;z-index:2;pointer-events:none;opacity:0;transition:opacity 1s}
#jail.in{opacity:1}
#say{position:absolute;left:150px;top:120px;max-width:520px;min-height:64px;font-size:34px;line-height:1.45;font-weight:500;padding:16px 24px;border:1px solid rgba(237,230,223,.55);background:rgba(0,0,0,.8);opacity:0;transition:opacity .4s;z-index:5}
#say.on{opacity:1}
#say::after{content:'';position:absolute;left:60px;bottom:-14px;width:22px;height:22px;background:#000;border-right:1px solid rgba(237,230,223,.55);border-bottom:1px solid rgba(237,230,223,.55);transform:rotate(45deg)}
#sys{position:absolute;left:90px;width:640px;bottom:26px;text-align:center;font-size:22px;color:var(--sky);letter-spacing:.06em;font-family:ui-monospace,Consolas,'D2Coding',monospace;min-height:30px}
#bar{position:absolute;left:210px;bottom:64px;width:400px;height:10px;border:1px solid var(--line);opacity:0;transition:opacity .3s}
#bar.on{opacity:1}
#bar i{display:block;height:100%;width:0;background:var(--sky);transition:width 2.2s linear}

/* 집행관 3명 (오른쪽) — 걸어 들어와 선다 */
#enf{position:absolute;left:410px;top:165px;width:1180px;display:flex;gap:0;pointer-events:none;z-index:3}
.en{position:relative;width:270px;text-align:center;opacity:0;transform:translateX(640px);transition:opacity .6s,transform 2s cubic-bezier(.3,.7,.3,1)}
.en.in{opacity:1;transform:none}
.en svg{width:100%;height:380px;display:block;overflow:visible;transition:filter .25s}
.en.walking svg{animation:walk .5s ease-in-out infinite alternate}
@keyframes walk{from{transform:translateY(0) rotate(-1.2deg)}to{transform:translateY(-9px) rotate(1.2deg)}}
.en b{display:block;font-size:38px;font-weight:700;margin-top:12px;transition:color .2s}
.en .bub{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);width:250px;padding:9px 13px;border:1px solid rgba(237,230,223,.55);background:#000;font-size:21px;line-height:1.4;font-weight:500;opacity:0;transition:opacity .4s;pointer-events:none}
.en .bub::after{content:'';position:absolute;left:50%;bottom:-8px;width:14px;height:14px;margin-left:-7px;background:#000;border-right:1px solid rgba(237,230,223,.55);border-bottom:1px solid rgba(237,230,223,.55);transform:rotate(45deg)}
.en .bub.on{opacity:1}
#enf.pick .en{pointer-events:auto;cursor:pointer}
#enf.pick .en.off{opacity:.28;pointer-events:none;filter:grayscale(1)}
#enf.pick .en:hover svg{filter:drop-shadow(0 0 12px rgba(213,237,241,.55))}
#enf.pick .en:hover b{color:var(--sky)}
#enf.pick .en.sel svg{filter:drop-shadow(0 0 16px rgba(255,91,134,.75))}
#enf.pick .en.sel b{color:var(--hot);text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px}
#enf .en.none{width:370px;transform:none;pointer-events:none}
#enf .en.none.in{opacity:1}
#enf .en.none .fx{height:380px;display:block}
#enf .en.none b{font-size:28px;line-height:1.35;white-space:nowrap}
#enf.pick .en.none{pointer-events:auto;cursor:pointer}
#enf.pick .en.none:hover b{color:var(--sky)}
#enf.pick .en.none.sel b{color:var(--hot);text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px}
#ok{position:absolute;left:50%;top:50px;transform:translateX(-50%);font:inherit;font-size:24px;background:var(--rasp);border:1px solid var(--rasp);color:#fff;font-weight:700;padding:12px 26px;cursor:pointer;z-index:30;display:none}
#ok.on{display:block}#ok:disabled{opacity:.3;cursor:default}
#cap.q .nx2,#cap.q .nm{display:none}
</style>
<script>
/* 부모(index)가 'go'를 보내기 전까지 이 장면은 멈춰 있는다 — 챕터 전환 뒤에서 미리 재생되지 않게 */
(function(){
  if(parent===window){window.__go=function(f){f()};return}
  var d=document.documentElement;d.classList.add('hold');
  window.__go=function(f){addEventListener('message',function h(e){if(e.data&&e.data.gbd==='go'){removeEventListener('message',h);d.classList.remove('hold');f()}});try{parent.postMessage({gbd:'ready'},'*')}catch(_){}};
})();
</script>
<style>html.hold *{animation-play-state:paused!important}</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><filter id="wob" x="-2%" y="-8%" width="104%" height="116%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<div id="stage">
  <div id="ai"><div class="art" id="aiart" data-art="ai"></div></div>
  <svg id="jail" viewBox="0 0 640 740" preserveAspectRatio="none"><g fill="none" stroke="#EDE6DF" stroke-width="6" stroke-linecap="round" filter="url(#wob)"><path d="M10 14h620M10 372h620M10 726h620"/><path d="M40 14v712"/><path d="M98 14v712"/><path d="M156 14v712"/><path d="M214 14v712"/><path d="M272 14v712"/><path d="M330 14v712"/><path d="M388 14v712"/><path d="M446 14v712"/><path d="M504 14v712"/><path d="M562 14v712"/><path d="M620 14v712"/></g></svg>
  <div id="say"></div><div id="sys"></div>
  <div id="enf"></div>
  <div id="cap"><span class="nm">요원</span><p id="capt"></p><span class="nx" id="capx">클릭 ▸</span></div>
  <button type="button" id="ok" disabled>이렇게 정했다</button>
</div>
<script>
const INK='#460E21',IV='#FAF4EF',SKY='#BCD8DD',RASP='#AB073D';
const P=new URLSearchParams(location.search),FAST=P.get('fast')==='1';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms*0.05,30):ms));
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const post=m=>{try{parent.postMessage(m,'*')}catch(_){}};
let lp=0;function poke(){const n=Date.now();if(n-lp>800){lp=n;post({gbd:'poke'})}}
document.addEventListener('pointerdown',poke,true);document.addEventListener('mousemove',poke,true);
let capH=null;
addEventListener('keydown',e=>{if(e.repeat)return;if(e.key==='r'||e.key==='R'){if(parent!==window)post({gbd:'restart'});else location.reload();return}if((e.key==='Enter'||e.key===' ')&&capH){e.preventDefault();capH()}});

/* 이미지 자리: part2/ai.png|jpg|webp|mp4|webm (2부와 같은 AI 이미지를 씁니다) */
const AIFIG=`<g fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10V-40M-22 -2h44"/><rect x="-30" y="-100" width="60" height="58" rx="10" fill="${IV}"/><rect id="scr" x="-23" y="-93" width="46" height="30" rx="5" fill="${SKY}"/><circle cx="-9" cy="-82" r="3" fill="${INK}" stroke="none"/><circle cx="9" cy="-82" r="3" fill="${INK}" stroke="none"/><path d="M-8 -72h16"/><circle cx="0" cy="-52" r="3" fill="${RASP}" stroke="none"/></g>`;
const SVG_AI=`<svg viewBox="-70 -140 140 160" preserveAspectRatio="xMidYMax meet"><g filter="url(#wob)">${AIFIG}</g></svg>`;
let art=null;
(function try_(i){const ex=['mp4','webm','png','jpg','webp'];if(i>=ex.length)return;const src=`part2/ai.${ex[i]}`;
  if(i<2){const v=document.createElement('video');v.onloadeddata=()=>{art={t:'v',src};paintAI()};v.onerror=()=>try_(i+1);v.src=src}
  else{const im=new Image();im.onload=()=>{art={t:'i',src};paintAI()};im.onerror=()=>try_(i+1);im.src=src}})(0);
function paintAI(){$('#aiart').innerHTML=art?(art.t==='v'?`<video src="${art.src}" autoplay loop muted playsinline></video>`:`<img src="${art.src}" alt="">`):SVG_AI}
paintAI();

function say(t,ms=2600){const e=$('#say');e.textContent=t;e.classList.add('on');return sleep(ms)}
function hush(){$('#say').classList.remove('on')}
async function type(el,t,ms=60){el.textContent='';for(const c of t){el.textContent+=c;await sleep(ms)}}
function typeSetup(el,html){
  el.innerHTML=html+'<span class="nx2" style="visibility:hidden">▼</span>';
  const sp=[];
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();[...n.nodeValue].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;s.style.visibility='hidden';f.appendChild(s);sp.push(s)});n.parentNode.replaceChild(f,n)});
  return sp;
}
function caption(who,text){
  return new Promise(res=>{
    $('#cap').classList.add('on');$('#capx').classList.remove('on');$('#cap .nm').textContent=who;
    const el=$('#capt');const sp=typeSetup(el,text);let k=0,done=false,tm;
    const fin=()=>{done=true;clearTimeout(tm);sp.forEach(x=>x.style.visibility='visible');const n=el.querySelector('.nx2');if(n)n.style.visibility='visible'};
    const step=()=>{if(done)return;if(k<sp.length)sp[k++].style.visibility='visible';if(k>=sp.length){fin();return}tm=setTimeout(step,FAST?2:38)};step();
    const go=()=>{if(!done){fin();return}capH=null;res()};capH=go;
  });
}
const capHide=()=>{$('#cap').classList.remove('on');capH=null};

/* 집행관 3명 — 그림은 임시 선화입니다(교체 예정) */
const FG='#EDE6DF';
const BODY=`<circle cx="100" cy="58" r="32"/><path d="M64 44h72"/><path d="M80 62h10M110 62h10"/><path d="M62 100h76l18 196H44z"/><path d="M100 100v196M52 200h96"/><path d="M80 296v52M120 296v52M64 348h32M104 348h32"/>`;
const PROP={
 club:`<path d="M138 110l34 84"/><path d="M164 196l-6-14 22-96q4-14 18-10t8 18l-26 96z" fill="#000"/>`,
 keys:`<path d="M138 110l30 90"/><circle cx="172" cy="214" r="15" fill="#000"/><g>${[-26,-9,9,26].map(d=>`<path d="M${172+d*.5} 229l${d*.9} 40"/><circle cx="${172+d*1.4}" cy="${274}" r="6"/><path d="M${172+d*1.4-6} 274h-8M${172+d*1.4} 280v10" />`).join('')}</g>`,
 book:`<path d="M138 110l-6 70 26 14"/><path d="M140 196l30-20 36 20v50l-36-20-30 20z" fill="#000"/><path d="M170 176v50M150 206l20-14M150 222l20-14M190 206l-20-14M190 222l-20-14"/>`
};
const fig=k=>`<svg viewBox="0 0 230 360" preserveAspectRatio="xMidYMax meet"><g fill="none" stroke="${FG}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#wob)">${BODY}${PROP[k]}</g></svg>`;
const EN=[
 {id:'retr',k:'응보',p:'club',say:'잘못한 만큼, 치르게 한다.'},
 {id:'det',k:'억제',p:'keys',say:'가둬서, 다음을 막는다.'},
 {id:'corr',k:'교정',p:'book',say:'고쳐서, 나아지게 한다.'}
];
$('#enf').innerHTML=EN.map(e=>`<div class="en" id="en-${e.id}" data-m="${e.id}"><div class="bub" id="bub-${e.id}">${e.say}</div>${fig(e.p)}<b>${e.k}</b></div>`).join('')+`<div class="en none" id="en-none" data-m="none"><span class="fx"></span><b>어떤 방식으로도<br>감당하지 못할 것 같다</b></div>`;
const LAB={retr:'응보',det:'억제',corr:'교정'};
const sel=new Set();let none=false;
function paintSel(){
  EN.forEach(e=>{const el=$('#en-'+e.id);el.classList.toggle('sel',sel.has(e.id));el.classList.toggle('off',none)});
  $('#en-none').classList.toggle('sel',none);$('#ok').disabled=!(sel.size||none);
}
$('#enf').addEventListener('click',ev=>{
  const c=ev.target.closest('.en');if(!c||!$('#enf').classList.contains('pick'))return;
  const m=c.dataset.m;
  if(m==='none'){none=!none;if(none)sel.clear()}
  else{none=false;sel.has(m)?sel.delete(m):sel.add(m)}
  paintSel();
});
$('#ok').onclick=async()=>{
  if($('#ok').disabled)return;
  $('#ok').classList.remove('on');$('#enf').classList.remove('pick');
  const ms=EN.filter(e=>sel.has(e.id)).map(e=>e.id);
  const m=none?'none':ms.join('+');
  post({gbd:'part3-done',burden:none?'no':'yes',method:m});
  const names=ms.map(x=>LAB[x]).join('·');
  $('#capt').textContent='';$('#cap').classList.remove('q');$('#cap .nm').style.visibility='visible';
  if(none)await caption('요원','어떤 방식으로도 감당하기 어렵다고 보셨군요.');
  else await caption('요원',names+'(이)라면 책임을 감당했다고 보시는군요.');
  await caption('요원','그럼 각각의 처벌 효과를 달성하기 위해서, AI가 갖춰야 할 조건들은 무엇이 있을까요?');
  capHide();post({gbd:'part3-next'});
};

/* 자막이 떠 있을 땐 화면 어디를 눌러도 다음으로 */
document.addEventListener('click',()=>{if(capH)capH()},true);
window.__go(async function main(){
  await sleep(500);$('#ai').classList.add('in');await sleep(1500);
  $('#jail').classList.add('in');
  await caption('요원','우리 사회가 요구하는 처벌의 효과는 크게 응보, 억제, 교정이 있습니다.');
  await caption('요원','우리 Guilty by Default에는 집행관이 셋 있습니다. 책임을 지게 하는 방식이 저마다 다르죠.');
  capHide();
  for(const e of EN){
    const el=$('#en-'+e.id);el.classList.add('in','walking');await sleep(2000);el.classList.remove('walking');
    $('#bub-'+e.id).classList.add('on');await sleep(2200);
  }
  await sleep(800);
  EN.forEach(e=>$('#bub-'+e.id).classList.remove('on'));
  await caption('요원','어느 방식이 맞다고 보시는지, 하나든 여러 개든 고르셔도 좋습니다.');
  $('#en-none').classList.add('in');
  /* 질문은 하단 자막 자리에 그대로 남는다 */
  $('#cap').classList.add('q');
  caption('요원','어떤 방식으로 처벌해야 AI가 책임을 감당했다고 볼 수 있을까?');
  $('#cap').classList.add('q');capH=null;
  $('#enf').classList.add('pick');$('#ok').classList.add('on');
});
</script>
</body></html>
