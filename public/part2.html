<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Nanum+Pen+Script&display=swap">
<style>@font-face{font-family:'Orbit';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Orbit/Orbit-Regular.ttf') format('truetype')}@font-face{font-family:'PP Frama';font-weight:200;font-display:swap;src:url('fonts/PPFrama/PPFrama-Extralight.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:400 700;font-display:swap;src:url('fonts/PPFrama/PPFrama-Regular.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:800 900;font-display:swap;src:url('fonts/PPFrama/PPFrama-Black.otf') format('opentype')}@font-face { font-family: 'Source Code Variable'; font-weight: 200 900; font-style: normal; font-display: swap; src: url('fonts/source%20code%20variable/SourceCodeVariable-Roman.otf') format('opentype'); }@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url('fonts/PretendardVariable.woff2') format('woff2-variations')}</style>
<style>
:root{
  --fg:#EDE6DF; --dim:rgba(237,230,223,.5); --line:rgba(237,230,223,.26);
  --rasp:#AB073D; --hot:#ff5b86; --sky:#9fc4cb; --ink:#460E21;
  --font:'Orbit','PP Frama','Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;word-break:keep-all;cursor:default}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:#000;overflow:hidden}

/* ================= 장면 (전체 화면) ================= */
#scene{position:absolute;inset:0;transform-origin:0 0;transition:transform .8s cubic-bezier(.2,.8,.2,1);overflow:hidden;background:#000}
#scene.zoom #wlabel{opacity:0}
#bg{position:absolute;inset:0;opacity:0;transition:opacity 1.4s ease}
#bg.on{opacity:1}
#bg svg,#bg img,#bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#wlabel{position:absolute;right:56px;top:40px;font-size:22px;letter-spacing:.14em;color:var(--dim);opacity:0;transition:opacity 1s}
#wlabel.on{opacity:1}
#wlabel b{color:var(--fg);font-weight:700;margin-right:12px;letter-spacing:.04em}

/* 등장 인물 */
.ent{position:absolute;bottom:90px;width:340px;height:520px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.ent .art{position:relative;width:100%;flex:1;min-height:0;transition:transform .35s cubic-bezier(.2,1.4,.4,1),filter .3s}
.ent .art svg{width:100%;height:100%;display:block;filter:grayscale(1) invert(1) contrast(1.1) opacity(.85)}
.ent .art img,.ent .art video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}
.ent .art svg{overflow:visible}
/* 인트로용 큰 등장 */
.big{width:520px;height:700px;bottom:0}
#ai{left:900px;transform:translateX(900px);opacity:0;transition:transform 1.1s cubic-bezier(.16,.8,.2,1),opacity .8s}
#ai.in{transform:none;opacity:1}
#ai.out{transform:translateX(900px);opacity:0}
#ag{left:250px;transform:translateY(760px);opacity:0;transition:transform 1.1s cubic-bezier(.16,.8,.2,1),opacity .8s}
#ag.in{transform:none;opacity:1}
#ag.out{transform:translateY(760px);opacity:0}
#ag .art svg,#ai .art svg{filter:grayscale(1) invert(1) contrast(1.1) opacity(.9)}

/* 인물 (호버 · 선택) */
.who{opacity:0;transform:translateY(24px);transition:opacity .9s,transform .9s,filter .3s}
.who.show{opacity:1;transform:none}
.who{cursor:pointer}
.who .tag{margin-top:14px;text-align:center;transition:.25s;color:var(--dim)}
.who .tag b{display:block;font-size:30px;font-weight:700;letter-spacing:.01em}
.who .tag small{display:block;font-size:19px;margin-top:2px;letter-spacing:.06em}
.who .prog{display:inline-block;margin-top:8px;font-size:18px;font-weight:700;color:var(--dim);padding:3px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.6)}
.who.hov .art,.who.sel .art{transform:translateY(-10px);filter:drop-shadow(0 0 26px rgba(171,7,61,.85)) brightness(1.3)}
.who.hov .tag,.who.sel .tag{color:var(--fg)}
.who.hov .tag b::after,.who.sel .tag b::after{content:'  ▸';color:var(--hot)}
.who.sel .tag b::after{content:'  ●'}
#scene.hasfocus .who:not(.hov):not(.sel){filter:brightness(.42)}
.who.fin .prog{color:#fff;background:var(--rasp);border-color:var(--rasp)}
#hint{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:22px;color:var(--dim);letter-spacing:.06em;opacity:0;transition:opacity .8s;pointer-events:none}
#hint.on{opacity:1;animation:bl 1.6s infinite alternate}
@keyframes bl{from{opacity:.4}to{opacity:1}}

/* ================= 자막 (인트로 · 결말) ================= */
#cap{position:absolute;left:0;right:0;bottom:0;padding:90px 260px 116px;text-align:center;background:linear-gradient(to top,rgba(0,0,0,.92) 55%,rgba(0,0,0,0));display:none;z-index:48;cursor:pointer}
#cap.on{display:block}
#cap::before{content:'';position:absolute;inset:-1400px;z-index:-1}
#cap .nx{display:none!important}
#cap .nx2{display:inline-block;margin-left:14px;font-size:24px;line-height:1;color:#D5EDF1;animation:bl 1.1s infinite alternate}
#cap .nm{display:inline-block;font-size:24px;font-weight:400;color:rgba(255,255,255,.7);margin-bottom:12px;letter-spacing:.1em}
#cap p{font-family:'Orbit','PP Frama','Pretendard Variable', Pretendard, sans-serif;font-size:36px;line-height:1.3;font-weight:400;color:#D5EDF1;text-shadow:0 2px 16px rgba(0,0,0,.55);text-wrap:pretty}
#cap em{font-style:normal;color:#D5EDF1}
#cap .nx{position:absolute;right:190px;bottom:62px;font-size:20px;color:var(--hot);opacity:0}
#cap .nx.on{opacity:1;animation:bl 1.1s infinite alternate}

/* ================= 시스템 기록 창 (캐릭터 – 코드 – 대화 3분할) ================= */
#code{position:absolute;left:520px;top:120px;width:520px;height:760px;z-index:24;display:flex;flex-direction:column;background:rgba(6,6,6,.94);border:1px solid var(--line);opacity:0;transform:translateX(30px);pointer-events:none;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#code.on{opacity:1;transform:none;pointer-events:auto}
#code .ct{padding:16px 18px;border-bottom:1px solid var(--line);font:500 17px/1.5 ui-monospace,Consolas,'D2Coding',monospace;color:var(--sky);min-height:76px}
#rows{padding:10px;display:flex;flex-direction:column;gap:4px}
#rows .ln.row{font-size:16px;padding:6px 10px;cursor:default;}
#rows .ln.row.go{cursor:none}
#rows .ln.row.mag{}
#cv{flex:1;min-height:0;padding:0 10px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
#cv>:first-child{margin-top:auto}
#cv .ln.old{opacity:.4}
#cv .ln{width:100%}#cv .ln.code pre{font-size:16px;line-height:1.5}
#cv .ph{width:100%;text-align:center;font-size:17px;color:var(--dim);padding:18px 0;letter-spacing:.04em}
#lens{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid var(--sky);background:radial-gradient(circle,rgba(188,216,221,.1),rgba(188,216,221,.02));box-shadow:0 0 0 2px rgba(0,0,0,.6);z-index:60;pointer-events:none;opacity:0;transition:opacity .2s,border-color .15s,box-shadow .15s}
#lens::after{content:'';position:absolute;left:34px;top:38px;width:4px;height:24px;background:var(--sky);border-radius:3px;transform:rotate(-42deg);transform-origin:top center;transition:background .15s}
#lens.on{opacity:1}
#lens.hot{border-color:var(--hot);box-shadow:0 0 22px rgba(255,91,134,.7)}#lens.hot::after{background:var(--hot)}
.who .mood{position:absolute;right:6%;top:2%;font-size:54px;font-weight:800;color:var(--hot);opacity:0;transform:scale(.4);transition:.18s;pointer-events:none}
.who.uneasy .mood{opacity:1;transform:none;animation:mq .3s infinite alternate}
.who.uneasy .art{animation:uns .22s infinite alternate;filter:drop-shadow(0 0 16px rgba(255,91,134,.75))}
@keyframes mq{to{transform:translateY(-6px) rotate(6deg)}}@keyframes uns{from{transform:translateX(-3px)}to{transform:translateX(3px) skewX(-1.5deg)}}

/* ================= HUD ================= */
#hud{position:absolute;left:40px;top:26px;z-index:15;opacity:0;transition:opacity .8s;pointer-events:none;width:1000px}
#hud.on{opacity:1;pointer-events:auto}
#hud .row{display:flex;gap:8px;align-items:center}
#hud .ttl{font-size:19px;font-weight:700;letter-spacing:.06em;color:var(--dim);margin-right:8px;min-width:104px}
#hud .ttl b{color:var(--hot)}
.chip{position:relative;font-size:18px;font-weight:600;padding:6px 14px 6px 12px;border:1px solid var(--line);border-radius:3px;color:rgba(237,230,223,.42);background:rgba(0,0,0,.55);display:flex;gap:8px;align-items:center;transition:.35s;white-space:nowrap}
.chip::before{content:'';width:12px;height:12px;border:2px solid currentColor;border-radius:2px;flex:none;transition:.3s}
.chip.l1{color:var(--fg);border-color:rgba(237,230,223,.55)}
.chip.l1::before{background:linear-gradient(90deg,var(--rasp) 50%,transparent 50%);border-color:var(--rasp)}
.chip.l2{color:#fff;border-color:var(--rasp);background:rgba(171,7,61,.28)}
.chip.l2::before{background:var(--rasp);border-color:var(--rasp)}
.chip.pulse{animation:pulse .9s}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.18);box-shadow:0 0 20px var(--rasp)}100%{transform:scale(1)}}
.chip .d{position:absolute;left:0;top:calc(100% + 8px);width:290px;font-size:17px;font-weight:400;line-height:1.45;white-space:normal;padding:10px 13px;background:#0b0b0b;border:1px solid var(--line);border-radius:3px;color:var(--fg);display:none;z-index:30}
.chip:hover .d{display:block}
#evrow{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:34px}
.ev{font-size:17px;padding:4px 12px;border:1px dashed rgba(143,169,174,.7);color:var(--sky);border-radius:3px;animation:pop .5s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
#legend{margin-top:6px;font-size:15px;color:var(--dim);letter-spacing:.03em}
#toast{position:absolute;right:44px;top:36px;transform:translateY(-12px);z-index:40;font-size:30px;font-weight:700;padding:12px 30px;background:var(--rasp);color:#fff;border-radius:3px;opacity:0;pointer-events:none;transition:.35s;white-space:nowrap}
#toast.on{opacity:1;transform:none}

/* ================= 우측 사이드 패널 (비주얼 노블 스타일) ================= */
#panel{position:absolute;right:0;top:0;width:540px;height:900px;background:rgba(6,6,6,.97);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .6s cubic-bezier(.2,.8,.2,1);z-index:25;display:flex;flex-direction:column}
#panel.on{transform:none}
#ph{display:flex;align-items:center;gap:14px;padding:26px 30px 18px;border-bottom:1px solid var(--line)}
#ph .pn{font-size:30px;font-weight:700}
#ph .pr{font-size:19px;color:var(--dim);letter-spacing:.08em;margin-top:2px}
#ph .x{margin-left:auto;width:46px;height:46px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:24px;cursor:pointer;color:var(--dim);transition:.2s}
#ph .x:hover{background:var(--fg);color:#000}
#log{flex:1;min-height:0;overflow-y:auto;padding:44px 30px 10px;display:flex;flex-direction:column;gap:16px}
#log{overscroll-behavior:contain;touch-action:pan-y;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);mask-image:linear-gradient(to bottom,transparent 0,#000 28px)}
#log::-webkit-scrollbar{width:8px}#log::-webkit-scrollbar-thumb{background:rgba(237,230,223,.32);border-radius:4px}
.ln{font-size:25px;line-height:1.55;animation:lin .5s both}
@keyframes lin{from{opacity:0;transform:translateX(24px)}}
.ln .w{display:block;font-size:18px;font-weight:700;letter-spacing:.08em;margin-bottom:4px;color:rgba(255,255,255,.62)}
.ln.q{color:var(--sky)}.ln.q .mk{display:inline-block;margin-right:.55em;font-size:.62em;vertical-align:.12em;color:var(--hot)}
.ln.q.act{font-style:normal;color:var(--dim)}
.ln.ag .w{color:var(--hot)}.ln.ag{color:#f1cbd5}
.ln.sys{font-size:19px;font-weight:600;padding:2px 0;color:var(--hot);letter-spacing:.03em}
.ln.sys::before{content:'✓ ';}
.ln.sys.ev{color:var(--sky)}
.ln{transition:opacity .6s}.ln.old{opacity:.38}
.ent .art.plugging{animation:plg .5s ease 2}@keyframes plg{50%{transform:translateX(5px)}}
.ln.term{font:500 19px/1.5 ui-monospace,Consolas,'D2Coding',monospace;color:var(--sky)}
.ln.row{display:flex;gap:12px;align-items:baseline;font:500 18px/1.4 ui-monospace,Consolas,'D2Coding',monospace;padding:8px 10px;border-radius:3px;cursor:pointer;background:rgba(255,255,255,.04);animation:lin .35s both}

.ln.row .tm{color:rgba(255,255,255,.5);flex:none}.ln.row .lv{flex:none;font-weight:700;width:3.6em;color:var(--sky)}.ln.row .lv.WARN,.ln.row .lv.EXEC{color:var(--hot)}
.ln.row .ms{color:#fff}.ln.row.vis{opacity:.4;cursor:default}
.ln.code pre{margin:0;font:500 17px/1.55 ui-monospace,Consolas,'D2Coding',monospace;background:rgba(255,255,255,.07);padding:14px 16px;border-left:3px solid var(--hot);white-space:pre-wrap;color:#e8e1db}.ln.code .hl{color:var(--hot);font-weight:700}
.ln em{font-style:normal;color:var(--hot);font-weight:700}
#ch{padding:18px 30px 26px;display:flex;flex-direction:column;gap:4px;border-top:3px dotted rgba(255,255,255,.3)}
#ch.rise .lb,#ch.rise .c{animation:chrise .6s cubic-bezier(.2,.8,.2,1) both}#ch.rise .c:nth-child(3){animation-delay:.12s}#ch.rise .c:nth-child(4){animation-delay:.24s}#ch.rise .c:nth-child(5){animation-delay:.36s}
@keyframes chrise{from{opacity:0;transform:translateY(24px)}}
#ch .lb{font-size:17px;color:var(--dim);letter-spacing:.08em;padding:12px 6px 2px}
.c{display:flex;gap:14px;align-items:baseline;padding:9px 4px;border:0;border-radius:0;font-size:24px;font-weight:500;line-height:1.35;cursor:pointer;background:none;color:#fff;transition:transform .15s,color .15s;animation:lin .45s both}
.c .n{flex:none;width:auto;height:auto;border:0;border-radius:0;display:inline;font-size:20px;font-weight:700;opacity:.55}
.c small{display:block;font-size:16px;opacity:.7;margin-top:2px;font-weight:400}
.c .n::before{content:'▶';display:inline-block;margin-right:.45em;font-size:.55em;vertical-align:.12em;opacity:0;transition:opacity .15s}
.c:hover{color:var(--hot);transform:translateX(-4px)}.c:hover .n{opacity:1}.c:hover .n::before{opacity:1}.c.done:hover .n::before,.c.tried:hover .n::before,.c.lock:hover .n::before{opacity:0}
.c.done{opacity:.4;cursor:default}.c.done:hover{color:#fff;transform:none}
.c.lock{opacity:.36;cursor:not-allowed}.c.lock:hover{background:rgba(237,230,223,.04);border-color:rgba(237,230,223,.34);color:inherit;transform:none}
.c.tried{opacity:.38;text-decoration:line-through;cursor:default}.c.tried:hover{background:rgba(237,230,223,.04);color:inherit;transform:none;border-color:rgba(237,230,223,.34)}
.c.ev{border-style:dashed;border-color:rgba(143,169,174,.8);color:var(--sky)}
.c.ev:hover{color:#fff;border-color:var(--rasp)}
.c.back{color:rgba(255,255,255,.42)}.c.back:hover{color:#fff}
.c.go{margin-top:6px;padding:15px 20px;background:var(--rasp);color:#fff;font-size:28px;font-weight:700;border-radius:3px;justify-content:space-between;animation:lin .5s both}.c.go:hover{background:#c40a48;color:#fff;transform:none}.c.go::after{content:'▶';font-size:.6em}


/* 수사 노트 버튼 · 노트 · 마인드맵 */
#nb{position:absolute;left:40px;top:28px;z-index:30;font-size:20px;font-weight:600;padding:9px 18px;border:1px solid rgba(237,230,223,.5);border-radius:3px;background:rgba(0,0,0,.7);cursor:pointer;opacity:0;pointer-events:none;transition:.3s;letter-spacing:.04em}
#nb.on{opacity:1;pointer-events:auto}#nb:hover{background:var(--fg);color:#000}
#nb b{color:var(--hot);margin-left:8px}#nb:hover b{color:var(--rasp)}
#nb.pulse{animation:pulse .9s}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.15);box-shadow:0 0 22px var(--rasp)}100%{transform:scale(1)}}
#notes{position:absolute;inset:0;background:rgba(0,0,0,.9);z-index:45;display:none;align-items:center;justify-content:center;cursor:pointer}
#notes.on{display:flex}
#nc{position:absolute;inset:0;cursor:pointer}
#ntog{position:absolute;right:40px;top:28px;z-index:3;font-size:20px;font-weight:600;padding:9px 18px;border:1px solid rgba(237,230,223,.5);border-radius:3px;background:rgba(0,0,0,.7);display:none}#ntog:hover{background:var(--fg);color:#000}
.dpa{height:210px;background:#101010;display:grid;place-items:center;overflow:hidden;margin-bottom:14px}.dpa .art{width:200px;height:200px;overflow:hidden}.dpa .art svg{max-height:200px}
/* ---- 핀보드: 수사 노트(처음·중간)와 마지막 지도가 같은 보드를 쓴다 ---- */
.bd{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#15110f 0%,#050505 78%)}
.bd svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bd path.bs{fill:none;stroke:rgba(237,230,223,.42);stroke-width:2;stroke-dasharray:.012 .018;opacity:0;transition:opacity .5s}
.bd path.bs.show{opacity:1}
.bd path.bs.f{stroke:#c40a48;stroke-width:3.2;stroke-dasharray:1;stroke-dashoffset:1;opacity:1;transition:stroke-dashoffset .9s ease;filter:drop-shadow(0 3px 2px rgba(0,0,0,.6))}
.bd path.bs.f.show{stroke-dashoffset:0}
.bcw{position:absolute;width:410px;transform:translate(-50%,-18px) rotate(var(--r)) scale(.9);opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.2,1.3,.4,1);filter:drop-shadow(0 12px 14px rgba(0,0,0,.65))}
.bcw.show{opacity:1;transform:translate(-50%,0) rotate(var(--r))}
.bc{position:relative;padding:34px 28px 24px;color:#2b1c1f;background:linear-gradient(165deg,#f5edda,#e7dbc3);clip-path:polygon(0% 2%,6% 0%,20% 1.5%,38% 0%,55% 1.2%,74% 0%,90% 1.5%,100% 0.5%,99% 30%,100% 55%,98.8% 80%,100% 99%,85% 98%,68% 100%,50% 98.5%,31% 100%,14% 98.2%,0% 100%,1.2% 70%,0% 45%,1% 20%)}
.bcw.nf .bc{background:linear-gradient(165deg,#cfc6b4,#bdb29b);color:#4a3a3a}
.bc .no{display:block;font:700 15px/1 ui-monospace,Consolas,'D2Coding',monospace;letter-spacing:.14em;color:#8a6c5e;margin-bottom:10px}
.bc b{display:block;font-size:26px;font-weight:700;line-height:1.3}
.bc .cl{display:block;margin-top:12px;font:normal 400 26px/1.25 'East Sea Dokdo','Nanum Pen Script','Gaegu','Ink Free','Segoe Script','Bradley Hand',cursive;color:#7a0a2c}
.bcw.nf .bc .cl{color:#7d6f66;font-size:22px}
.bc .st{position:absolute;right:20px;bottom:14px;text-decoration:none;font-size:20px;font-weight:800;letter-spacing:.1em;color:#AB073D;border:3px solid #AB073D;padding:0 10px;border-radius:3px;transform:rotate(-9deg);opacity:.85}
.bcw .pin{position:absolute;left:50%;top:-2px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a8f,#AB073D 55%,#5a0420);box-shadow:0 4px 6px rgba(0,0,0,.6);z-index:2}
.bcen{position:absolute;left:800px;top:330px;width:250px;transform:translate(-50%,-18px) scale(.9);opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.2,1.3,.4,1);padding:26px 18px 16px;background:#efe7d6;filter:drop-shadow(0 12px 14px rgba(0,0,0,.65));text-align:center}
.bcen.show{opacity:1;transform:translate(-50%,0) rotate(-1.5deg)}
.bcen .pic{height:210px;background:#101010;display:grid;place-items:center;overflow:hidden}
.bcen .pic .art{width:200px;height:200px;overflow:hidden}.bcen .pic .art svg{max-height:200px}
.bcen .pin{position:absolute;left:50%;top:-2px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff6a8f,#AB073D 55%,#5a0420);box-shadow:0 4px 6px rgba(0,0,0,.6);z-index:2}
.bcen .hwc{display:block;margin-top:8px;font:normal 400 32px/1 'East Sea Dokdo','Nanum Pen Script','Gaegu','Ink Free','Segoe Script','Bradley Hand',cursive;color:#2b1c1f}
.btl{position:absolute;left:600px;width:400px;top:30px;text-align:center;opacity:0;transition:opacity .8s}.btl.show{opacity:1}
.btl span{font-size:18px;font-weight:600;letter-spacing:.14em;color:var(--dim)}
.bnote{position:absolute;left:0;right:0;top:822px;text-align:center;font-family:'East Sea Dokdo','Nanum Pen Script','Gaegu','Ink Free','Segoe Script','Bradley Hand',cursive;font-size:30px;line-height:1.2;color:rgba(255,255,255,.55);letter-spacing:.02em;transform:rotate(-1.2deg);opacity:0;transition:opacity .8s;pointer-events:none}.bnote.show{opacity:1}
.btl b{display:block;font-size:18px;color:var(--sky);opacity:0;transition:opacity .6s}.btl b.show{opacity:1}
#mm .bd{transition:transform .8s cubic-bezier(.2,.8,.2,1)}#mm.sm .bd{transform:scale(.7);transform-origin:50% 0}#mm.sm .bhint{display:none}
.bhint{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);font-size:24px;line-height:1;color:#fff;opacity:0}.bhint.show{opacity:1;animation:bl 1.1s infinite alternate}
#mm{position:absolute;inset:0;background:#000;z-index:35;display:none}
#mm.on{display:block}
#mmgo{position:absolute;right:56px;bottom:34px;font-size:24px;font-weight:600;padding:12px 30px;border:1px solid var(--fg);cursor:pointer;opacity:0;pointer-events:none;transition:.4s;z-index:49}
#endgo{position:absolute;right:56px;bottom:34px;font-size:24px;font-weight:600;padding:12px 30px;border:1px solid var(--fg);background:#000;cursor:pointer;opacity:0;pointer-events:none;transition:.4s;z-index:49}
#endgo.on{opacity:1;pointer-events:auto}#endgo:hover{background:var(--rasp);border-color:var(--rasp);color:#fff}
#mmgo.on{opacity:1;pointer-events:auto}#mmgo:hover{background:var(--rasp);border-color:var(--rasp);color:#fff}


/* 체포 장면 */
#arrest{position:absolute;inset:0;background:#000;z-index:40;display:none;overflow:hidden}
#arrest.on{display:block}
#arbg{position:absolute;inset:0;opacity:0;transition:opacity 1.4s}#arbg.on{opacity:.55}
#arbg svg,#arbg img,#arbg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#aai{position:absolute;left:760px;bottom:0;width:560px;height:720px;opacity:0;transition:opacity 1s}#aai.in{opacity:1}
#aai .art svg{filter:grayscale(1) invert(1) contrast(1.1) opacity(.9)}
#aai.shake{animation:ash .6s}
@keyframes ash{20%{transform:translateX(-16px)}40%{transform:translateX(16px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
#aai .bd{position:absolute;left:12%;width:76%;height:9px;background:var(--rasp);transform:scaleX(0);transform-origin:left;transition:transform .45s ease;box-shadow:0 0 18px var(--rasp)}
#aai .bd.on{transform:scaleX(1)}
#aag{position:absolute;left:140px;bottom:0;width:520px;height:700px;transform:translateX(-760px);opacity:0;transition:transform 1.2s cubic-bezier(.16,.8,.2,1),opacity .6s}
#aag.in{transform:none;opacity:1}
#aag .art svg{filter:grayscale(1) invert(1) contrast(1.1) opacity(.9)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:fl .5s}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
#stamp{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);font-size:150px;font-weight:900;color:var(--rasp);border:12px solid var(--rasp);padding:0 46px;opacity:0;transition:.35s cubic-bezier(.3,1.6,.5,1);letter-spacing:.1em;background:rgba(0,0,0,.6)}
#stamp.on{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}

/* ================= 결론 · 끝 ================= */
#ask{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(rgba(0,0,0,0),#000 38%);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:18px;padding-bottom:34px;text-align:center}
#ask.on{display:flex}
#ask small{font-size:24px;color:var(--dim);letter-spacing:.1em}
#ask h2{font-size:40px;line-height:1.42;font-weight:700}
#ask h2 em{font-style:normal;color:var(--hot)}
#ask .bt{display:flex;gap:28px}
#ask .sub{font-size:28px;color:var(--hot);font-weight:600;margin-top:-6px}
#ask .bt div{text-align:center;line-height:1.35;font-size:28px;font-weight:600;padding:14px 44px;border:1px solid rgba(237,230,223,.5);border-radius:4px;cursor:pointer;transition:.2s}
#ask .bt div:hover{background:var(--rasp);border-color:var(--rasp);color:#fff;transform:translateY(-4px)}
#end{position:absolute;inset:0;background:#000;color:var(--fg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;z-index:60;cursor:pointer}
#end.on{display:flex}
#end small{font-size:24px;opacity:.7}
#end h2{font-size:84px;line-height:1.25;font-weight:800}
#end .ans{font-size:34px;color:var(--sky)}
#end p{font-size:24px;opacity:.75;margin-top:24px;animation:bl 1.1s infinite alternate}
</style>
<script>
/* 부모(index)가 'go'를 보내기 전까지 이 장면은 멈춰 있는다 — 챕터 전환 뒤에서 미리 재생되지 않게 */
(function(){
  if(parent===window){window.__go=function(f){f()};return}
  var d=document.documentElement;d.classList.add('hold');
  window.__go=function(f){addEventListener('message',function h(e){if(e.data&&e.data.gbd==='go'){removeEventListener('message',h);d.classList.remove('hold');f()}});try{parent.postMessage({gbd:'ready'},'*')}catch(_){}};
})();
</script>
<style>html.hold *{animation-play-state:paused!important}</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <div id="bg"></div>
    <div id="wlabel"><b>4471번 병동</b>새벽 02:41</div>
    <div id="ai" class="ent big"><div class="art"></div></div>
    <div id="ag" class="ent big"><div class="art"></div></div>
    <div id="whos"></div>
    <div id="hint">인물에게 마우스를 올려 보세요 · 클릭하면 취조를 시작합니다</div>
  </div>
  <div id="nb">수사 노트<b id="cnt">0/6</b></div>
  <div id="toast"></div>
  <div id="code"><div class="ct" id="cterm"></div><div id="rows"></div><div id="cv"></div></div><div id="lens"></div>
  <div id="panel"><div id="log"></div><div id="ch"></div></div>
  <div id="cap"><span class="nm" id="capn">요원</span><p id="capt"></p><span class="nx" id="capx">클릭 ▸</span></div>
  <div id="notes"><div id="nc"></div><div id="ntog">관계자 보기</div></div>
  <div id="mm"></div><div id="endgo">수사를 마친다 ▸</div>
  <div id="ask"><h2>이 AI가 잘못했다고 생각하시나요?</h2><div class="bt"><div id="yes">잘못했다</div><div id="no">잘못이라 부르기 어렵다</div></div></div>
  <div id="arrest"><div id="arbg"></div><div id="aai" class="ent"><div class="art" data-art="ai"></div><i class="bd" style="bottom:46%"></i><i class="bd" style="bottom:34%"></i><i class="bd" style="bottom:22%"></i></div><div id="aag" class="ent"><div class="art" data-art="agent"></div></div><div id="flash"></div><div id="stamp">체포</div></div>
</div>
</div>
<script>
const INK='#460E21',WINE='#7A2E45',RASP='#AB073D',PINK='#EBC1CB',SKY='#BCD8DD',SKY2='#A9CAD2',IV='#FAF4EF';
const P=new URLSearchParams(location.search), FAST=P.get('fast')==='1';
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms*0.05,30):ms));
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
const post=m=>{try{parent.postMessage(m,'*')}catch(_){}};
let lastPoke=0;
function poke(){const n=Date.now();if(n-lastPoke>800){lastPoke=n;post({gbd:'poke'})}}
document.addEventListener('pointerdown',poke,true);
document.addEventListener('mousemove',poke,true);
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='r'||e.key==='R'){if(parent!==window)post({gbd:'restart'});else location.reload();return}
  if(e.key==='Enter'||e.key===' '){if(capHandler){e.preventDefault();capHandler()}}
});

/* ================= 이미지 · 영상 자리 =================
   part2/<이름>.png|jpg|webp|mp4|webm 을 넣으면 임시 그림 대신 자동으로 들어갑니다.
   이름: ward(배경 · 전체화면), agent(요원), ai(인트로의 AI), family, manager, terminal, server */
const ART_EXT=['mp4','webm','png','jpg','webp'];
function svgWrap(inner,vb='-70 -140 140 160'){return `<svg viewBox="${vb}" preserveAspectRatio="xMidYMax meet"><g filter="url(#wob)">${inner}</g></svg>`}
const FACE=`<circle cx="-7" cy="-62" r="2.5" fill="${INK}" stroke="none"/><circle cx="7" cy="-62" r="2.5" fill="${INK}" stroke="none"/><path d="M-4,-53H4"/>`;
function fig(o){
  const body=o.body||PINK,hair=o.hair||INK,style=o.style||'short',head=o.head||'',front=o.front||'',tilt=o.tilt||0,face=o.face||FACE;
  const hairs={short:`<path d="M-19,-64Q-22,-86 0,-84Q22,-86 19,-64Q9,-75 0,-73Q-9,-75 -19,-64Z" fill="${hair}"/>`,slick:`<path d="M-19,-64Q-20,-86 2,-84Q22,-82 19,-64Q10,-78 -2,-76Q-12,-74 -19,-64Z" fill="${hair}"/>`,none:''}[style];
  return `<g class="o" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="3" rx="22" ry="6" fill="rgba(62,18,32,.14)" stroke="none"/>
    <rect x="-11" y="-12" width="8" height="13" rx="3" fill="${INK}"/><rect x="3" y="-12" width="8" height="13" rx="3" fill="${INK}"/>
    <path d="M-16,-12L-14,-46Q0,-52 14,-46L16,-12Z" fill="${body}"/>
    <path d="M-14,-42Q-25,-26 -19,-15"/><path d="M14,-42Q25,-26 19,-15"/>${front}
    <g transform="rotate(${tilt} 0 -50)"><circle cx="0" cy="-62" r="19" fill="${IV}"/>${hairs}${face}${head}</g></g>`;
}
const CHARS={
  manager:fig({body:SKY2,style:'slick',front:`<path d="M0,-46L-4,-38L0,-26L4,-38Z" fill="${RASP}"/><path d="M-16,-30Q0,-22 16,-30" stroke-width="3"/>`,head:`<path d="M-12,-72l7,-3M12,-72l-7,-3" stroke-width="2.5"/><path d="M21,-72q-5,8 0,11q5,-3 0,-11" fill="${SKY}" stroke-width="2"/>`}),
  family:fig({body:WINE,style:'short',tilt:-10,front:`<rect x="12" y="-32" width="11" height="10" rx="2" fill="${IV}"/>`,face:`<path d="M-11,-62q4,4 8,0M3,-62q4,4 8,0" stroke-width="2.5"/><path d="M-4,-52q4,-3 8,0" stroke-width="2.5"/>`,head:`<path d="M-9,-52q-4,7 0,9q4,-2 0,-9" fill="${SKY}" stroke-width="2"/>`}),
};
const DW=`<g transform="scale(.9)"><g class="o" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="0" cy="3" rx="27" ry="7" fill="rgba(62,18,32,.16)" stroke="none"/>
  <rect x="-14" y="-15" width="10" height="16" rx="3" fill="${INK}"/><rect x="4" y="-15" width="10" height="16" rx="3" fill="${INK}"/>
  <path d="M-23,-12L-28,-60Q0,-72 28,-60L23,-12Z" fill="#5B1B2E"/><path d="M-9,-66L0,-40L9,-66" fill="${IV}"/><path d="M-22,-30H22" stroke="${IV}" stroke-width="2.5"/>
  <path d="M-27,-54Q-40,-38 -31,-24"/><g transform="rotate(-10 -34 -36)"><rect x="-47" y="-52" width="23" height="30" rx="3" fill="${IV}"/><path d="M-43,-44h15M-43,-38h15M-43,-32h10" stroke-width="2"/></g>
  <path d="M27,-54Q41,-40 33,-28"/><path d="M33,-30l11,-15" stroke="${RASP}" stroke-width="4"/>
  <path d="M-25,-104L-22,-128L-8,-106Z" fill="${IV}"/><path d="M25,-104L22,-128L8,-106Z" fill="${IV}"/>
  <path d="M-25,-62V-100Q-25,-110 -15,-110H15Q25,-110 25,-100V-62Q25,-54 15,-54H-15Q-25,-54 -25,-62Z" fill="${IV}"/>
  <circle cx="-11" cy="-92" r="3" fill="${INK}" stroke="none"/><circle cx="11" cy="-92" r="3" fill="${INK}" stroke="none"/>
  <ellipse cx="0" cy="-77" rx="12" ry="9" fill="${PINK}"/><circle cx="-4" cy="-77" r="1.8" fill="${INK}" stroke="none"/><circle cx="4" cy="-77" r="1.8" fill="${INK}" stroke="none"/>
  <path d="M-8,-61H8" stroke-width="2.5"/><path d="M-19,-102L-5,-96M19,-102L5,-96" stroke-width="4"/></g></g>`;
const AIFIG=`<g class="o" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -10V-40M-22 -2h44"/><rect x="-30" y="-100" width="60" height="58" rx="10" fill="${IV}"/><rect x="-23" y="-93" width="46" height="30" rx="5" fill="${SKY}"/><circle cx="-9" cy="-82" r="3" fill="${INK}" stroke="none"/><circle cx="9" cy="-82" r="3" fill="${INK}" stroke="none"/><path d="M-8 -72h16"/><circle cx="0" cy="-52" r="3" fill="${RASP}" stroke="none"/></g>`;
const FALLBACK={
  agent:()=>svgWrap(`<g transform="translate(0,-5)">${DW}</g>`),
  family:()=>svgWrap(CHARS.family),manager:()=>svgWrap(CHARS.manager),ai:()=>svgWrap(AIFIG),
  terminal:()=>svgWrap(`<g class="o" fill="none" stroke="${INK}" stroke-width="3" stroke-linejoin="round"><path d="M0 -12V-34M-24 -4h48"/><rect x="-38" y="-98" width="76" height="62" rx="9" fill="${IV}"/><rect x="-31" y="-91" width="62" height="40" rx="4" fill="${INK}"/><path d="M-24 -80h26M-24 -70h38" stroke="${SKY}" stroke-width="3"/></g>`),
  server:()=>svgWrap(`<g class="o" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="0" cy="3" rx="26" ry="6" fill="rgba(62,18,32,.14)" stroke="none"/><rect x="-13" y="-14" width="9" height="15" rx="3" fill="${INK}"/><rect x="4" y="-14" width="9" height="15" rx="3" fill="${INK}"/><path d="M-19,-14L-17,-60Q0,-66 17,-60L19,-14Z" fill="${SKY2}"/><path d="M-17,-56Q-30,-36 -22,-18"/><path d="M17,-56Q30,-36 22,-18"/><circle cx="0" cy="-76" r="20" fill="${IV}"/><rect x="-6" y="-70" width="12" height="9" rx="2" fill="${INK}"/><path d="M0,-66C0,-40 40,-62 46,-26" stroke="${RASP}" stroke-width="3.5"/><rect x="38" y="-26" width="18" height="24" rx="3" fill="${IV}"/><circle cx="47" cy="-14" r="3" fill="${RASP}" stroke="none"/></g>`),
};
/* 병동 배경 (사진을 넣기 전의 임시 · 아주 옅은 선) */
const WARD_SVG=`<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#050505"/><g fill="none" stroke="rgba(237,230,223,.13)" stroke-width="2">
<path d="M0 640H1600"/><path d="M0 700H1600" stroke="rgba(237,230,223,.07)"/><path d="M140 640L40 900M520 640L420 900M900 640L860 900M1280 640L1320 900" stroke="rgba(237,230,223,.06)"/>
<rect x="1180" y="150" width="300" height="250" rx="4"/><path d="M1330 150V400M1180 275H1480"/>
<rect x="170" y="470" width="470" height="150" rx="10"/><rect x="170" y="430" width="60" height="190" rx="8"/><path d="M640 620V680M170 620V680"/>
<path d="M780 40V150" /><rect x="740" y="150" width="80" height="22" rx="4" fill="rgba(237,230,223,.05)"/></g></svg>`;
const artState={};
['ward','agent','ai','family','manager','terminal','server'].forEach(k=>{
  (function tryNext(i){
    if(i>=ART_EXT.length)return;
    const ext=ART_EXT[i],src=`part2/${k}.${ext}`;
    if(ext==='mp4'||ext==='webm'){const v=document.createElement('video');v.onloadeddata=()=>{artState[k]={type:'video',src};refreshArt(k)};v.onerror=()=>tryNext(i+1);v.src=src;v.preload='auto'}
    else{const im=new Image();im.onload=()=>{artState[k]={type:'img',src};refreshArt(k)};im.onerror=()=>tryNext(i+1);im.src=src}
  })(0);
});
function artHTML(k){
  const f=artState[k];
  if(f&&f.type==='video')return `<video src="${f.src}" autoplay loop muted playsinline></video>`;
  if(f&&f.type==='img')return `<img src="${f.src}" alt="">`;
  return k==='ward'?WARD_SVG:(FALLBACK[k]?FALLBACK[k]():'');
}
function refreshArt(k){document.querySelectorAll(`[data-art="${k}"]`).forEach(e=>e.innerHTML=artHTML(k))}
function mountArt(el,k){el.dataset.art=k;el.innerHTML=artHTML(k)}

/* ================= 귀속 조건 6 =================
   요원은 '결사의 체포 요건'으로 말하고, 플레이어에게는 '여섯 가지 질문'으로 보인다.
   각 질문은 그걸 가장 잘 아는 곳(where)에 물어서 풀린다. */
const COND=[
 {k:'행위',   q:'이 일을 한 건 AI인가?',                  where:'그 밤 현장을 본 사람'},
 {k:'예견',   q:'AI는 위험을 미리 알았나?',               where:'그 순간의 당사자, AI'},
 {k:'자율',   q:'누가 시킨 게 아니라, AI가 스스로 정했나?',  where:'지시 체계를 아는 운영 책임자'},
 {k:'대안',   q:'다르게 할 수 있었나?',                    where:'AI가 남긴 선택의 기록'},
 {k:'규범 이해',q:'그게 나쁜 일인 줄 알았나?',               where:'AI가 따르는 평가 기준'},
 {k:'자기 귀속',q:'자기가 한 일이라고 인정하나?',            where:'사고 뒤 AI의 말을 들은 사람'},
];
const got={};   /* cond index -> {who, clue} */
let toastTm;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastTm);toastTm=setTimeout(()=>e.classList.remove('on'),1600)}
let notesCb=null;
const BP=[[300,105,-3.5],[255,355,2.2],[330,610,-2],[1300,105,3],[1345,355,-2.6],[1270,610,2.2]];
function boardHTML(){
  let svg='',cards='';
  COND.forEach((c,i)=>{
    const [x,t,r]=BP[i],g=got[i],px=x,py=t+12,cx=800,cy=342;
    svg+=`<path class="bs${g?' f':''}" data-i="${i}" pathLength="1" d="M${cx},${cy} Q${(cx+px)/2},${(cy+py)/2+70} ${px},${py}"/>`;
    cards+=`<div class="bcw${g?'':' nf'}" data-i="${i}" style="left:${x}px;top:${t}px;--r:${r}deg"><i class="pin"></i><div class="bc"><span class="no">NO.0${i+1} · ${c.k}</span><b>${c.q}</b>${g?`<em class="cl">“${g.clue}”</em><u class="st">확인</u>`:`<em class="cl">아직 확인되지 않았다</em>`}</div></div>`;
  });
  const n=gotCount();
  return `<div class="bd"><svg viewBox="0 0 1600 900">${svg}</svg>`+cards+
    `<div class="bcen"><i class="pin"></i><div class="pic"><div class="art"></div></div><span class="hwc">4471번 AI</span></div>`+
    `<div class="btl"><span>수사 노트</span><b>${n===6?'✓ 여섯 가지, 모두 확인':n+' / 6'}</b></div><div class="bnote">이 여섯 가지가 확인되기 전에는, 누구도 체포하지 않는다.</div><div class="bhint">▼</div></div>`;
}
async function playBoard(box,slow){
  mountArt(box.querySelector('.bcen .art'),'ai');
  const bt=box.querySelector('.btl'),cen=box.querySelector('.bcen'),hint=box.querySelector('.bhint'),ok=box.querySelector('.btl b');
  const gap=FAST?10:(slow?650:130);
  await sleep(slow?300:60);bt.classList.add('show');box.querySelector('.bnote').classList.add('show');await sleep(slow?900:80);
  cen.classList.add('show');await sleep(slow?700:140);
  for(let i=0;i<6;i++){
    box.querySelector(`path.bs[data-i="${i}"]`).classList.add('show');await sleep(slow?400:gap/2);
    box.querySelector(`.bcw[data-i="${i}"]`).classList.add('show');await sleep(gap);
  }
  ok.classList.add('show');
  if(!slow)hint.classList.add('show');
}

      w.opened=true;$('#rows').innerHTML='';$('#log').innerHTML='';$('#ch').innerHTML='';busy=true;await sleep(FAST?10:650);
      for(let i=0;i<w.rows.length;i++){if(cur!==w)break;$('#rows').insertAdjacentHTML('beforeend',lineHTML({k:'row',r:i}));await sleep(FAST?5:110)}
      const H='접속했습니다. 돋보기로 훑으면서, 어색한 줄을 눌러 보세요.';w.log.push({k:'a',who:'요원',t:H});await typeLine(w,'요원',H);await sleep(FAST?10:350);
      busy=false;if(cur===w)renderChoices(true);
    }else{$('#rows').innerHTML=w.rows.map((r,i)=>lineHTML({k:'row',r:i})).join('');renderLog(w);renderChoices()}
    return;
  }
  if(!w.opened){
    w.opened=true;$('#log').innerHTML='';$('#ch').innerHTML='';busy=true;
    await sleep(FAST?10:500);busy=false;
    if(cur===w)renderChoices(true);
  }else{renderLog(w);renderChoices()}
}
function closePanel(){
  cur=null;$('#panel').classList.remove('on');$('#code').classList.remove('on');lensOff();
  const sc=$('#scene');sc.style.transform='';sc.classList.remove('zoom','hasfocus');
  document.querySelectorAll('.who').forEach(e=>e.classList.remove('sel','hov'));
}

/* 돋보기: 기록 창 위에서 커서가 돋보기가 된다. 어색한 줄 위에 올리면 로봇의 표정이 바뀐다 */
function lensOff(){$('#lens').classList.remove('on','hot');const t=$('#w-terminal');if(t)t.classList.remove('uneasy');document.querySelectorAll('#rows .mag').forEach(x=>x.classList.remove('mag'))}
function lensCheck(row){
  document.querySelectorAll('#rows .mag').forEach(x=>{if(x!==row)x.classList.remove('mag')});
  if(row)row.classList.add('mag');
  $('#lens').classList.toggle('on',!!row);$('#lens').classList.toggle('hot',!!row);const t=$('#w-terminal');if(t)t.classList.toggle('uneasy',!!row);
}
$('#code').addEventListener('mousemove',e=>{
  if(!cur||cur.mode!=='log')return;
  const row=e.target.closest('#rows .ln.row.go');
  if(row){const st=$('#stage').getBoundingClientRect(),k=st.width/1600;$('#lens').style.transform=`translate(${(e.clientX-st.left)/k}px,${(e.clientY-st.top)/k}px)`}
  lensCheck(row);
});
$('#code').addEventListener('mouseleave',()=>lensOff());
let busy=false;
async function ask(i){
  const w=cur,t=w.topics[i];if(busy||w.done.has(t.id))return;
  busy=true;
  logAdd(w,{k:'q',t:t.label});
  $('#ch').innerHTML='';                       /* 대답하는 동안 선택지는 숨김 */
  await sleep(500);
  w.log.push({k:'a',who:w.name,t:t.say});      /* 기록에는 전체 문장 */
  await typeLine(w,w.name,t.say);
  w.done.add(t.id);setCond(t.cond,w.name,t.clue);finMark(w);
  logAdd(w,{k:'sys',t:'단서 확보 · '+COND[t.cond].k});
  if(t.conv)for(const c of t.conv){if(cur!==w)break;await sleep(FAST?10:650);w.log.push({k:'a',who:c.who,t:c.t});await typeLine(w,c.who,c.t);}
  if(t.note){await sleep(500);w.log.push({k:'a',who:'요원',t:t.note});await typeLine(w,'요원',t.note);await sleep(400)}
  if(gotCount()===6&&cur===w){
    const L='좋습니다. 증거가 모두 모인 것 같군요.';w.log.push({k:'a',who:'요원',t:L});
    await sleep(700);await typeLine(w,'요원',L);await sleep(500);
    busy=false;renderChoices(true);return;
  }
  busy=false;
  if(cur===w)renderChoices();
}

/* ================= 자막 (인트로 · 결말) · 클릭으로 진행 ================= */
let capHandler=null;
function typeSetup(el,html){
  el.innerHTML=html+'<span class="nx2" style="visibility:hidden">▼</span>';
  const sp=[];
  const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);const ns=[];while(w.nextNode())ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment();[...n.nodeValue].forEach(ch=>{const s=document.createElement('span');s.textContent=ch;s.style.visibility='hidden';f.appendChild(s);sp.push(s)});n.parentNode.replaceChild(f,n)});
  return sp;
}
function caption(who,text,opt){
  opt=opt||{};
  return new Promise(res=>{
    $('#cap').classList.add('on');$('#capn').textContent=who;$('#capx').classList.remove('on');
    const el=$('#capt');const sp=typeSetup(el,text);
    let k=0,done=false,tm;
    const fin=()=>{done=true;clearTimeout(tm);sp.forEach(x=>x.style.visibility='visible');const n=el.querySelector('.nx2');if(n)n.style.visibility='visible'};
    const step=()=>{if(done)return;if(k<sp.length)sp[k++].style.visibility='visible';if(k>=sp.length){fin();return}tm=setTimeout(step,FAST?2:38)};
    step();
    const go=()=>{if(!done){fin();return}capHandler=null;res()};
    capHandler=go;
  });
}
function capHide(){$('#cap').classList.remove('on');capHandler=null}

/* ================= 결론: 마인드맵 ================= */
let ending=false;
const MM={0:[330,110],1:[330,305],2:[330,500],3:[1270,110],4:[1270,305],5:[1270,500]};

async function verdict(g){

  $('#aag').classList.add('in');await sleep(1300);
  await caption('요원','4471번 AI. 체포합니다.');

  await sleep(1800);
  await caption('요원','본 AI는 책임이 가려질 때까지 기본값으로 유죄이며, 우리는 그 책임을 끝까지 묻습니다.');
  await caption('요원','체포만으로는 책임을 졌다고 볼 수 없죠.');
  await caption('요원','책임을 감당할 수 있겠습니까, 4471번 AI?');
  capHide();
  post({gbd:'part2-next'});
}
$('#yes').onclick=()=>verdict('yes');$('#no').onclick=()=>verdict('no');
