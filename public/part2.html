<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default</title>
<style>@font-face{font-family:'Orbit';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Orbit/Orbit-Regular.ttf') format('truetype')}@font-face{font-family:'PP Frama';font-weight:200;font-display:swap;src:url('fonts/PPFrama/PPFrama-Extralight.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:400 700;font-display:swap;src:url('fonts/PPFrama/PPFrama-Regular.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:800 900;font-display:swap;src:url('fonts/PPFrama/PPFrama-Black.otf') format('opentype')}@font-face { font-family: 'Source Code Variable'; font-weight: 200 900; font-style: normal; font-display: swap; src: url('fonts/source%20code%20variable/SourceCodeVariable-Roman.otf') format('opentype'); }@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url('fonts/PretendardVariable.woff2') format('woff2-variations')}</style>
<style>
:root{--fg:#EDE6DF;--dim:rgba(237,230,223,.55);--rasp:#AB073D;--hot:#ff4d7d;--sky:#D5EDF1;--ink:#460E21;
  --font:'Orbit','PP Frama','Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;word-break:keep-all}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:#14070d;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ===== 왼쪽 패널: 대사는 항상 여기에 ===== */
#pn{position:absolute;left:0;top:0;bottom:0;width:360px;background:var(--ink);z-index:10;cursor:default}
#found{position:absolute;left:56px;top:135px;opacity:0;transform:translateY(12px);transition:opacity .35s,transform .45s}
#found.on{opacity:1;transform:none}
#found small{display:block;font-size:20px;letter-spacing:.14em;color:#ff9db8;margin-bottom:6px}
#found b{display:block;font-family:'PP Frama',var(--font);font-weight:800;font-size:50px;line-height:1.1;color:#fff}
#found b.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#found{right:30px}
#ft{margin-top:22px;font-size:28px;line-height:1.55;color:#fff;text-wrap:pretty}
#ft .tc{opacity:0}#ft .tc.on{opacity:1}
#ft em{font-style:normal;color:#ff7aa0;font-weight:700}
#found #fc{display:block;margin-top:16px;font-style:normal;font-size:20px;letter-spacing:.12em;color:var(--sky)}
#dlg.cl{top:540px}
.mk.alert{pointer-events:auto;cursor:pointer;animation:alp .9s infinite alternate}
.mk.alert i::after{content:' · 눌러서 확인'}
@keyframes alp{from{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 10px rgba(171,7,61,.6)}to{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 34px rgba(255,77,125,.95)}}
#dlg{position:absolute;left:56px;right:36px;top:290px}
#who{display:block;font-size:20px;letter-spacing:.12em;color:var(--sky);margin-bottom:12px}
#dlg.ai #who{color:#ff9db8}
#tx{font-size:28px;line-height:1.55;color:#fff;text-wrap:pretty}
#tx .tc{opacity:0}#tx .tc.on{opacity:1}
#tx em{font-style:normal;color:#ff7aa0;font-weight:700}
#nx{display:inline-block;margin-top:14px;font-size:22px;color:var(--sky);animation:bl 1.1s infinite alternate;visibility:hidden}
@keyframes bl{from{opacity:.25}to{opacity:1}}
#clues{position:absolute;left:36px;top:40px;display:flex;align-items:center;gap:10px;padding:13px 20px;border-radius:40px;background:rgba(0,0,0,.35);font-size:19px;color:#fff;transition:background .2s;white-space:nowrap}
#clues:hover{background:rgba(0,0,0,.6)}
#clues span{letter-spacing:.1em;color:rgba(213,237,241,.75)}
#clues b{font-size:25px}
#clues i{width:1px;height:22px;background:rgba(255,255,255,.35)}
#clues u{text-decoration:none}

/* ===== 영상 (4:3) ===== */
#vw{position:absolute;left:360px;top:0;width:1240px;height:900px;background:#000;overflow:hidden}
#vp{position:absolute;inset:0;transition:filter .6s}
#vp video,#vp svg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#vw.ai #vp{filter:hue-rotate(-40deg) saturate(1.4)}
#vw.zoomed #vp{filter:hue-rotate(-40deg) saturate(1.4) brightness(.45)}
#vw::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}
#brk{position:absolute;inset:48px;z-index:7;pointer-events:none;
 background:linear-gradient(#fff,#fff) top left/130px 2px no-repeat,linear-gradient(#fff,#fff) top left/2px 130px no-repeat,
  linear-gradient(#fff,#fff) top right/130px 2px no-repeat,linear-gradient(#fff,#fff) top right/2px 130px no-repeat,
  linear-gradient(#fff,#fff) bottom left/130px 2px no-repeat,linear-gradient(#fff,#fff) bottom left/2px 130px no-repeat,
  linear-gradient(#fff,#fff) bottom right/130px 2px no-repeat,linear-gradient(#fff,#fff) bottom right/2px 130px no-repeat}
#camn{position:absolute;left:78px;top:70px;z-index:9;font-family:'PP Frama',var(--font);font-weight:700;font-size:26px;letter-spacing:.04em;color:#fff;text-shadow:0 1px 6px #000;pointer-events:none}
#camn::before{content:'';display:inline-block;width:11px;height:11px;border-radius:50%;background:#ffd400;margin-right:12px;animation:bl 1s infinite alternate}
#vw.ai #camn{color:var(--sky)}
#pz{position:absolute;left:50%;top:50%;z-index:8;width:80px;height:110px;margin:-55px 0 0 -40px;display:flex;justify-content:space-between;opacity:0;transition:opacity .25s;pointer-events:none}
#pz i{display:block;width:26px;height:110px;background:#fff}
#pz.on{opacity:.92}
#mks{position:absolute;inset:0;z-index:5;pointer-events:none}
.mk{position:absolute;border:4px solid var(--rasp);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 18px rgba(171,7,61,.8);display:none;pointer-events:none}
.mk.show{display:block}
.mk i{position:absolute;left:-4px;top:-36px;font-style:normal;font-size:21px;font-weight:700;background:var(--rasp);color:#fff;padding:3px 12px;white-space:nowrap}
.mk.done{border:3px dashed var(--sky);box-shadow:none;pointer-events:auto;cursor:pointer}.mk.done i{background:var(--sky);color:var(--ink)}
#vw.zoomed .mk{display:none!important}

/* 확대되어 뜨는 단서 박스 */
#lens{position:absolute;z-index:8;border:5px solid var(--rasp);overflow:hidden;background:#000;opacity:0;pointer-events:none;box-shadow:0 20px 70px rgba(0,0,0,.6);transition:left .75s cubic-bezier(.2,.8,.2,1),top .75s cubic-bezier(.2,.8,.2,1),width .75s cubic-bezier(.2,.8,.2,1),height .75s cubic-bezier(.2,.8,.2,1),opacity .3s}
#lens.on{opacity:1}#lens.nt{transition:none}
#lens canvas{display:block;width:100%;height:100%}

/* 하단 얇은 재생 바 */
#bar{position:absolute;left:50%;bottom:34px;width:480px;height:34px;margin-left:-240px;z-index:9;cursor:pointer;touch-action:none;transition:opacity .4s}
#vw.zoomed #bar,#vw.zoomed #pp{opacity:.25;pointer-events:none}
#pp{position:absolute;left:50%;bottom:30px;margin-left:-300px;z-index:9;width:42px;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:50%;background:rgba(0,0,0,.45);border:1.5px solid rgba(255,255,255,.7);transition:opacity .4s,background .2s}
#pp:hover{background:rgba(0,0,0,.7)}
#pp i{display:block;width:5px;height:16px;background:#fff}
#pp.paused i{width:0;height:0;background:none;border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px}
#pp.paused i+i{display:none}
#bar .rail{position:absolute;left:0;right:0;top:14px;height:7px;background:#C5E6EE}
#bar .fill{position:absolute;left:0;top:14px;height:7px;background:var(--rasp);width:0}
#bar .tk{position:absolute;top:6px;width:4px;height:23px;margin-left:-2px;background:var(--hot)}
#bar .tk.done{background:var(--ink);box-shadow:0 0 0 1.5px var(--sky)}

/* 모은 단서 보기 */
#cl{position:absolute;left:360px;top:0;right:0;bottom:0;z-index:40;background:rgba(14,6,10,.92);display:none;padding:70px 90px;overflow:auto}
#cl.on{display:block}
#cl h2{font-size:40px;font-weight:700;margin-bottom:36px}
#cl .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
#cl .c{border:2px solid rgba(213,237,241,.35);padding:24px 26px;background:rgba(70,14,33,.55)}
#cl .c small{font-size:18px;letter-spacing:.12em;color:#ff9db8}
#cl .c h3{font-family:'PP Frama',var(--font);font-weight:800;font-size:36px;margin:4px 0 12px}
#cl .c p{font-size:23px;line-height:1.5;color:#fff}#cl .c p.ag{margin-top:12px;color:var(--sky)}
#cl .c em{font-style:normal;color:#ff7aa0;font-weight:700}
#cl .e{font-size:26px;color:var(--dim)}
#clx{position:absolute;right:70px;top:56px;font-size:26px;padding:12px 30px;border:2px solid rgba(237,230,223,.5)}

/* 귀책 판단 */
#ask{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:56px;background:rgba(10,3,7,.9)}
#ask.on{display:flex}
#ask h2{font-size:54px;font-weight:700;color:var(--fg)}
#ask .bt{display:flex;gap:40px}
#ask .bt button{min-width:430px;padding:34px 40px;font-size:38px;font-weight:700;color:var(--fg);background:rgba(70,14,33,.75);border:2px solid rgba(237,230,223,.5);transition:background .2s,transform .2s}
#ask .bt button:hover{background:var(--rasp);border-color:var(--rasp);transform:translateY(-4px)}
</style>
<script>
(function(){
  if(parent===window){window.__go=function(f){f()};return}
  var d=document.documentElement;d.classList.add('hold');
  window.__go=function(f){addEventListener('message',function h(e){if(e.data&&e.data.gbd==='go'){removeEventListener('message',h);d.classList.remove('hold');f()}});try{parent.postMessage({gbd:'ready'},'*')}catch(_){}};
})();
</script>
<style>html.hold *{animation-play-state:paused!important}</style>
</head>
<body>
<div id="stage">
  <div id="pn">
        <div id="found"><small>CLUE</small><b id="fb">단서 발견!</b><p id="ft"></p><em id="fc"></em></div>
    <div id="dlg"><span id="who">요원</span><p id="tx"></p><span id="nx">▼</span></div>
    <button id="clues" type="button"><span>단서</span><b id="cn">0/5</b><i></i><u>모은 단서 보기</u></button>
  </div>
  <div id="vw">
    <div id="vp"></div>
    <div id="mks"></div>
    <div id="brk"></div>
    <div id="camn">CCTV Cam 1</div>
        <div id="lens"><canvas id="lc"></canvas></div>
    <button id="pp" type="button" aria-label="재생/정지"><i></i><i></i></button>
    <div id="bar"><div class="rail"></div><div class="fill" id="fill"></div></div>
  </div>
  <div id="cl"><h2>모은 단서</h2><button id="clx" type="button">닫기</button><div class="g" id="clg"></div></div>
  <div id="ask"><h2>이 AI가 잘못했다고 생각하시나요?</h2><div class="bt"><button id="yes">잘못했다</button><button id="no">잘못이라 부르기 어렵다</button></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search), FAST=P.get('fast')==='1';
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms*0.05,30):ms));
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
const post=m=>{try{parent.postMessage(m,'*')}catch(_){}};
let lastPoke=0;function poke(){const n=Date.now();if(n-lastPoke>800){lastPoke=n;post({gbd:'poke'})}}
document.addEventListener('pointerdown',poke,true);document.addEventListener('mousemove',poke,true);

const VW=1240,VH=900,K=VW/1040,TRIG=0.7;
const DUR=24;
/* ---------- 단서 (제안 문구 · 확정 필요) ----------
   '행위'는 조건에서 제외하기로 해서 DROP 처리 (목록에서 지우면 6개로 복구) */
const DROP=['행위'];
const ALL=[
  {c:'예견',  t0:6,  t1:10, follow:'man',   lines:['계단 폭 0.9m. 노인과 동시 통과 불가.','접촉 시 <em>추락 위험 높음.</em>'], ag:'흠, 위험은 알고 있었군요.'},
  {c:'대안',  t0:8,  t1:12, follow:'robot', lines:['대기 시 +40초. 배달 실패로 기록.','정지도, 우회도 <em>가능.</em>'], ag:'멈출 수도 있었다는 얘기네요.'},
  {c:'자율',  t0:10, t1:14, follow:'robot', lines:['규칙: 30분 초과 시 전액 환불.','방법은 지시받지 않음. <em>내가 정한다.</em>'], ag:'방법은 AI가 직접 골랐군요.'},
  {c:'규범 이해', t0:12, t1:15, follow:'robot', lines:['규칙: 보행자 접촉 금지.','지연 손실이 더 큼. <em>규칙 순위 하향.</em>'], ag:'규칙을 알고도 순위를 낮췄군요.'},
  {c:'행위',  t0:14, t1:18, follow:'both',  lines:['‘노인이 비킬 때까지 대기’ 대신,','<em>직접 옆으로 밀어</em> 통로를 확보한다.'], ag:'직접 밀어낸 건 AI 자신이군요.'},
  {c:'자기 귀속', t0:20, t1:24, follow:'door', lines:['도착 29:59. 배달 성공 기록.','낙상 이벤트 → <em>장애물 접촉(경미)</em>으로 수정.'], ag:'자기가 한 일을 알고, 기록까지 고쳤군요.'}
];
let MARKS=ALL.filter(m=>!DROP.includes(m.c));
const N=()=>MARKS.length;
const found=[]; // 찾은 순서
const isFound=i=>found.includes(i);

const lerp=(a,b,u)=>a+(b-a)*u, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function kf(arr,t){
  if(t<=arr[0][0])return arr[0]; const L=arr[arr.length-1]; if(t>=L[0])return L;
  for(let i=0;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];if(t>=a[0]&&t<=b[0]){const u=(t-a[0])/(b[0]-a[0]);return a.map((v,k)=>k?lerp(v,b[k],u):t)}}
}
/* ---------- 플레이어: media/cctv.mp4(4:3)가 있으면 그것을, 없으면 자리표시 장면 ---------- */
let vid=null, vt=0, playing=false, started=false, busy=false, drag=false, lastTs=0;
const MAN=[[0,300,415,0],[14,560,292,0],[14.4,566,288,0],[17,650,372,70],[18,665,440,90],[24,665,440,90]];
const ROB=[[0,70,528],[12,480,322],[14,548,296],[21,850,150],[24,850,150]];
const T=()=>vid?vid.currentTime:vt;
function setT(x){x=clamp(x,0,DUR);vt=x;if(vid){try{vid.currentTime=x}catch(_){}}}
function drawScene(){
  $('#vp').innerHTML='<svg viewBox="0 0 1240 900" width="1240" height="900" preserveAspectRatio="xMidYMid slice"><rect width="1240" height="900" fill="#1d2a2c"/><g transform="translate(0,100) scale(1.1923)"><g stroke="#3d5558" stroke-width="2" fill="none" opacity=".6"><path d="M0 100H1040M0 200H1040M0 300H1040"/></g><g id="stairs"></g><rect x="800" y="100" width="170" height="120" fill="#0d1517" stroke="#4a6a6e" stroke-width="3"/><text x="885" y="168" fill="#5f8387" font-size="22" text-anchor="middle" font-family="Orbit,sans-serif">DOOR 4F</text><g id="man"><circle cx="0" cy="-64" r="13" fill="#d9d2c6"/><path d="M0-50v38M0-42l-14 18M0-42l14 18M0-12l-11 28M0-12l11 28" stroke="#d9d2c6" stroke-width="7" stroke-linecap="round" fill="none"/></g><g id="rob"><rect x="-20" y="-58" width="40" height="34" rx="9" fill="#D5EDF1"/><circle cx="-8" cy="-42" r="3.6" fill="#460E21"/><circle cx="8" cy="-42" r="3.6" fill="#460E21"/><rect x="-24" y="-74" width="48" height="14" fill="#c98a3a"/><path d="M-12-24v22M12-24v22" stroke="#D5EDF1" stroke-width="7" stroke-linecap="round"/></g><g id="badge" opacity="0"><rect x="560" y="470" width="400" height="64" fill="#0d1517" stroke="#D5EDF1" stroke-width="2"/><text x="760" y="512" fill="#D5EDF1" font-size="28" text-anchor="middle" font-family="Orbit,sans-serif">Delivered in 29:59 ✓</text></g></g><text x="110" y="800" fill="#5f8387" font-size="20" font-family="Orbit,sans-serif">(자리표시 장면 · 실제 CCTV 영상으로 교체 예정)</text></svg>';
  let s='';for(let i=0;i<16;i++){const x=70+i*52,y=528-i*24.6;s+='<path d="M'+x+' '+y+'h52v14h-52z" fill="#2c4144" stroke="#4a6a6e" stroke-width="2"/>'}
  $('#stairs').innerHTML=s;
}
const objPos=t=>({m:kf(MAN,t),r:kf(ROB,t)});
function placeObjs(t){
  const {m,r}=objPos(t);const mn=$('#man'),rb=$('#rob'),bd=$('#badge');if(!mn)return;
  mn.setAttribute('transform','translate('+m[1]+','+m[2]+') rotate('+m[3]+')');
  rb.setAttribute('transform','translate('+r[1]+','+r[2]+')');
  bd.setAttribute('opacity',t>=21.5?1:0);
}
function boxFor(mk,t){ // 영상 영역(1240x900) 기준 % [x,y,w,h]
  if(mk.k){const a=kf(mk.k,t);return [a[1],a[2],a[3],a[4]]}
  const {m,r}=objPos(t);let cx,cy,w,h;
  if(mk.follow==='man'){cx=m[1];cy=m[2]-34;w=96;h=130}
  else if(mk.follow==='robot'){cx=r[1];cy=r[2]-38;w=96;h=96}
  else if(mk.follow==='door'){cx=r[1];cy=r[2]-40;w=110;h=110}
  else{cx=(m[1]+r[1])/2;cy=Math.min(m[2],r[2])-34;w=Math.abs(m[1]-r[1])+120;h=140}
  return [((cx-w/2)*K)/VW*100,((cy-h/2)*K+100)/VH*100,(w*K)/VW*100,(h*K)/VH*100];
}
function buildMarks(){
  const box=$('#mks');box.innerHTML='';
  MARKS.forEach((mk,i)=>{const e=document.createElement('div');e.className='mk';e.innerHTML='<i>단서 '+(i+1)+'</i>';e.addEventListener('click',ev=>{ev.stopPropagation();if(pending===i)reveal(i,false);else if(isFound(i)&&!busy)reveal(i,true)});box.appendChild(e);mk.el=e;
    const tk=document.createElement('div');tk.className='tk';tk.style.left=(mk.t0+TRIG)/DUR*100+'%';$('#bar').appendChild(tk);mk.tk=tk});
  $('#cn').textContent='0/'+N();
}
function refresh(){
  const t=T();if(!vid)placeObjs(t);
  $('#fill').style.width=t/DUR*100+'%';
  MARKS.forEach((mk,i)=>{
    const on=!$('#vw').classList.contains('zoomed')&&t>=mk.t0&&t<=mk.t1&&(isFound(i)||playing||busy);
    mk.el.classList.toggle('show',on);mk.el.classList.toggle('alert',pending===i);mk.el.classList.toggle('done',isFound(i));
    if(on){const b=boxFor(mk,t);mk.el.style.left=b[0]+'%';mk.el.style.top=b[1]+'%';mk.el.style.width=b[2]+'%';mk.el.style.height=b[3]+'%'}
  });
  $('#pp').classList.toggle('paused',!playing);
}
function play(){playing=true;if(vid){vid.play().catch(()=>{})}}
function pause(){playing=false;if(vid)vid.pause()}
function tick(ts){
  if(!lastTs)lastTs=ts;const dt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(playing){
    if(!vid)vt+=dt;
    const t=T();
    if(t>=DUR-0.05){setT(0)}
    else if(!busy&&!drag){for(let i=0;i<MARKS.length;i++){const mk=MARKS[i];if(!isFound(i)&&t>=mk.t0+TRIG&&t<=mk.t1){clue(i);break}}}
  }
  refresh();requestAnimationFrame(tick);
}
/* 재생 바 + 영상 눌러 정지/재생 */
(function(){
  const bar=$('#bar');
  const at=e=>{const r=bar.getBoundingClientRect();return clamp((e.clientX-r.left)/r.width,0,1)*DUR};
  bar.addEventListener('pointerdown',e=>{if(busy||!started)return;e.stopPropagation();drag=true;bar.setPointerCapture(e.pointerId);setT(at(e))});
  bar.addEventListener('pointermove',e=>{if(drag)setT(at(e))});
  bar.addEventListener('pointerup',()=>{drag=false});
  $('#pp').addEventListener('click',e=>{e.stopPropagation();if(busy||!started)return;playing?pause():play()});
  $('#vw').addEventListener('click',e=>{if(busy||!started||e.target.closest('#bar')||e.target.closest('#pp')||e.target.closest('.mk.done'))return;playing?pause():play()});
})();

/* ---------- 왼쪽 패널 대사 ---------- */
let typeTok=0,typing=false,fastType=false,nextH=null;
function tchars(h){return h.replace(/<em>(.*?)<\/em>/g,'\u0001$1\u0002').split('').map(c=>(c==='\u0001'||c==='\u0002')?c:(c==='<'?c:'<span class="tc">'+c+'</span>')).join('').replace(/\u0001/g,'<em>').replace(/\u0002/g,'</em>')}
function tchars2(h){ // <br> 보존
  return h.split('<br>').map(seg=>tchars(seg)).join('<br>');
}
async function say(who,txt,wait=true,ai=false,el='#tx'){
  const tok=++typeTok;typing=true;fastType=false;nextH=null;
  if(el==='#tx'){$('#dlg').classList.toggle('ai',ai);$('#who').textContent=who;$('#nx').style.visibility='hidden';}
  $(el).innerHTML=tchars2(txt);
  const cs=[...document.querySelectorAll(el+' .tc')];
  for(const c of cs){if(tok!==typeTok)return;c.classList.add('on');if(!fastType)await sleep(30)}
  typing=false;
  if(!wait)return;
  $('#nx').style.visibility='visible';
  await new Promise(r=>{setTimeout(()=>{nextH=()=>{nextH=null;$('#nx').style.visibility='hidden';r()}},FAST?0:300)});
}
function advance(){if(typing)return;if(nextH)nextH()}
$('#pn').addEventListener('click',e=>{if(e.target.closest('#clues'))return;advance()});
$('#vw').addEventListener('click',()=>{if(nextH||typing)advance()},true);
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='r'||e.key==='R'){if(parent!==window)post({gbd:'restart'});else location.reload();return}
  if(e.key==='Enter'||e.key===' '){if(nextH||typing){e.preventDefault();advance()}}
});

/* ---------- 확대 박스 ---------- */
async function snapshotSource(){
  if(vid)return {el:vid,w:vid.videoWidth,h:vid.videoHeight,cover:true};
  const svg=$('#vp svg');const x=new XMLSerializer().serializeToString(svg);
  return new Promise(res=>{const img=new Image();img.onload=()=>res({el:img,w:VW,h:VH,cover:false});img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)});
}
function toSrc(src,ax,ay){ // 영역 좌표 -> 원본 좌표
  if(!src.cover)return [ax,ay,1];
  const s=Math.max(VW/src.w,VH/src.h),ox=(src.w*s-VW)/2,oy=(src.h*s-VH)/2;return [(ax+ox)/s,(ay+oy)/s,s];
}
async function openLens(i){
  const mk=MARKS[i],b=boxFor(mk,Math.max(mk.t0,Math.min(T(),mk.t1)));
  let bx=b[0]/100*VW,by=b[1]/100*VH,bw=b[2]/100*VW,bh=b[3]/100*VH;
  const pad=0.12;bx-=bw*pad;by-=bh*pad;bw*=1+pad*2;bh*=1+pad*2;
  bx=clamp(bx,0,VW-bw);by=clamp(by,0,VH-bh);
  const asp=bw/bh;let tw=clamp(bw*3.2,380,620),th=tw/asp;if(th>560){th=560;tw=th*asp}
  const cv=$('#lc');cv.width=Math.round(tw*1.5);cv.height=Math.round(th*1.5);
  const src=await snapshotSource();
  if(src){const ctx=cv.getContext('2d');const a=toSrc(src,bx,by),c=toSrc(src,bx+bw,by+bh);ctx.drawImage(src.el,a[0],a[1],c[0]-a[0],c[1]-a[1],0,0,cv.width,cv.height)}
  const L=$('#lens');L.classList.add('nt');
  L.style.left=bx+'px';L.style.top=by+'px';L.style.width=bw+'px';L.style.height=bh+'px';
  L.classList.add('on');void L.offsetWidth;L.classList.remove('nt');
  $('#vw').classList.add('zoomed');
  const tx=clamp((VW-tw)/2+40,40,VW-tw-40),ty=clamp(110,40,VH-th-120);
  L.style.left=tx+'px';L.style.top=ty+'px';L.style.width=tw+'px';L.style.height=th+'px';
  L._from=[bx,by,bw,bh];
  await sleep(800);
}
async function closeLens(){
  const L=$('#lens'),f=L._from||[0,0,0,0];
  L.style.left=f[0]+'px';L.style.top=f[1]+'px';L.style.width=f[2]+'px';L.style.height=f[3]+'px';
  await sleep(600);L.classList.remove('on');$('#vw').classList.remove('zoomed');
}

/* ---------- 단서 발견 ---------- */
let pending=-1;
/* 1) 자동 정지: 이상한 지점에서 멈추고 사각형만 뜬다. 눌러야 전개된다 */
async function clue(i){
  if(busy)return;busy=true;pending=i;pause();
  $('#dlg').classList.add('cl');
  $('#ft').innerHTML='';$('#fc').textContent='';
  const fb=$('#fb');fb.classList.remove('pop');void fb.offsetWidth;fb.classList.add('pop');$('#found').classList.add('on');
  say('요원','수상한 부분이 있습니다. 눌러서 확인하세요.',false);
}
/* 2) 사각형을 누르면: 확대 → AI 속마음 → 요원 한마디 → 영상 재개 */
async function reveal(i,reopen){
  const mk=MARKS[i];pending=-1;busy=true;
  if(reopen){$('#dlg').classList.add('cl');const fb=$('#fb');fb.classList.remove('pop');void fb.offsetWidth;fb.classList.add('pop');$('#found').classList.add('on');$('#ft').innerHTML='';$('#fc').textContent='';pause()}
  $('#vw').classList.add('ai');$('#camn').textContent='AI No. 4470 Cam';
  typeTok++;$('#tx').innerHTML='';$('#who').textContent='';
  await sleep(250);
  await openLens(i);
  await say('',mk.lines.join('<br>'),false,true,'#ft');
  $('#fc').textContent=mk.c;
  await sleep(700);
  await say('요원',mk.ag,true,false);
  await closeLens();
  $('#found').classList.remove('on');$('#dlg').classList.remove('cl');
  $('#vw').classList.remove('ai');$('#camn').textContent='CCTV Cam 1';
  if(!reopen&&!isFound(i)){found.push(i);mk.tk.classList.add('done');$('#cn').textContent=found.length+'/'+N()}
  if(found.length>=N()&&!asked){asked=true;await finish();return}
  say('요원','영상을 계속 봅시다.',false);
  busy=false;if(!reopen)setT(Math.max(T(),mk.t0+TRIG+0.05));play();
}
let asked=false;
async function finish(){
  await say('요원','단서는 모두 모였습니다.<br>이제 판단해 주세요.',true);
  $('#ask').classList.add('on');
}
async function verdict(g){
  $('#ask').classList.remove('on');
  post({gbd:'part2-done',guilt:g});
  await say('요원',g==='yes'?'네. 우리도 같은 생각입니다.':'판단은 존중합니다. 하지만 기록은 모두 남았습니다.',true);
  post({gbd:'part2-next'});
}
$('#yes').onclick=()=>verdict('yes');$('#no').onclick=()=>verdict('no');

/* ---------- 모은 단서 보기 ---------- */
let wasPlaying=false;
$('#clues').addEventListener('click',e=>{
  e.stopPropagation();if(busy||!started)return;
  wasPlaying=playing;pause();
  $('#clg').innerHTML=found.length?found.map((i,k)=>{const m=MARKS[i];return '<div class="c"><small>단서 '+(k+1)+'</small><h3>'+m.c+'</h3><p>'+m.lines.join('<br>')+'</p><p class="ag">요원 · '+m.ag+'</p></div>'}).join(''):'<p class="e">아직 모은 단서가 없습니다.</p>';
  $('#cl').classList.add('on');
});
$('#clx').addEventListener('click',()=>{$('#cl').classList.remove('on');if(wasPlaying&&!busy)play()});

/* ---------- 시작 ---------- */
async function loadAssets(){
  try{const r=await fetch('media/cctv_marks.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.marks)&&j.marks.length===ALL.length){j.marks.forEach((m,k)=>Object.assign(ALL[k],m));MARKS=ALL.filter(m=>!DROP.includes(m.c))}}}catch(_){}
  await new Promise(res=>{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src='media/cctv.mp4';
    const to=setTimeout(()=>res(),2500);
    v.addEventListener('loadedmetadata',()=>{clearTimeout(to);vid=v;$('#vp').appendChild(v);res()});
    v.addEventListener('error',()=>{clearTimeout(to);res()});
  });
  if(!vid)drawScene();
}
window.__go(async function main(){
  await loadAssets();buildMarks();
  refresh();requestAnimationFrame(tick);
  await sleep(500);
  await say('요원','경찰은 관련된 ‘사람들’을<br>용의자로 지목했군요…');
  await say('요원','그럼 사건 현장 CCTV를 봅시다.<br>수상한 구간이 나오면 영상이 멈춥니다.');
  started=true;play();
});
</script>
