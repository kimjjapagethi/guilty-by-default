<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default · 옆 화면</title>
<link rel="stylesheet" href="ds.css">
<style>
:root { --bg:var(--burgundy-dark); --ink:var(--ivory); --muted:color-mix(in srgb, var(--ivory) 66%, var(--burgundy-dark)); --line:color-mix(in srgb, var(--ivory) 20%, var(--burgundy-dark)); --pink:var(--paleblue); --green:var(--paleblue); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; word-break: keep-all; }
.screen { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 4vmin; gap: 3vmin; }
.top { display: flex; justify-content: space-between; align-items: baseline; font-size: 2.2vmin; color: var(--muted); }
.top b { color: var(--ink); font-size: 2.8vmin; font-family: var(--font-display); }
.stage { position: relative; display: grid; align-content: center; }
.line { font-family: var(--font-display); font-size: 6vmin; font-weight: 700; line-height: 1.35; text-align: center; opacity: 0; transition: opacity 1.2s; }
.line.on { opacity: 1; }
.chart { display: none; } .chart.on { display: block; }
.cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3vmin; }
.pn { border: .3vmin solid var(--line); border-radius: 2.4vmin; padding: 2.6vmin 2.4vmin; display: grid; gap: 1.2vmin; align-content: start; }
.pn h3 { margin: 0; font-size: 3.4vmin; font-family: var(--font-display); } .pn h3 small { font-size: 2vmin; color: var(--muted); font-weight: 400; margin-left: 1vmin; }
.br { display: grid; grid-template-columns: 5vmin 1fr 6vmin; grid-template-rows: auto auto; column-gap: 1.2vmin; align-items: center; }
.br .id { font-size: 1.9vmin; color: var(--pink); font-weight: 700; letter-spacing: .06em; grid-row: 1 / 3; }
.br .nm { font-size: 2.1vmin; line-height: 1.25; } .br b { font-size: 2.6vmin; font-variant-numeric: tabular-nums; text-align: right; grid-row: 1 / 3; }
.br .trk { height: 1.4vmin; background: var(--line); border-radius: 1vmin; overflow: hidden; margin-top: .5vmin; }
.br .trk i { display: block; height: 100%; width: 0; background: var(--green); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
.pn .ch { font-size: 2vmin; color: var(--muted); line-height: 1.5; border-top: .2vmin solid var(--line); padding-top: 1.2vmin; } .pn .ch b { color: var(--ink); font-size: 2.3vmin; margin-right: 1.4vmin; }
.pn .wait { color: var(--muted); font-size: 2.2vmin; padding: 3vmin 0; }
.cap { text-align: center; color: var(--muted); font-size: 2.3vmin; margin-top: 2.4vmin; }
.who { display: flex; justify-content: center; gap: 4vmin; margin-top: 3vmin; font-size: 2.4vmin; color: var(--muted); }
.who b { color: var(--ink); font-size: 3.4vmin; }
.flash { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 2.6vmin; color: var(--pink); opacity: 0; transition: opacity .6s; }
.flash.on { opacity: 1; }
.pulse .trk i { animation: pulse 1.6s ease; }
@keyframes pulse { 0%,100% { filter: none; } 40% { filter: brightness(1.8) drop-shadow(0 0 1.4vmin var(--green)); } }
.bottom { display: flex; justify-content: space-between; font-size: 2vmin; color: var(--muted); }
.live { color: var(--pink); }
@media (prefers-reduced-motion: reduce) { .br .trk i, .line { transition: none; } .pulse .trk i { animation: none; } }
</style></head>
<body><div class="screen">
  <div class="top"><b>Guilty by Default</b><span id="count"></span></div>
  <div class="stage">
    <div class="flash" id="flash"></div>
    <div class="line" id="line"></div>
    <div class="chart" id="chart">
      <div class="cols3" id="cols"></div>
      <div class="cap">인물별로, 관람객이 도달한 엔딩과 선택의 비율</div>
    </div>
    <div class="who" id="who"></div>
  </div>
  <div class="bottom"><span id="liveTxt" class="live">&nbsp;</span><span>전시 관람객의 응답 모음입니다. 사람들 전체의 생각을 대표하지 않습니다.</span></div>
</div>
<script>
(function () {
  'use strict';
  var LINES = ['“결함도 지시도 없었는데 사람이 죽었습니다.”', '당신은 누구를 위해 책임을 물었습니까?'];
  var STEPTXT = { title: '누군가 첫 화면에서 시작을 기다립니다', p0: '누군가 사고 장면을 보고 있습니다', sel: '누군가 인물을 고르고 있습니다', p1: '누군가 자기 자리에서 사건을 마주합니다', c1: '누군가 CHOICE 01 앞에 섰습니다', p3: '누군가 첫 선택의 결과를 보고 있습니다', p4: '누군가 또 한 번 사건과 마주칩니다', c2: '누군가 CHOICE 02 앞에 섰습니다', end: '누군가 엔딩을 보고 있습니다' };
  var CHS = [], END = {}, st = null, mode = 'idle', li = 0;
  var lineEl = document.getElementById('line'), chart = document.getElementById('chart');
  function pct(v) { return Math.round((v || 0) * 100); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function showLine() { lineEl.classList.remove('on'); setTimeout(function () { lineEl.textContent = LINES[li % LINES.length]; li++; lineEl.classList.add('on'); }, 1300); }
  function drawWho() { var b = (st && st.byChar) || [0, 0, 0]; document.getElementById('who').innerHTML = CHS.map(function (c, i) { return '<span>' + esc(c.name) + ' <b>' + (b[i] || 0) + '</b></span>'; }).join(''); }
  function drawChart() {
    var cols = document.getElementById('cols');
    if (!st || !st.ready || !CHS.length) { chart.classList.remove('on'); return false; }
    if (!cols.children.length) cols.innerHTML = CHS.map(function () { return '<div class="pn"></div>'; }).join('');
    CHS.forEach(function (c, i) {
      var p = cols.children[i], d = st.chEnding && st.chEnding[i], n = st.byChar[i];
      if (!d) { p.innerHTML = '<h3>' + esc(c.name) + '<small>' + (c.role ? esc(c.role) + ' · ' : '') + n + '명</small></h3><div class="wait">' + st.minChar + '명 이상 모이면 비율을 보여 드립니다</div>'; return; }
      if (!p.querySelector('.br')) p.innerHTML = '<h3></h3>' + c.endings.map(function (e) { return '<div class="br"><span class="id">' + esc(e.id) + '</span><span class="nm">' + esc(e.name) + '</span><b></b><div class="trk"><i></i></div></div>'; }).join('') + '<div class="ch" data-k="c1"></div><div class="ch" data-k="c2"></div>';
      p.querySelector('h3').innerHTML = esc(c.name) + '<small>' + (c.role ? esc(c.role) + ' · ' : '') + n + '명</small>';
      Array.prototype.forEach.call(p.querySelectorAll('.br'), function (r, k) { r.querySelector('b').textContent = pct(d[k]) + '%'; r.querySelector('i').style.width = pct(d[k]) + '%'; });
      ['c1', 'c2'].forEach(function (key, q) { p.querySelector('[data-k=' + key + ']').innerHTML = (q ? '선택 2' : '선택 1') + '<br>' + st[key][i].map(function (v, k) { return '<b>' + (k + 1) + '번 ' + pct(v) + '%</b>'; }).join(''); });
    });
    return true;
  }
  function setStats(s) {
    st = s; drawWho(); document.getElementById('count').textContent = s.n ? s.n + '명이 해 보았습니다' : '첫 번째 관람객을 기다립니다';
    mode = drawChart() ? 'chart' : 'idle';
    if (mode === 'chart') { lineEl.classList.remove('on'); chart.classList.add('on'); } else { chart.classList.remove('on'); if (!lineEl.classList.contains('on')) showLine(); }
  }
  setInterval(function () {
    if (mode === 'idle') showLine();
    else if (chart.classList.contains('on')) { chart.classList.remove('on'); showLine(); setTimeout(function () { if (mode === 'chart') { lineEl.classList.remove('on'); chart.classList.add('on'); } }, 6500); }
  }, 16000);
  var flashT, liveT;
  function flash(t) { var f = document.getElementById('flash'); f.textContent = t; f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(function () { f.classList.remove('on'); }, 5000); }
  function live(t) { var e = document.getElementById('liveTxt'); e.textContent = t || ' '; clearTimeout(liveT); if (t) liveT = setTimeout(function () { e.innerHTML = '&nbsp;'; }, 20000); }
  function connect() {
    var es = new EventSource('/api/stream');
    es.onmessage = function (ev) {
      var m = JSON.parse(ev.data);
      if (m.type === 'stats') setStats(m.stats);
      else if (m.type === 'progress') { if (STEPTXT[m.step]) live('● ' + STEPTXT[m.step]); }
      else if (m.type === 'play') {
        setStats(m.stats); live('');
        if (!m.test) {
          flash('방금 ' + (CHS[m.ch] ? CHS[m.ch].name : '') + '의 자리에서 ‘' + (END[m.ending] || '') + '’에 도달했습니다');
          if (mode === 'chart') { chart.classList.add('on'); lineEl.classList.remove('on'); chart.classList.remove('pulse'); void chart.offsetWidth; chart.classList.add('pulse'); }
        }
      }
    };
    es.onerror = function () { es.close(); setTimeout(connect, 3000); };
  }
  /* 인물·엔딩 이름은 게임 스크립트에서 가져온다 (편집기로 고치면 여기도 바뀜) */
  fetch('script.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return fetch('script.default.json').then(function (r) { return r.json(); }); })
    .then(function (j) { CHS = j.chars; CHS.forEach(function (c) { c.endings.forEach(function (e) { END[e.id] = e.name; }); }); drawWho(); if (st) setStats(st); }).catch(function () {});
  drawWho(); connect(); showLine();
})();
</script></body></html>
