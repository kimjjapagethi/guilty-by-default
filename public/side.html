<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default · 옆 화면</title>
<link rel="stylesheet" href="ds.css">
<style>
:root { --bg:var(--burgundy-dark); --ink:var(--ivory); --muted:color-mix(in srgb, var(--ivory) 66%, var(--burgundy-dark)); --line:color-mix(in srgb, var(--ivory) 20%, var(--burgundy-dark)); --pink:var(--paleblue); --green:var(--paleblue); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; word-break: keep-all; }
.screen { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 4vmin; gap: 3vmin; }
.top { display: flex; justify-content: space-between; align-items: baseline; font-size: 2.2vmin; color: var(--muted); }
.top b { color: var(--ink); font-size: 2.8vmin; font-family: var(--font-display); }
.stage { position: relative; display: grid; align-content: center; }
.line { font-family: var(--font-display); font-size: 6.4vmin; font-weight: 700; line-height: 1.35; text-align: center; opacity: 0; transition: opacity 1.2s; }
.line.on { opacity: 1; }
.line em { font-style: normal; color: var(--pink); }
.map { display: grid; gap: 1.6vmin; margin: 0 auto; width: min(100%, 120vmin); }
.map .m { display: grid; grid-template-columns: 5vmin 1fr; gap: 2vmin; align-items: center; font-size: 3vmin; color: var(--muted); transition: color .5s, transform .5s; }
.map .m i { font-style: normal; font-family: var(--font-display); font-weight: 800; width: 5vmin; height: 5vmin; border-radius: 50%; border: .3vmin solid var(--line); display: grid; place-items: center; font-size: 2.6vmin; }
.map .m.on { color: var(--ink); transform: translateX(1vmin); } .map .m.on i { background: var(--pink); color: var(--bg); border-color: var(--pink); }
.map .m.done { color: var(--ink); opacity: .75; }
.chart { display: none; }
.chart.on { display: block; }
.cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.4vmin; align-items: end; height: 60vmin; }
.col { display: grid; align-items: end; justify-items: center; height: 100%; gap: 1vmin; grid-template-rows: 1fr auto auto; }
.col .bar { width: 100%; background: var(--green); border-radius: 1vmin 1vmin 0 0; min-height: .6vmin; transition: height 1.2s cubic-bezier(.2,.8,.2,1); align-self: end; }
.col .v { font-size: 3vmin; font-weight: 800; font-variant-numeric: tabular-nums; }
.col .l { font-size: 2.2vmin; color: var(--muted); }
.cap { text-align: center; color: var(--muted); font-size: 2.3vmin; margin-top: 2.4vmin; }
.sub { display: flex; justify-content: center; gap: 4vmin; margin-top: 3vmin; font-size: 2.4vmin; color: var(--muted); flex-wrap: wrap; }
.sub b { color: var(--ink); font-size: 3.2vmin; }
.flash { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 2.6vmin; color: var(--pink); opacity: 0; transition: opacity .6s; }
.flash.on { opacity: 1; }
.pulse .bar { animation: pulse 1.6s ease; }
@keyframes pulse { 0%,100% { filter: none; } 40% { filter: brightness(1.8) drop-shadow(0 0 2vmin var(--green)); } }
.bottom { display: flex; justify-content: space-between; font-size: 2vmin; color: var(--muted); }
.live { color: var(--pink); }
@media (prefers-reduced-motion: reduce) { .col .bar, .line { transition: none; } .pulse .bar { animation: none; } }
</style></head>
<body><div class="screen">
  <div class="top"><b>Guilty by Default</b><span id="count"></span></div>
  <div class="stage">
    <div class="flash" id="flash"></div>
    <div class="line" id="line"></div>
    <div class="map" id="map"></div>
    <div class="chart" id="chart">
      <div class="cols" id="cols"></div>
      <div class="cap">관람객 중 해당 선택을 한 사람의 비율</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="bottom"><span id="liveTxt" class="live">&nbsp;</span><span>전시 관람객의 응답 모음입니다. 사람들 전체의 생각을 대표하지 않습니다.</span></div>
</div>
<script>
(function () {
  'use strict';
  var LINES = ['“그래도 AI잖아.”', '맡긴 만큼, 책임질 곳이 필요하다.', '이 세계에서 사람은 한 명.', '잘못했나요? 감당했나요?', '어떤 벌이면 치른 걸까요?'];
  var ARG = ['맡기는 일이 늘어, 모두 AI가 된다', '사고가 나면 책임질 사람이 없다', '귀책 · 잘못을 탓할 수 있는가', '책임을 졌는가', '지금의 AI는 처벌의 조건을 갖췄는가', '당신과 닮은 생각을 한 철학자', 'AI가 어떤 존재가 될 것인가'];
  var STEP2ARG = { startvid: 0, ch1: 0, n1: 0, n1a: 0, n1a1: 0, n1a2: 0, n1a3: 0, n1b: 0, n1c: 0, n1d: 0, n1e: 0, q1: 0, q1r: 0, n3: 1, n3b: 1, n4p: 1, n4q: 1, n4a: 1, n4b: 1, n4c: 1, n4d: 1, c5: 1, n6a: 1, n6b: 1, n6c: 1, n7a: 1, n7b: 1, n7c: 1, n7d: 1, n7e: 1,  ch2: 2, part2: 2, ch3: 3, part3: 3, part4: 4, ch4: 5, result: 5, close: 6 };
  var LAB = ['편하다', '잘못했다', '감당했다', '어떤 벌로도 못 감당'], st = null, mode = 'idle', li = 0, cur = -1;
  var lineEl = document.getElementById('line'), chart = document.getElementById('chart'), mapEl = document.getElementById('map');
  var STEPTXT = { start: '누군가 시작했습니다', ch1: '누군가 황금 시대에 들어섰습니다', n1: '누군가 도구의 역사를 보고 있습니다', n1a: '누군가 도구의 역사를 보고 있습니다', n1a1: '누군가 도구의 역사를 보고 있습니다', n1a2: '누군가 도구의 역사를 보고 있습니다', n1a3: '누군가 도구의 역사를 보고 있습니다', n1b: '누군가 도구의 역사를 보고 있습니다', n1c: '누군가 도구의 역사를 보고 있습니다', n1d: '누군가 도구의 역사를 보고 있습니다', n1e: '누군가 도구의 역사를 보고 있습니다', q1: '누군가 이 세계가 어떻게 느껴지는지 고르고 있습니다', n3: '누군가 사고의 이야기를 듣고 있습니다', n3b: '누군가 사고의 이야기를 듣고 있습니다', q1r: '누군가 이 세계가 어떻게 느껴지는지 고르고 있습니다', n4p: '누군가 사고의 경위를 듣고 있습니다', n4q: '누군가 사고의 경위를 듣고 있습니다', n4a: '누군가 사고의 순간을 보고 있습니다', n4b: '누군가 사고의 순간을 보고 있습니다', n4c: '누군가 사고의 순간을 보고 있습니다', n4d: '누군가 사고의 순간을 보고 있습니다', c5: '누군가 책임을 어디에 물을지 고르고 있습니다', n6a: '누군가 책임의 공백을 보고 있습니다', n6b: '누군가 책임의 공백을 보고 있습니다', n6c: '누군가 책임의 공백을 보고 있습니다', n7a: '누군가 책임의 공백을 보고 있습니다', n7b: '누군가 책임의 공백을 보고 있습니다', n7c: '누군가 책임의 공백을 보고 있습니다', n7d: '누군가 책임의 공백을 보고 있습니다', n7e: '누군가 책임의 공백을 보고 있습니다', ch2: '누군가 2장으로 넘어갑니다', part2: '누군가 AI에게 책임을 묻고 있습니다', ch3: '누군가 3장으로 넘어갑니다', part3: '누군가 AI를 어떻게 처벌할지 고르고 있습니다', ch4: '누군가 4장으로 넘어갑니다', result: '누군가 자신과 닮은 철학자를 만나고 있습니다', part4: '누군가 지금의 AI가 그 처벌을 받아들일 수 있는지 살펴보고 있습니다', close: '누군가 마지막 이야기를 듣고 있습니다' };
  var KIND = { OO: '책임 주체로 본다', OX: '잘못은 했지만 책임은 못 진다', XO: '책임은 지지만 잘못은 아니다', XX: '도구로 본다' };
  function pct(v) { return Math.round((v || 0) * 100); }
  function drawMap() { mapEl.innerHTML = ARG.map(function (t, k) { return '<div class="m' + (k === cur ? ' on' : (k < cur ? ' done' : '')) + '"><i>' + (k + 1) + '</i><span>' + t + '</span></div>'; }).join(''); }
  function showLine() {
    lineEl.classList.remove('on');
    setTimeout(function () { lineEl.innerHTML = LINES[li % LINES.length]; li++; lineEl.classList.add('on'); }, 1300);
  }
  function drawChart() {
    var cols = document.getElementById('cols');
    if (!st || !st.ready) { chart.classList.remove('on'); return false; }
    if (!cols.children.length) cols.innerHTML = LAB.map(function () { return '<div class="col"><div class="bar" style="height:0"></div><div class="v"></div><div class="l"></div></div>'; }).join('');
    [st.feelEase, st.guiltYes, st.burdenYes, (st.method ? st.method.none : 0)].forEach(function (v, k) {
      var c = cols.children[k]; c.querySelector('.bar').style.height = (pct(v) * 0.85) + '%'; c.querySelector('.v').textContent = pct(v) + '%'; c.querySelector('.l').textContent = LAB[k];
    });
    document.getElementById('sub').innerHTML = ['OO', 'OX', 'XO', 'XX'].map(function (t) { return '<span>' + KIND[t] + ' <b>' + pct(st.types[t]) + '%</b></span>'; }).join('');
    return true;
  }
  function setStats(s) {
    st = s; document.getElementById('count').textContent = s.n ? s.n + '명이 해 보았습니다' : '첫 번째 관람객을 기다립니다';
    mode = drawChart() ? 'chart' : 'idle';
    if (mode === 'chart') { lineEl.classList.remove('on'); mapEl.style.display = 'none'; chart.classList.add('on'); }
    else { chart.classList.remove('on'); mapEl.style.display = ''; if (!lineEl.classList.contains('on')) showLine(); }
  }
  drawMap();
  setInterval(function () {
    if (mode === 'idle') showLine();
    else if (mode === 'chart') {
      if (chart.classList.contains('on')) { chart.classList.remove('on'); showLine(); setTimeout(function () { if (mode === 'chart') { lineEl.classList.remove('on'); chart.classList.add('on'); } }, 6500); }
    }
  }, 16000);
  var flashT, liveT;
  function flash(t) { var f = document.getElementById('flash'); f.textContent = t; f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(function () { f.classList.remove('on'); }, 5000); }
  function live(t) { var e = document.getElementById('liveTxt'); e.textContent = t || ' '; clearTimeout(liveT); if (t) liveT = setTimeout(function () { e.innerHTML = '&nbsp;'; }, 20000); }
  function connect() {
    var es = new EventSource('/api/stream');
    es.onmessage = function (ev) {
      var m = JSON.parse(ev.data);
      if (m.type === 'stats') setStats(m.stats);
      else if (m.type === 'progress') {
        if (STEPTXT[m.step]) live('● ' + STEPTXT[m.step]);
        if (m.step in STEP2ARG) { cur = STEP2ARG[m.step]; drawMap(); } else if (m.step === 'start') { cur = -1; drawMap(); }
      }
      else if (m.type === 'play') {
        setStats(m.stats); live(''); cur = -1; drawMap();
        if (!m.test) {
          flash('방금 한 명이 ‘' + KIND[m.kind] + '’ 쪽에서, 처벌은 ‘' + (m.method ? String(m.method).split('+').map(function (x) { return { retr: '응보', det: '억제', corr: '교정', none: '어떤 방식으로도 감당하지 못한다' }[x] || x; }).join('·') : '—') + '’를 골랐습니다');
          if (mode === 'chart') { chart.classList.add('on'); lineEl.classList.remove('on'); chart.classList.remove('pulse'); void chart.offsetWidth; chart.classList.add('pulse'); }
        }
      }
    };
    es.onerror = function () { es.close(); setTimeout(connect, 3000); };
  }
  connect(); showLine();
})();
</script></body></html>
