<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guilty by Default · 옆 화면</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>
:root { --bg:#07090e; --ink:#e8ecf4; --muted:#8f99ab; --line:#232b3b; --pink:#ff7aa6; --green:#3fd6a6; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif; overflow: hidden; word-break: keep-all; }
.screen { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 4vmin; gap: 3vmin; }
.top { display: flex; justify-content: space-between; align-items: baseline; font-size: 2.2vmin; color: var(--muted); }
.top b { color: var(--ink); font-size: 2.6vmin; }
.stage { position: relative; display: grid; align-content: center; }
.line { font-size: 6.4vmin; font-weight: 800; line-height: 1.35; text-align: center; opacity: 0; transition: opacity 1.2s; }
.line.on { opacity: 1; }
.line em { font-style: normal; color: var(--pink); }
.chart { display: none; }
.chart.on { display: block; }
.cols { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2.4vmin; align-items: end; height: 60vmin; }
.col { display: grid; align-items: end; justify-items: center; height: 100%; gap: 1vmin; grid-template-rows: 1fr auto auto; }
.col .bar { width: 100%; background: var(--green); border-radius: 1vmin 1vmin 0 0; min-height: .6vmin; transition: height 1.2s cubic-bezier(.2,.8,.2,1); align-self: end; }
.col .v { font-size: 3vmin; font-weight: 800; font-variant-numeric: tabular-nums; }
.col .l { font-size: 2.2vmin; color: var(--muted); }
.cap { text-align: center; color: var(--muted); font-size: 2.3vmin; margin-top: 2.4vmin; }
.sub { display: flex; justify-content: center; gap: 4vmin; margin-top: 3vmin; font-size: 2.4vmin; color: var(--muted); flex-wrap: wrap; }
.sub b { color: var(--ink); font-size: 3.2vmin; }
.flash { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-size: 2.6vmin; color: var(--pink); opacity: 0; transition: opacity .6s; }
.flash.on { opacity: 1; }
.pulse .bar { animation: pulse 1.6s ease; }
@keyframes pulse { 0%,100% { filter: none; } 40% { filter: brightness(1.8) drop-shadow(0 0 2vmin var(--green)); } }
.bottom { display: flex; justify-content: space-between; font-size: 2vmin; color: var(--muted); }
.live { color: var(--pink); }
@media (prefers-reduced-motion: reduce) { .col .bar, .line { transition: none; } .pulse .bar { animation: none; } }
</style></head>
<body><div class="screen">
  <div class="top"><b>Guilty by Default</b><span id="count"></span></div>
  <div class="stage">
    <div class="flash" id="flash"></div>
    <div class="line" id="line"></div>
    <div class="chart" id="chart">
      <div class="cols" id="cols"></div>
      <div class="cap">칸마다 ‘제재한다’를 고른 사람의 비율</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="bottom"><span id="liveTxt" class="live">&nbsp;</span><span>전시 관람객의 응답 모음입니다. 사람들 전체의 생각을 대표하지 않습니다.</span></div>
</div>
<script>
(function () {
  'use strict';
  var LINES = ['“폐기하면 되잖아.”', '“그래도 돼지잖아.”', '같은 사고. 다른 이름.', '같은 사고인데, <em>어디서</em> 답이 바뀌었나요?', '<em>제재</em>할까요?'];
  var LAB = ['수레', '1칸', '2칸', '3칸', '4칸'], st = null, mode = 'idle', li = 0, lineEl = document.getElementById('line'), chart = document.getElementById('chart');
  var STEPTXT = { start: '누군가 시작했습니다', s0: '누군가 수레 앞에 서 있습니다', history: '누군가 이야기를 읽고 있습니다', s1: '누군가 1칸 앞에서 고민합니다', s2: '누군가 2칸 앞에서 고민합니다', s3: '누군가 3칸 앞에서 고민합니다', s4: '누군가 4칸 앞에서 고민합니다' };
  function pct(v) { return Math.round(v * 100); }
  function showLine() {
    lineEl.classList.remove('on');
    setTimeout(function () { lineEl.innerHTML = LINES[li % LINES.length]; li++; lineEl.classList.add('on'); }, 1300);
  }
  function drawChart() {
    var cols = document.getElementById('cols');
    if (!st || !st.ready) { chart.classList.remove('on'); return false; }
    if (!cols.children.length) cols.innerHTML = LAB.map(function () { return '<div class="col"><div class="bar" style="height:0"></div><div class="v"></div><div class="l"></div></div>'; }).join('');
    st.sanction.forEach(function (v, k) {
      var c = cols.children[k]; c.querySelector('.bar').style.height = (pct(v) * 0.85) + '%'; c.querySelector('.v').textContent = pct(v) + '%'; c.querySelector('.l').textContent = LAB[k];
    });
    document.getElementById('sub').innerHTML = '<span>답이 바뀐 사람 <b>' + pct(1 - st.flip.none) + '%</b></span><span>돼지와 AI에 다른 답 <b>' + pct(st.aiDiffers) + '%</b></span><span>끝까지 맡긴 사람 <b>' + pct(st.lever[2]) + '%</b></span>';
    return true;
  }
  function setStats(s) {
    st = s; document.getElementById('count').textContent = s.n ? s.n + '명이 해 보았습니다' : '첫 번째 관람객을 기다립니다';
    mode = drawChart() ? 'chart' : 'idle';
    if (mode === 'chart') { lineEl.classList.remove('on'); chart.classList.add('on'); }
    else { chart.classList.remove('on'); if (!lineEl.classList.contains('on')) showLine(); }
  }
  setInterval(function () {
    if (mode === 'idle') showLine();
    else if (mode === 'chart') { /* 차트와 문구를 번갈아 */
      if (chart.classList.contains('on')) { chart.classList.remove('on'); showLine(); setTimeout(function () { if (mode === 'chart') { lineEl.classList.remove('on'); chart.classList.add('on'); } }, 6500); }
    }
  }, 16000);
  var flashT, liveT;
  function flash(t) { var f = document.getElementById('flash'); f.textContent = t; f.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(function () { f.classList.remove('on'); }, 5000); }
  function live(t) { var e = document.getElementById('liveTxt'); e.textContent = t || ' '; clearTimeout(liveT); if (t) liveT = setTimeout(function () { e.innerHTML = '&nbsp;'; }, 20000); }
  function connect() {
    var es = new EventSource('/api/stream');
    es.onmessage = function (ev) {
      var m = JSON.parse(ev.data);
      if (m.type === 'stats') setStats(m.stats);
      else if (m.type === 'progress') { if (STEPTXT[m.step]) live('● ' + STEPTXT[m.step]); }
      else if (m.type === 'play') {
        setStats(m.stats); live('');
        if (!m.test) {
          flash(m.flip ? '방금 한 명이 ' + m.flip + '칸에서 답을 바꿨습니다' : '방금 한 명이 끝까지 같은 답을 했습니다');
          if (mode === 'chart') { chart.classList.add('on'); lineEl.classList.remove('on'); chart.classList.remove('pulse'); void chart.offsetWidth; chart.classList.add('pulse'); }
        }
      }
    };
    es.onerror = function () { es.close(); setTimeout(connect, 3000); };
  }
  connect(); showLine();
})();
</script></body></html>
