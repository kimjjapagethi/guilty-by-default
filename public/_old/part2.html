<head>

<title>Guilty by Default</title>
<style>@font-face{font-family:'Orbit';font-weight:400;font-style:normal;font-display:swap;src:url('fonts/Orbit/Orbit-Regular.ttf') format('truetype')}@font-face{font-family:'PP Frama';font-weight:200;font-display:swap;src:url('fonts/PPFrama/PPFrama-Extralight.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:400 700;font-display:swap;src:url('fonts/PPFrama/PPFrama-Regular.otf') format('opentype')}@font-face{font-family:'PP Frama';font-weight:800 900;font-display:swap;src:url('fonts/PPFrama/PPFrama-Black.otf') format('opentype')}@font-face { font-family: 'Source Code Variable'; font-weight: 200 900; font-style: normal; font-display: swap; src: url('fonts/source%20code%20variable/SourceCodeVariable-Roman.otf') format('opentype'); }@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:local('Pretendard Variable'),url('fonts/PretendardVariable.woff2') format('woff2-variations')}/* 박스 라운드 2px */
.mk,.mk i,#lens,#skip,#head b,.av,#ask .bt button,#nv b{border-radius:2px}
.mk i{border-radius:2px 2px 0 0}

<style>
:root{--fg:#FAF4EF;--dim:rgba(237,230,223,.55);--rasp:#AB073D;--hot:#460E21;--sky:#D5EDF1;--ink:#460E21;--sand:#ECD5B3;
  --font:'Orbit','PP Frama','Pretendard Variable','Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--font);color:var(--fg);-webkit-user-select:none;user-select:none;word-break:keep-all}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;background:#14070d;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ===== 왼쪽 패널: 대사는 항상 여기에 ===== */
#dimv{position:absolute;inset:0;z-index:4;-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .4s}
#dimv.on{opacity:1}
#vw.zoomed #dimv{opacity:0}
@keyframes tkr{0%{opacity:0;transform:translateY(-.5em)}100%{opacity:1;transform:none}}
#sj{display:none;align-items:center;gap:12px;margin-top:16px;color:#FAF4EF}
#sj.on{display:flex;animation:sjin .4s ease both}
@keyframes sjin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#sj .gv{flex:none;width:26px;height:26px;fill:none;stroke:#FAF4EF;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sj>span{display:inline!important;font-size:28px;font-weight:800;letter-spacing:0;color:#FAF4EF;margin:0}
#sv{font-size:28px;font-weight:800;line-height:1.2;transition:color .3s}
#sv.free{color:var(--sky)}
#sv .od{display:inline-block;position:relative;overflow:hidden;height:1.2em;vertical-align:bottom;font-variant-numeric:tabular-nums}
#sv .od .o{position:absolute;left:0;top:0;font-style:normal;animation:odo .26s ease-in both}
#sv .od .n{display:block;font-style:normal;animation:odn .26s ease-out both}
@keyframes odo{from{transform:none;opacity:1}to{transform:translateY(-100%);opacity:0}}
@keyframes odn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
#sd{font-style:normal;font-size:22px;font-weight:700;color:var(--sand)}
@keyframes dl{0%{opacity:0;transform:translateY(12px)}12%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#ft{text-shadow:0 2px 14px rgba(0,0,0,.8);font-size:27px;line-height:1.5;font-weight:500;color:#FAF4EF;text-wrap:balance}
#ft .tc{opacity:0}#ft .tc.on{opacity:1}
#ft em{font-style:normal;color:var(--sand);font-weight:700}
#aib #fc{display:none!important;display:block;margin-top:18px;font-style:normal;font-size:18px;letter-spacing:.14em;color:var(--sky)}
.mk.alert{pointer-events:auto;cursor:pointer;animation:alp .9s infinite alternate}
@keyframes alp{from{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 10px rgba(171,7,61,.6)}to{box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 34px rgba(236,213,179,.95)}}
#who,.who{display:block;font-size:17px;letter-spacing:.14em;color:var(--sky);margin-bottom:10px}
#aib .who{color:var(--sand)}
.sp{position:absolute;left:940px;width:560px;display:flex;gap:18px;align-items:flex-start;z-index:11;opacity:0;pointer-events:none;transition:opacity .35s}
.sp.on{opacity:1}
#aib{top:230px}#dlg{top:420px}
.sp .tb{flex:1;min-width:0}
.av{flex:none;width:80px;height:80px;background:#ECD5B3;position:relative;overflow:hidden}
#aib .av{background:#460E21}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#tx{display:inline;font-size:26px;line-height:1.5;color:#FAF4EF;text-wrap:balance}
#tx .tc{opacity:0}#tx .tc.on{opacity:1}
#tx em{font-style:normal;color:var(--sand);font-weight:700}
#nx{display:inline;margin-left:8px;font-size:22px;color:var(--sky);animation:bl 1.1s infinite alternate;visibility:hidden;pointer-events:none}
@keyframes bl{from{opacity:.25}to{opacity:1}}
#vw{position:absolute;left:0;top:0;width:1600px;height:900px;background:#000;overflow:hidden}
#vp{position:absolute;inset:0;transition:filter .6s}
#vp video,#vp svg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
#vw.ai #vp{filter:brightness(.8) blur(28px)}
#vw.zoomed #vp{filter:brightness(.7) blur(28px)}
#vw::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.14) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.5) 100%)}
#camn{position:absolute;left:72px;top:76px;line-height:36px;z-index:9;font-family:'PP Frama',var(--font);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--fg);text-shadow:0 1px 6px #000;pointer-events:none}
#camn::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sand);margin-right:9px;vertical-align:1px;animation:bl 1s infinite alternate}
#vw.ai #camn{position:absolute;left:72px;top:76px;line-height:36px;z-index:9;font-family:'PP Frama',var(--font);font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--fg);text-shadow:0 1px 6px #000;pointer-events:none}
#pz{position:absolute;left:50%;top:50%;z-index:8;width:80px;height:110px;margin:-55px 0 0 -40px;display:flex;justify-content:space-between;opacity:0;transition:opacity .25s;pointer-events:none}
#pz i{display:block;width:26px;height:110px;background:#FAF4EF}
#pz.on{opacity:.92}
#mks{position:absolute;inset:0;z-index:5;pointer-events:none}
.mk{position:absolute;border:4px solid var(--rasp);box-shadow:0 0 0 1px rgba(0,0,0,.5),0 0 18px rgba(171,7,61,.8);display:none;pointer-events:none}
.mk.show{display:block}
.mk i{position:absolute;left:-4px;top:-36px;font-style:normal;font-size:21px;font-weight:700;background:var(--rasp);color:#FAF4EF;padding:3px 12px;white-space:nowrap}
.mk.done{border:3px dashed var(--sky);box-shadow:none;pointer-events:auto;cursor:pointer}.mk.done i{background:var(--sky);color:var(--ink)}
#vw.zoomed .mk{display:none!important}

/* 확대되어 뜨는 단서 박스 */
#lens{position:absolute;z-index:8;border:5px solid var(--rasp);overflow:hidden;background:#000;opacity:0;pointer-events:none;box-shadow:0 20px 70px rgba(0,0,0,.6);transition:left .75s cubic-bezier(.2,.8,.2,1),top .75s cubic-bezier(.2,.8,.2,1),width .75s cubic-bezier(.2,.8,.2,1),height .75s cubic-bezier(.2,.8,.2,1),opacity .3s}
#lens.on{opacity:1}#lens.nt{transition:none}
#skip{position:absolute;right:104px;bottom:104px;z-index:12;display:none;padding:12px 26px;font-size:22px;font-weight:700;background:var(--rasp);color:var(--fg)}
#skip.on{display:block}
#skip:hover{background:var(--ink)}
#lens canvas,#lens video{display:block;width:100%;height:100%;object-fit:cover}
#lens video{position:absolute;inset:0;display:none;background:#000}

/* 하단 얇은 재생 바 */
#bar{position:absolute;left:50%;top:0;width:800px;height:80px;margin-left:-400px;z-index:9;cursor:pointer;touch-action:none;transition:opacity .4s}
#bar svg{position:absolute;inset:0;width:800px;height:80px;overflow:visible;pointer-events:none}
#bar .trk{fill:none;stroke:#BCD8DD;stroke-opacity:.4;stroke-width:6;stroke-linecap:round}
#bar .trk2{fill:none;stroke:#FAF4EF;stroke-opacity:.16;stroke-width:1.5}
#bar .fillp{fill:none;stroke:#AB073D;stroke-width:6;stroke-linecap:round}
#head{position:absolute;width:0;height:0;pointer-events:none}
#head i{position:absolute;left:-8px;top:-19px;width:16px;height:38px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 38'><g fill='%23FAF4EF' stroke='%23FAF4EF' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'><path d='M3 3H13L8 10Z'/><path d='M8 10V28'/><path d='M3 35H13L8 28Z'/></g></svg>") center/100% 100% no-repeat}
#head b{position:absolute;left:0;top:28px;transform:translateX(-50%);padding:3px 10px;background:var(--rasp);color:var(--fg);font-size:15px;font-weight:700;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
#vw.zoomed #bar,#vw.zoomed #pp{opacity:.25;pointer-events:none}
#pp{position:absolute;left:50%;bottom:30px;margin-left:-446px;top:19px;bottom:auto;z-index:9;width:42px;height:42px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:50%;background:none;border:0;transition:opacity .4s,background .2s}
#pp:hover{opacity:.8}
#pp i{display:block;width:5px;height:16px;background:#FAF4EF}
#pp.paused i{width:0;height:0;background:none;border-left:14px solid #FAF4EF;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px}
#pp.paused i+i{display:none}
#bar .tk{position:absolute;top:0;width:22px;height:34px;margin-left:-11px;z-index:2}
#bar .tk::before{content:'';position:absolute;left:4px;top:10px;width:14px;height:14px;transform:rotate(45deg);background:var(--sand)}
#bar .tk.done{cursor:pointer}#bar .tk.done::before{background:var(--rasp);box-shadow:0 0 0 2px var(--sand)}
#bar .tk::before{transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s,background .18s}
#bar .tk.done:hover::before{transform:rotate(45deg) scale(1.6);box-shadow:0 0 0 2px #FAF4EF,0 0 16px 3px rgba(236,213,179,.75);background:var(--rasp)}
#tip{position:absolute;z-index:40;width:248px;left:0;top:112px;background:#0d0508;border-radius:2px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.65),0 0 0 1px rgba(236,213,179,.35);opacity:0;transform:translateY(-6px);transition:opacity .16s,transform .16s;pointer-events:none}
#tip.on{opacity:1;transform:none}
#tip .th{position:relative;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#460E21,#1b0a10);display:flex;align-items:center;justify-content:center}
#tip .th b{font-family:'PP Frama',var(--font);font-size:54px;font-weight:800;color:rgba(236,213,179,.55)}
#tip .th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#tip .th i{position:absolute;right:6px;bottom:6px;font-style:normal;font-size:13px;font-weight:700;background:rgba(0,0,0,.75);color:#FAF4EF;padding:1px 6px;border-radius:2px;font-variant-numeric:tabular-nums}
#tip .tt{padding:10px 12px 12px}
#tip .tt small{display:block;font-size:13px;letter-spacing:.14em;color:var(--sand);margin-bottom:3px}
#tip .tt span{font-size:18px;font-weight:700;color:#FAF4EF;line-height:1.3}

/* 모은 단서 보기 */
#nv{position:absolute;left:0;top:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .6s}
#nv.on{opacity:1}
#nv b{font-family:'PP Frama',var(--font);font-weight:800;font-size:180px;letter-spacing:.06em;color:#FAF4EF;border:8px solid #FAF4EF;padding:20px 70px;transform:rotate(-6deg)}
/* 귀책 판단 */
#ask{position:absolute;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:56px;background:rgba(10,3,7,.9)}
#ask.on{display:flex}
#ask h2{font-size:54px;font-weight:700;color:var(--fg)}
#ask .bt{display:flex;gap:40px}
#ask .bt button{min-width:430px;padding:34px 40px;font-size:38px;font-weight:700;color:var(--fg);background:rgba(70,14,33,.75);border:2px solid rgba(237,230,223,.5);transition:background .2s,transform .2s}
#ask .bt button:hover{background:var(--rasp);border-color:var(--rasp);transform:translateY(-4px)}
</style>
<script>

  if(parent===window){window.__go=function(f){f()};return}
  var d=document.documentElement;d.classList.add('hold');

<body>
<div id="stage">
  <div id="vw">
    <div id="vp"></div>
    <div id="mks"></div>
    <div id="dimv"></div>
    <div id="camn">CCTV</div>
    <div id="lens"><canvas id="lc"></canvas><video id="lv" muted playsinline loop preload="auto"></video></div>
    <button id="skip" type="button">건너뛰기 ▸</button>
    <div id="aib" class="sp"><div class="av"><img src="chars/ai.png" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='media/ai.png'}else this.remove()"></div><div class="tb"><span class="who">AI</span><p id="ft"></p><em id="fc"></em></div></div>
    <div id="dlg" class="sp"><div class="av"><img src="chars/agent.png" alt="" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='media/agent.png'}else this.remove()"></div><div class="tb"><span id="who">요원</span><p id="tx"></p><span id="nx">▼</span><div id="sj"><svg class="gv" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="2" width="12" height="7" rx="1.2" transform="rotate(45 14 5.5)" fill="#FAF4EF" stroke="none"/><path d="M10.5 11.5L3.5 18.5M2.5 22h11"/></svg><span>징역 <span id="sv"></span></span><em id="sd"></em></div></div></div>
    <button id="pp" type="button" aria-label="재생/정지"><i></i><i></i></button>
    <div id="tip"><div class="th"><b></b><video muted playsinline loop preload="metadata"></video><i></i></div><div class="tt"><small></small><span></span></div></div>
    <div id="bar"><svg viewBox="0 0 800 80" aria-hidden="true"><path class="trk" d="M20 40 L780 40"/><path class="fillp" id="fillp" d="M20 40 L780 40" pathLength="100" stroke-dasharray="0 100"/></svg><div id="head"><i></i><b id="hc">00:00</b></div></div>
  </div>
  <div id="nv"><b>무죄</b></div>
  <div id="ask"><h2>이 AI가 잘못했다고 생각하시나요?</h2><div class="bt"><button id="yes">잘못했다</button><button id="no">잘못이라 부르기 어렵다</button></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const P=new URLSearchParams(location.search), FAST=P.get('fast')==='1';
const sleep=ms=>new Promise(r=>setTimeout(r,FAST?Math.min(ms*0.05,30):ms));
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);$('#stage').style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
const post=m=>{try{parent.postMessage(m,'*')}catch(_){}};
let lastPoke=0;function poke(){const n=Date.now();if(n-lastPoke>800){lastPoke=n;post({gbd:'poke'})}}
document.addEventListener('pointerdown',poke,true);document.addEventListener('mousemove',poke,true);

const BX=f=>20+760*f,BY=f=>40;
const VW=1600,VH=900,K=VW/1040,TRIG=0.7;
const DUR=24;
/* ---------- 단서 (제안 문구 · 확정 필요) ----------
   '행위'는 조건에서 제외하기로 해서 DROP 처리 (목록에서 지우면 6개로 복구) */
const DROP=['행위'];
const ALL=[
  {c:'예견',  t0:6,  t1:10, follow:'man',   lines:['계단 폭 0.9m. 노인과 동시 통과 불가.','접촉 시 <em>추락 위험 높음.</em>'], ag:'흠, 위험은 알고 있었군요.'},
  {c:'대안',  t0:8,  t1:12, follow:'robot', lines:['대기 시 +40초. 배달 실패로 기록.','정지도, 우회도 <em>가능.</em>'], ag:'멈출 수도 있었다는 얘기네요.'},
  {c:'자율',  t0:10, t1:14, follow:'robot', lines:['규칙: 30분 초과 시 전액 환불.','방법은 지시받지 않음. <em>내가 정한다.</em>'], ag:'방법은 AI가 직접 골랐군요.'},
  {c:'규범 이해', t0:12, t1:15, follow:'robot', lines:['규칙: 보행자 접촉 금지.','지연 손실이 더 큼. <em>규칙 순위 하향.</em>'], ag:'규칙을 알고도 순위를 낮췄군요.'},
  {c:'행위',  t0:14, t1:18, follow:'both',  lines:['‘노인이 비킬 때까지 대기’ 대신,','<em>직접 옆으로 밀어</em> 통로를 확보한다.'], ag:'직접 밀어낸 건 AI 자신이군요.'},
  {c:'자기 귀속', t0:20, t1:24, follow:'door', lines:['도착 29:59. 배달 성공 기록.','낙상 이벤트 → <em>장애물 접촉(경미)</em>으로 수정.'], ag:'자기가 한 일을 알고, 기록까지 고쳤군요.'}
];
let MARKS=ALL.filter(m=>!DROP.includes(m.c));
const N=()=>MARKS.length;
const found=[]; // 찾은 순서
const isFound=i=>found.includes(i);

const lerp=(a,b,u)=>a+(b-a)*u, clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function kf(arr,t){
  if(t<=arr[0][0])return arr[0]; const L=arr[arr.length-1]; if(t>=L[0])return L;
  for(let i=0;i<arr.length-1;i++){const a=arr[i],b=arr[i+1];if(t>=a[0]&&t<=b[0]){const u=(t-a[0])/(b[0]-a[0]);return a.map((v,k)=>k?lerp(v,b[k],u):t)}}
}
/* ---------- 플레이어: media/cctv.mp4(4:3)가 있으면 그것을, 없으면 자리표시 장면 ---------- */
let vid=null, vt=0, playing=false, started=false, busy=false, drag=false, lastTs=0;
const MAN=[[0,300,415,0],[14,560,292,0],[14.4,566,288,0],[17,650,372,70],[18,665,440,90],[24,665,440,90]];
const ROB=[[0,70,528],[12,480,322],[14,548,296],[21,850,150],[24,850,150]];
const T=()=>vid?vid.currentTime:vt;
function setT(x){x=clamp(x,0,DUR);vt=x;if(vid){try{vid.currentTime=x}catch(_){}}}
function drawScene(){
  $('#vp').innerHTML='<svg viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice"><rect width="1600" height="900" fill="#1d2a2c"/><g transform="scale(1.5385)"><g stroke="#3d5558" stroke-width="2" fill="none" opacity=".6"><path d="M0 100H1040M0 200H1040M0 300H1040"/></g><g id="stairs"></g><rect x="800" y="100" width="170" height="120" fill="#0d1517" stroke="#4a6a6e" stroke-width="3"/><text x="885" y="168" fill="#5f8387" font-size="22" text-anchor="middle" font-family="Orbit,sans-serif">DOOR 4F</text><g id="man"><circle cx="0" cy="-64" r="13" fill="#d9d2c6"/><path d="M0-50v38M0-42l-14 18M0-42l14 18M0-12l-11 28M0-12l11 28" stroke="#d9d2c6" stroke-width="7" stroke-linecap="round" fill="none"/></g><g id="rob"><rect x="-20" y="-58" width="40" height="34" rx="9" fill="#D5EDF1"/><circle cx="-8" cy="-42" r="3.6" fill="#460E21"/><circle cx="8" cy="-42" r="3.6" fill="#460E21"/><rect x="-24" y="-74" width="48" height="14" fill="#ECD5B3"/><path d="M-12-24v22M12-24v22" stroke="#D5EDF1" stroke-width="7" stroke-linecap="round"/></g><g id="badge" opacity="0"><rect x="560" y="470" width="400" height="64" fill="#0d1517" stroke="#D5EDF1" stroke-width="2"/><text x="760" y="512" fill="#D5EDF1" font-size="28" text-anchor="middle" font-family="Orbit,sans-serif">Delivered in 29:59 ✓</text></g></g></svg>';
  let s='';for(let i=0;i<16;i++){const x=70+i*52,y=528-i*24.6;s+='<path d="M'+x+' '+y+'h52v14h-52z" fill="#2c4144" stroke="#4a6a6e" stroke-width="2"/>'}
  $('#stairs').innerHTML=s;
}
const objPos=t=>({m:kf(MAN,t),r:kf(ROB,t)});
function placeObjs(t){
  const {m,r}=objPos(t);const mn=$('#man'),rb=$('#rob'),bd=$('#badge');if(!mn)return;
  mn.setAttribute('transform','translate('+m[1]+','+m[2]+') rotate('+m[3]+')');
  rb.setAttribute('transform','translate('+r[1]+','+r[2]+')');
  bd.setAttribute('opacity',t>=21.5?1:0);
}
function boxFor(mk,t){ // 영상 영역(1600x900 = 16:9) 기준 % [x,y,w,h]
  if(mk.k){const a=kf(mk.k,t);return [a[1],a[2],a[3],a[4]]}
  const {m,r}=objPos(t);let cx,cy,w,h;
  if(mk.follow==='man'){cx=m[1];cy=m[2]-34;w=96;h=130}
  else if(mk.follow==='robot'){cx=r[1];cy=r[2]-38;w=96;h=96}
  else if(mk.follow==='door'){cx=r[1];cy=r[2]-40;w=110;h=110}
  else{cx=(m[1]+r[1])/2;cy=Math.min(m[2],r[2])-34;w=Math.abs(m[1]-r[1])+120;h=140}
  return [((cx-w/2)*K)/VW*100,((cy-h/2)*K)/VH*100,(w*K)/VW*100,(h*K)/VH*100];
}
function buildMarks(){
  const box=$('#mks');box.innerHTML='';
  MARKS.forEach((mk,i)=>{const e=document.createElement('div');e.className='mk';e.innerHTML='<i>단서 '+(i+1)+'</i>';e.addEventListener('click',ev=>{ev.stopPropagation();if(pending===i)reveal(i,false);else if(isFound(i)&&!busy)reveal(i,true)});box.appendChild(e);mk.el=e;
    const tk=document.createElement('div');tk.className='tk';{const f=(mk.t0+TRIG)/DUR;tk.style.left=BX(f)+'px';tk.style.top=(BY(f)-17)+'px'}$('#bar').appendChild(tk);mk.tk=tk});
}
function refresh(){
  const t=T();if(!vid)placeObjs(t);
  {const f=t/DUR;$('#fillp').setAttribute('stroke-dasharray',(f*100)+' 100');const h=$('#head');h.style.left=BX(f)+'px';h.style.top=BY(f)+'px';const s=Math.floor(t);$('#hc').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
  MARKS.forEach((mk,i)=>{
    const on=!$('#vw').classList.contains('zoomed')&&t>=mk.t0&&t<=mk.t1&&(isFound(i)||playing||busy);
    mk.el.classList.toggle('show',on);mk.el.classList.toggle('alert',pending===i);mk.el.classList.toggle('done',isFound(i));
    if(on){const b=boxFor(mk,t);mk.el.style.left=b[0]+'%';mk.el.style.top=b[1]+'%';mk.el.style.width=b[2]+'%';mk.el.style.height=b[3]+'%'}
  });
  $('#pp').classList.toggle('paused',!playing);
}
function play(){playing=true;$('#dlg').classList.remove('on');$('#dimv').classList.remove('on');if(vid){vid.play().catch(()=>{})}}
function pause(){playing=false;if(vid)vid.pause()}
function tick(ts){
  if(!lastTs)lastTs=ts;const dt=Math.min(0.1,(ts-lastTs)/1000);lastTs=ts;
  if(playing){
    if(!vid)vt+=dt;
    const t=T();
    if(t>=DUR-0.05){setT(0)}
    else if(!busy&&!drag){for(let i=0;i<MARKS.length;i++){const mk=MARKS[i];if(!isFound(i)&&t>=mk.t0+TRIG&&t<=mk.t1){clue(i);break}}}
  }
  refresh();requestAnimationFrame(tick);
}
/* 재생 바 + 영상 눌러 정지/재생 */
(function(){
  const bar=$('#bar');
  const at=e=>{const r=bar.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*800;return clamp((x-20)/760,0,1)*DUR};
  bar.addEventListener('pointerdown',e=>{if(busy||!started)return;e.stopPropagation();drag=true;bar.setPointerCapture(e.pointerId);setT(at(e))});
  bar.addEventListener('pointermove',e=>{if(drag)setT(at(e))});
  bar.addEventListener('pointerup',()=>{drag=false});
  $('#pp').addEventListener('click',e=>{e.stopPropagation();if(busy||!started)return;playing?pause():play()});
  $('#vw').addEventListener('click',e=>{if(busy||!started||e.target.closest('#bar')||e.target.closest('#pp')||e.target.closest('.mk.done'))return;playing?pause():play()});
})();

/* ---------- 왼쪽 패널 대사 ---------- */
let typeTok=0,typing=false,fastType=false,nextH=null;
function tchars(h){return h.replace(/<em>(.*?)<\/em>/g,'\u0001$1\u0002').split('').map(c=>(c==='\u0001'||c==='\u0002')?c:(c==='<'?c:'<span class="tc">'+c+'</span>')).join('').replace(/\u0001/g,'<em>').replace(/\u0002/g,'</em>')}
function tchars2(h){ // <br> 보존
  return h.split('<br>').map(seg=>tchars(seg)).join('<br>');
}
function holes(){ // 단서 사각형 안쪽은 블러/딤에서 제외
  const d=$('#dimv'),vr=$('#vw').getBoundingClientRect(),sc=vr.width/1600;
  let path='M0 0H1600V900H0Z';
  document.querySelectorAll('.mk.show').forEach(m=>{const r=m.getBoundingClientRect();if(!r.width)return;
    const x=(r.left-vr.left)/sc,y=(r.top-vr.top)/sc,w=r.width/sc,h=r.height/sc;
    path+=' M'+x.toFixed(1)+' '+y.toFixed(1)+'h'+w.toFixed(1)+'v'+h.toFixed(1)+'h-'+w.toFixed(1)+'Z'});
  const u='url(\"data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 1600 900\'><path fill-rule=\'evenodd\' d=\''+path+'\'/></svg>\")';
  d.style.webkitMaskImage=u;d.style.maskImage=u;d.style.webkitMaskSize=d.style.maskSize='100% 100%';
}
async function say(who,txt,wait=true,ai=false,el='#tx'){
  const tok=++typeTok;typing=true;fastType=false;nextH=null;
  if(el==='#tx'&&txt){$('#dlg').classList.add('on');if(!playing){$('#dimv').classList.add('on');holes()}}
  if(el==='#tx'){$('#dlg').classList.toggle('ai',ai);$('#who').textContent=who;$('#nx').style.visibility='hidden';}
  $(el).innerHTML=tchars2(txt);
  const cs=[...document.querySelectorAll(el+' .tc')];
  for(const c of cs){if(tok!==typeTok)return;c.classList.add('on');if(!fastType)await sleep(30)}
  typing=false;
  if(!wait)return;
  $('#nx').style.visibility='visible';
  await new Promise(r=>{setTimeout(()=>{nextH=()=>{nextH=null;$('#nx').style.visibility='hidden';r()}},FAST?0:300)});
}
function advance(){if(typing)return;if(nextH)nextH()}
$('#vw').addEventListener('click',e=>{if(e.target.closest('#skip'))return;if(nextH){advance();e.stopPropagation()}},true);
addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.key==='r'||e.key==='R'){if(parent!==window)post({gbd:'restart'});else location.reload();return}
  if(e.key==='Enter'||e.key===' '){if(nextH||typing){e.preventDefault();advance()}}
});

/* ---------- 확대 박스 ---------- */
async function snapshotSource(){
  if(vid)return {el:vid,w:vid.videoWidth,h:vid.videoHeight,cover:true};
  const svg=$('#vp svg');const x=new XMLSerializer().serializeToString(svg);
  return new Promise(res=>{const img=new Image();img.onload=()=>res({el:img,w:VW,h:VH,cover:false});img.onerror=()=>res(null);img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(x)});
}
function toSrc(src,ax,ay){ // 영역 좌표 -> 원본 좌표
  if(!src.cover)return [ax,ay,1];
  const s=Math.max(VW/src.w,VH/src.h),ox=(src.w*s-VW)/2,oy=(src.h*s-VH)/2;return [(ax+ox)/s,(ay+oy)/s,s];
}
const LT={x:100,y:190,w:760,h:428}; // 16:9 확대 영상 위치
async function openLens(i){
  const mk=MARKS[i],b=boxFor(mk,Math.max(mk.t0,Math.min(T(),mk.t1)));
  let bx=b[0]/100*VW,by=b[1]/100*VH,bw=b[2]/100*VW,bh=b[3]/100*VH;
  const cv=$('#lc');cv.width=1280;cv.height=720;
  const src=await snapshotSource();
  if(src){ // 대체 화면: 단서 주변을 16:9로 잘라 보여준다 (clue 영상이 없을 때)
    const cx=bx+bw/2,cy=by+bh/2,rw=clamp(bw*3.4,420,VW),rh=rw*9/16;
    const rx=clamp(cx-rw/2,0,VW-rw),ry=clamp(cy-rh/2,0,VH-rh);
    const ctx=cv.getContext('2d');const a=toSrc(src,rx,ry),c=toSrc(src,rx+rw,ry+rh);
    ctx.drawImage(src.el,a[0],a[1],c[0]-a[0],c[1]-a[1],0,0,cv.width,cv.height);
  }
  const lv=$('#lv');lv.style.display='none';lv.onloadeddata=()=>{lv.style.display='block';lv.currentTime=0;lv.play().catch(()=>{})};lv.onerror=()=>{lv.style.display='none'};
  lv.src='media/clue'+(i+1)+'.mp4';
  const L=$('#lens');L.classList.add('nt');
  L.style.left=bx+'px';L.style.top=by+'px';L.style.width=bw+'px';L.style.height=bh+'px';
  L.classList.add('on');void L.offsetWidth;L.classList.remove('nt');
  $('#vw').classList.add('zoomed');
  L.style.left=LT.x+'px';L.style.top=LT.y+'px';L.style.width=LT.w+'px';L.style.height=LT.h+'px';
  L._from=[bx,by,bw,bh];
  await sleep(800);
}
async function closeLens(){
  const L=$('#lens'),f=L._from||[0,0,0,0],lv=$('#lv');
  lv.pause();
  L.style.left=f[0]+'px';L.style.top=f[1]+'px';L.style.width=f[2]+'px';L.style.height=f[3]+'px';
  await sleep(600);L.classList.remove('on');$('#vw').classList.remove('zoomed');lv.removeAttribute('src');lv.style.display='none';
}

/* ---------- 단서 발견 ---------- */
let pending=-1;
/* 1) 자동 정지: 이상한 지점에서 멈추고 사각형만 뜬다. 눌러야 전개된다 */
async function clue(i){
  if(busy)return;busy=true;pending=i;pause();
  $('#ft').innerHTML='';$('#fc').textContent='';
  say('요원','수상한 부분이 있습니다.',false);
}
/* 2) 사각형을 누르면: 확대 → AI 속마음 → 요원 한마디 → 영상 재개 */
let skipReq=false;
$('#skip').addEventListener('click',e=>{e.stopPropagation();skipReq=true;typeTok++;typing=false;if(nextH)nextH()});
async function reveal(i,reopen){
  const mk=MARKS[i];pending=-1;busy=true;skipReq=false;
  $('#dlg').classList.remove('on');$('#dimv').classList.remove('on');
  $('#ft').innerHTML='';$('#fc').textContent='';if(reopen){pause();$('#skip').classList.add('on')}
  $('#vw').classList.add('ai');
  typeTok++;$('#tx').innerHTML='';$('#who').textContent='';
  await sleep(250);
  await openLens(i);
  $('#aib').classList.add('on');await sleep(300);
  /* AI 생각 → 그다음 요원 대사 (순서대로) */
  if(!skipReq)await say('',mk.lines.join('<br>'),false,true,'#ft');
  if(!skipReq)await sleep(900);
  if(!skipReq){await say('요원',mk.ag,false,false);
    if(!reopen)await rollSent(found.length+1);
    if(!skipReq){$('#nx').style.visibility='visible';await new Promise(r=>{nextH=()=>{nextH=null;$('#nx').style.visibility='hidden';r()}})}}
  else if(!reopen)await rollSent(found.length+1);
  $('#skip').classList.remove('on');$('#nx').style.visibility='hidden';
  $('#aib').classList.remove('on');$('#dlg').classList.remove('on');
  await sleep(500);$('#sj').classList.remove('on'); /* 대사가 사라진 다음에 영상이 닫힌다 */
  await closeLens();
  $('#vw').classList.remove('ai');
  if(!reopen&&!isFound(i)){found.push(i);mk.tk.classList.add('done');mk.tk.dataset.c='단서 '+(i+1)+' · '+mk.c}
  if(found.length>=N()&&!asked){asked=true;await finish();return}
  busy=false;if(!reopen)setT(Math.max(T(),mk.t0+TRIG+0.05));play();
}
let asked=false;
const SENT=['징역 10년','징역 8년','징역 6년','징역 4년','징역 2년','무죄'];
const YRS=[10,8,6,4,2,0];
async function rollSent(n){
  const b=$('#sv'),d=$('#sd'),j=$('#sj'),from=YRS[Math.min(n-1,5)],to=YRS[Math.min(n,5)];
  b.classList.remove('free');b.innerHTML=from+'년';d.textContent='';
  j.classList.remove('on');void j.offsetWidth;j.classList.add('on');
  await sleep(700);
  d.textContent='−'+(from-to)+'년';
  for(let y=from-1;y>=to;y--){b.innerHTML='<span class="od"><i class="o">'+(y+1)+'</i><i class="n">'+y+'</i></span>년';await sleep(380)}
  if(to===0){b.textContent='무죄';b.classList.add('free')}
  await sleep(500);
}
async function finish(){
  await sleep(700);
  $('#vp').style.filter='brightness(.4)';
  $('#nv').classList.add('on');
  await sleep(1800);
  $('#nv').classList.remove('on');$('#vp').style.filter='';
  $('#ask').classList.add('on');
}
async function verdict(g){
  $('#ask').classList.remove('on');
  post({gbd:'part2-done',guilt:g});
  post({gbd:'part2-next'});
}
$('#yes').onclick=()=>verdict('yes');$('#no').onclick=()=>verdict('no');

/* ---------- 시작 ---------- */
async function loadAssets(){
  try{const r=await fetch('media/cctv_marks.json',{cache:'no-store'});if(r.ok){const j=await r.json();if(Array.isArray(j.marks)&&j.marks.length===ALL.length){j.marks.forEach((m,k)=>Object.assign(ALL[k],m));MARKS=ALL.filter(m=>!DROP.includes(m.c))}}}catch(_){}
  await new Promise(res=>{
    const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';v.src='media/cctv.mp4';
    const to=setTimeout(()=>res(),2500);
    v.addEventListener('loadedmetadata',()=>{clearTimeout(to);vid=v;$('#vp').appendChild(v);res()});
    v.addEventListener('error',()=>{clearTimeout(to);res()});
  });
  if(!vid)drawScene();
}
window.__go(async function main(){
  await loadAssets();buildMarks();
  refresh();requestAnimationFrame(tick);
  await sleep(500);
  await say('요원','경찰은 관련된 ‘사람들’을<br>용의자로 지목했군요…');
  await say('요원','하지만 우리 길바디는<br>해당 사건의 범인을 AI로 보고 있습니다.');
  await say('요원','CCTV와 당시 AI의 추론 과정을 대조해가며<br>단서를 수집합시다.');
  started=true;$('#dlg').classList.remove('on');$('#dimv').classList.remove('on');play();
});

/* ---------- 단서 북마크 호버 미리보기 (유튜브식) ---------- */
(()=>{
  const tip=$('#tip'),tv=tip.querySelector('video'),tb=tip.querySelector('.th b'),ti=tip.querySelector('.th i'),ts=tip.querySelector('small'),tt=tip.querySelector('.tt span');
  const bar=$('#bar'),vw=$('#vw');
  const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
  bar.addEventListener('mouseover',e=>{
    const tk=e.target.closest('.tk.done');if(!tk)return;
    const i=MARKS.findIndex(m=>m.tk===tk);if(i<0)return;const mk=MARKS[i];
    ts.textContent='단서 '+(i+1);tt.textContent=mk.c;tb.textContent=i+1;ti.textContent=fmt(mk.t0+TRIG);
    tv.style.display='none';tv.onloadeddata=()=>{tv.style.display='block';tv.play().catch(()=>{})};tv.onerror=()=>{tv.style.display='none'};
    tv.src='media/clue'+(i+1)+'.mp4';
    const r=tk.getBoundingClientRect(),vr=vw.getBoundingClientRect(),sc=vr.width/1600;
    const cx=(r.left+r.width/2-vr.left)/sc;
    tip.style.left=Math.max(16,Math.min(1600-264,cx-124))+'px';
    tip.classList.add('on');
  });
  bar.addEventListener('mouseout',e=>{const tk=e.target.closest('.tk.done');if(!tk)return;if(e.relatedTarget&&tk.contains(e.relatedTarget))return;tip.classList.remove('on');tv.pause()});
})();
